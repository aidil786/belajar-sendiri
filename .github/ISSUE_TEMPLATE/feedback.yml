name: "Feedback and rating · Maklum balas dan penilaian"
description: "Rate Belajar Sendiri and tell us what to keep or fix. · Nilai Belajar Sendiri dan beritahu apa yang patut kekal atau dibaiki."
title: "Feedback: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Short answers are perfect. This page is public, so please do not share private details.

        Terima kasih! Jawapan pendek pun bagus. Halaman ini boleh dilihat semua orang, jadi jangan kongsi butiran peribadi.
  - type: dropdown
    id: rating
    attributes:
      label: "How many stars? · Berapa bintang?"
      options:
        - "★★★★★ 5 · Love it · Suka sangat"
        - "★★★★☆ 4 · Good · Bagus"
        - "★★★☆☆ 3 · Okay · Okey"
        - "★★☆☆☆ 2 · Not great · Kurang bagus"
        - "★☆☆☆☆ 1 · Bad · Tak bagus"
    validations:
      required: true
  - type: dropdown
    id: course
    attributes:
      label: "Which course? · Kursus mana?"
      options:
        - "The whole site · Seluruh laman"
        - "Git & GitHub"
        - "Ship It (Docker, CI/CD, Kubernetes)"
        - "Level Up (Linux, Terraform & OpenTofu, Monitoring, AWS)"
    validations:
      required: false
  - type: dropdown
    id: language
    attributes:
      label: "Which language did you use? · Bahasa apa yang anda guna?"
      options:
        - "English"
        - "Bahasa Melayu"
        - "Both · Kedua-dua"
    validations:
      required: false
  - type: textarea
    id: liked
    attributes:
      label: "What did you like? · Apa yang anda suka?"
    validations:
      required: false
  - type: textarea
    id: fix
    attributes:
      label: "What should we fix or add? · Apa yang patut kami baiki atau tambah?"
    validations:
      required: false
