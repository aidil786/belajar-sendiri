name: "Report a problem · Laporkan masalah"
description: "Something is broken, or a lesson is wrong. · Ada yang rosak, atau pelajaran yang salah."
title: "Problem: "
labels: ["problem"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for telling us! A security problem? Please do **not** post it here. Use **Security → Report a vulnerability** instead.

        Terima kasih kerana memberitahu kami! Masalah keselamatan? Jangan tulis di sini. Guna **Security → Report a vulnerability**.
  - type: input
    id: page
    attributes:
      label: "Which page? · Halaman mana?"
      description: "Paste the address, like https://belajarsendiri.pages.dev/en/git/ · Tampal alamatnya"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "What happened? · Apa yang berlaku?"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What did you expect? · Apa yang anda jangka?"
    validations:
      required: false
  - type: dropdown
    id: device
    attributes:
      label: "Your device · Peranti anda"
      options:
        - "Phone · Telefon"
        - "Tablet"
        - "Computer · Komputer"
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: "Your browser · Pelayar anda"
      description: "For example Chrome, Safari or Firefox · Contohnya Chrome, Safari atau Firefox"
    validations:
      required: false
