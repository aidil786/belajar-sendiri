# Dependabot opens pull requests for outdated or vulnerable dependencies.
# Every pull request runs the full CI; nothing deploys until it is merged into main.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for the routine minor and patch updates.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node.js we run (.node-version: 24), not the newest Node.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # TypeScript 7 (the new native compiler) is not supported by our tools yet (astro check,
      # typescript-eslint). Move to it by hand when they support it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
