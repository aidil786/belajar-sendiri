# gitleaks (secret scanner) settings: the default rules, minus a few known teaching examples.
# These are made-up "secrets" that lessons show on purpose, a public image signing-key
# fingerprint, and UI text keys that contain the word "key". Nothing here is a real secret.
[extend]
useDefault = true

[allowlist]
description = "Lesson examples and text keys, not secrets"
regexes = [
  '''MyTestSecret-a1b2c3''',
  '''c3VwM3ItcmFoc2lh''',
  '''dckr_pat_test123''',
  '''7169605F62C751356D054A26A821E680E5FA6305''',
  '''^k9\.[A-Za-z.]+$''',
]
paths = [
  '''src/i18n/(en|ms)\.json''',
]
