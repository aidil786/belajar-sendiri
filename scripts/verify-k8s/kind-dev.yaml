# kind cluster for `npm run verify:k8s` in CI: `kind create cluster --name dev --config scripts/verify-k8s/kind-dev.yaml`
# gives the context kind-dev with nodes dev-control-plane, dev-worker and dev-worker2 (the engine's kind-dev cluster).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
