# Level Up, Part 4 "Pusat Beli-belah": Cloud with AWS. 4 worlds (A1–A4), 32 lessons + capstone mission 10.
# Plan: docs/LEVEL-UP-PLAN.md §1–2 and §6 (safety). Story: renting a unit in a big mall (units, keys, the monthly bill).
# Safety first: a budget alarm before the first resource, never the root user, smallest sizes,
# and a clean-up list at the end of every lesson that creates something.
# Folders: <world dir>/NN-<slug>/ (en.mdx + ms.mdx), bosses in <world dir>/boss/.
# status: ready = lesson exists; soon = shown on the map as "Coming soon".
# Content helpers: only flip status: soon → ready for lessons you wrote. Do not reorder or retitle.
id: aws
family: level-up
part: 4
partName: { en: "Pusat Beli-belah", ms: "Pusat Beli-belah" }
story:
  en: "The big mall. You rent units, hand out keys and pay a monthly bill."
  ms: "Pusat beli-belah besar. Anda sewa unit, beri kunci dan bayar bil bulanan."
hat: lanyard
tool: aws
toolVersion: "2026-11"
requires:
  - { course: linux, worlds: [3] }
  - { course: docker, worlds: [4] }
title: { en: "Cloud with AWS", ms: "Cloud dengan AWS" }
summary:
  en: "Rent a safe corner of the cloud. Set a budget alarm first."
  ms: "Sewa satu sudut cloud yang selamat. Pasang penggera bajet dahulu."
intro:
  en: "Every world is open. Start with A1: safety and a budget alarm before anything else."
  ms: "Semua dunia terbuka. Mula dengan A1: keselamatan dan penggera bajet sebelum apa-apa."

badges:
  - { id: budget-guard, icon: mall, name: { en: "Budget Guard", ms: "Pengawal Bajet" }, when: { lessons: [aws-a1-boss] } }
  - { id: least-privilege, icon: lock, name: { en: "Least Privilege", ms: "Keistimewaan Minimum" }, when: { lessons: [aws-a2-boss] } }
  - { id: aws-world-1, icon: mall, name: { en: "Safe Tenant", ms: "Penyewa Selamat" }, when: { world: 1 } }
  - { id: aws-world-2, icon: lock, name: { en: "Key Master", ms: "Tuan Kunci" }, when: { world: 2 } }
  - { id: aws-world-3, icon: route, name: { en: "Road Planner", ms: "Perancang Jalan" }, when: { world: 3 } }
  - { id: aws-world-4, icon: cloud, name: { en: "Cloud Shipper", ms: "Penghantar Cloud" }, when: { world: 4 } }

worlds:
  - id: 1
    code: A1
    slug: renting-a-unit
    dir: a1-renting-a-unit
    icon: mall
    color: working
    title: { en: "Renting a Unit", ms: "Sewa Unit" }
    summary:
      en: "Cloud basics, and safety first: a locked account and a budget alarm."
      ms: "Asas cloud, dan keselamatan dahulu: akaun berkunci dan penggera bajet."
    topics:
      en: "regions, Availability Zones, shared responsibility, root and MFA, budgets, CLI, free tier"
      ms: "region, Availability Zone, tanggungjawab bersama, root dan MFA, bajet, CLI, free tier"
    lessons:
      - { id: aws-a1-l01, slug: what-is-cloud, title: { en: "What cloud really means", ms: "Maksud sebenar cloud" }, minutes: 3, xp: 15, status: ready }
      - { id: aws-a1-l02, slug: regions-azs, title: { en: "Regions and Availability Zones", ms: "Region dan Availability Zone" }, minutes: 4, xp: 20, status: ready }
      - { id: aws-a1-l03, slug: shared-responsibility, title: { en: "Shared responsibility: who guards what", ms: "Tanggungjawab bersama: siapa jaga apa" }, minutes: 4, xp: 20, status: ready }
      - { id: aws-a1-l04, slug: account-safety, title: { en: "Root user, MFA and account safety", ms: "Pengguna root, MFA dan keselamatan akaun" }, minutes: 5, xp: 25, status: ready }
      - { id: aws-a1-l05, slug: budget-alarm, title: { en: "A budget alarm before anything else", ms: "Penggera bajet sebelum apa-apa" }, minutes: 5, xp: 25, status: ready }
      - { id: aws-a1-l06, slug: identity-center, title: { en: "IAM Identity Center or IAM users?", ms: "IAM Identity Center atau pengguna IAM?" }, minutes: 4, xp: 20, status: ready }
      - { id: aws-a1-l07, slug: aws-cli-profiles, title: { en: "The AWS CLI and profiles", ms: "AWS CLI dan profil" }, minutes: 4, xp: 20, status: ready }
      - { id: aws-a1-l08, slug: free-tier-cleanup, title: { en: "Free tier traps and clean-up", ms: "Perangkap free tier dan bersihkan" }, minutes: 4, xp: 20, status: ready }
    boss:
      id: aws-a1-boss
      title: { en: "A safe first day", ms: "Hari pertama yang selamat" }
      summary: { en: "Lock the root user, add MFA and set a budget alarm.", ms: "Kunci pengguna root, tambah MFA dan pasang penggera bajet." }
      xp: 50
      status: ready

  - id: 2
    code: A2
    slug: keys-guards
    dir: a2-keys-guards
    icon: lock
    color: staging
    title: { en: "Keys & Guards", ms: "Kunci & Pengawal" }
    summary:
      en: "IAM: who may do what. Give only the keys that are needed."
      ms: "IAM: siapa boleh buat apa. Beri kunci yang perlu sahaja."
    topics:
      en: "users, groups, roles, policies, deny wins, least privilege, access keys, OIDC"
      ms: "pengguna, kumpulan, role, polisi, deny menang, keistimewaan minimum, access key, OIDC"
    lessons:
      - { id: aws-a2-l01, slug: users-groups-roles, title: { en: "Users, groups and roles", ms: "Pengguna, kumpulan dan role" }, minutes: 4, xp: 20, status: ready }
      - { id: aws-a2-l02, slug: policies-json, title: { en: "Policies in JSON", ms: "Polisi dalam JSON" }, minutes: 5, xp: 25, status: ready }
      - { id: aws-a2-l03, slug: how-aws-decides, title: { en: "How AWS decides: deny wins", ms: "Cara AWS buat keputusan: deny menang" }, minutes: 5, xp: 25, status: ready }
      - { id: aws-a2-l04, slug: least-privilege, title: { en: "Least privilege", ms: "Keistimewaan minimum" }, minutes: 4, xp: 20, status: ready }
      - { id: aws-a2-l05, slug: roles-for-services, title: { en: "Roles for services", ms: "Role untuk servis" }, minutes: 4, xp: 20, status: ready }
      - { id: aws-a2-l06, slug: access-keys, title: { en: "Access keys: avoid them, rotate them", ms: "Access key: elakkan, tukar selalu" }, minutes: 3, xp: 15, status: ready }
      - { id: aws-a2-l07, slug: oidc-github, title: { en: "OIDC from GitHub Actions", ms: "OIDC dari GitHub Actions" }, minutes: 5, xp: 25, status: ready }
      - { id: aws-a2-l08, slug: boundaries-scps, title: { en: "Permission boundaries and SCPs", ms: "Permission boundary dan SCP" }, minutes: 3, xp: 15, status: ready }
    boss:
      id: aws-a2-boss
      title: { en: "Just enough keys", ms: "Kunci secukupnya" }
      summary: { en: "Let a CI role push one image. Nothing more.", ms: "Benarkan role CI push satu image. Tiada lebih." }
      xp: 50
      status: ready

  - id: 3
    code: A3
    slug: mall-roads
    dir: a3-mall-roads
    icon: route
    color: remote
    title: { en: "The Mall's Roads", ms: "Jalan Pusat Beli-belah" }
    summary:
      en: "Networks, servers and storage. Keep the private parts private."
      ms: "Rangkaian, server dan storan. Pastikan yang peribadi kekal peribadi."
    topics:
      en: "VPC, subnets, NAT, security groups, NACLs, EC2, load balancers, S3, Route 53"
      ms: "VPC, subnet, NAT, security group, NACL, EC2, load balancer, S3, Route 53"
    lessons:
      - { id: aws-a3-l01, slug: vpc, title: { en: "VPC: your own corner of the mall", ms: "VPC: sudut anda sendiri" }, minutes: 4, xp: 20, status: ready }
      - { id: aws-a3-l02, slug: subnets-public-private, title: { en: "Public and private subnets", ms: "Subnet awam dan peribadi" }, minutes: 5, xp: 25, status: ready }
      - { id: aws-a3-l03, slug: internet-nat, title: { en: "Internet and NAT gateways", ms: "Gateway internet dan NAT" }, minutes: 4, xp: 20, status: ready }
      - { id: aws-a3-l04, slug: sg-nacl, title: { en: "Security groups and NACLs", ms: "Security group dan NACL" }, minutes: 5, xp: 25, status: ready }
      - { id: aws-a3-l05, slug: ec2, title: { en: "EC2 basics", ms: "Asas EC2" }, minutes: 4, xp: 20, status: ready }
      - { id: aws-a3-l06, slug: load-balancers, title: { en: "Load balancers", ms: "Load balancer" }, minutes: 4, xp: 20, status: ready }
      - { id: aws-a3-l07, slug: s3, title: { en: "S3 buckets and Block Public Access", ms: "Bucket S3 dan Block Public Access" }, minutes: 5, xp: 25, status: ready }
      - { id: aws-a3-l08, slug: route53-cloudfront, title: { en: "Route 53 and CloudFront", ms: "Route 53 dan CloudFront" }, minutes: 3, xp: 15, status: ready }
    boss:
      id: aws-a3-boss
      title: { en: "Draw the mall's roads", ms: "Lukis jalan pusat beli-belah" }
      summary: { en: "Plan a VPC with public and private subnets. Let only the web in.", ms: "Rancang VPC dengan subnet awam dan peribadi. Hanya web boleh masuk." }
      xp: 50
      status: ready

  - id: 4
    code: A4
    slug: containers-cloud
    dir: a4-containers-cloud
    icon: cloud
    color: repo
    title: { en: "Containers in the Cloud", ms: "Container di Cloud" }
    summary:
      en: "Run Kedai Kancil's containers on AWS. Know what each part costs."
      ms: "Jalankan container Kedai Kancil di AWS. Tahu kos setiap bahagian."
    topics:
      en: "ECR, ECS, Fargate, EKS, RDS, Secrets Manager, OIDC deploys, costs"
      ms: "ECR, ECS, Fargate, EKS, RDS, Secrets Manager, deploy OIDC, kos"
    lessons:
      - { id: aws-a4-l01, slug: ecr, title: { en: "ECR: your image shelf", ms: "ECR: rak image anda" }, minutes: 3, xp: 15, status: ready }
      - { id: aws-a4-l02, slug: ecs, title: { en: "ECS: tasks and services", ms: "ECS: task dan service" }, minutes: 5, xp: 25, status: ready }
      - { id: aws-a4-l03, slug: fargate, title: { en: "Fargate: no servers to look after", ms: "Fargate: tiada server untuk dijaga" }, minutes: 4, xp: 20, status: ready }
      - { id: aws-a4-l04, slug: eks, title: { en: "EKS: managed Kubernetes", ms: "EKS: Kubernetes terurus" }, minutes: 4, xp: 20, status: ready }
      - { id: aws-a4-l05, slug: rds, title: { en: "RDS: a managed database", ms: "RDS: pangkalan data terurus" }, minutes: 4, xp: 20, status: ready }
      - { id: aws-a4-l06, slug: secrets, title: { en: "Secrets Manager and Parameter Store", ms: "Secrets Manager dan Parameter Store" }, minutes: 4, xp: 20, status: ready }
      - { id: aws-a4-l07, slug: deploy-oidc, title: { en: "Deploy from GitHub Actions with OIDC", ms: "Deploy dari GitHub Actions dengan OIDC" }, minutes: 5, xp: 25, status: ready }
      - { id: aws-a4-l08, slug: costs, title: { en: "Costs: what eats money", ms: "Kos: apa yang makan duit" }, minutes: 4, xp: 20, status: ready }
      - { id: aws-a4-m10, slug: mission-10-cloud, mission: 10, title: { en: "Capstone mission 10: Kedai Kancil in the cloud", ms: "Misi capstone 10: Kedai Kancil di cloud" }, minutes: 5, xp: 100, status: ready }
    boss:
      id: aws-a4-boss
      title: { en: "Move into the mall", ms: "Pindah ke pusat beli-belah" }
      summary: { en: "Pick services for Kedai Kancil, guess the bill and write the clean-up list.", ms: "Pilih servis untuk Kedai Kancil, anggar bil dan tulis senarai bersihkan." }
      xp: 50
      status: ready
