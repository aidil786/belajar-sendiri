# Ship It, Part 2 "Kilang": CI/CD. 4 worlds (C1–C4), 42 lessons + capstone missions 2 and 3.
# Plan: docs/SHIP-IT-PLAN.md §6. Starts where the Git course's World 7 (Robots) ends.
# Folders: <world dir>/NN-<slug>/ (en.mdx + ms.mdx), bosses in <world dir>/boss/.
# status: ready = lesson exists; soon = shown on the map as "Coming soon".
# Content helpers: only flip status: soon → ready for lessons you wrote. Do not reorder or retitle.
id: cicd
family: ship-it
part: 2
partName: { en: "Kilang", ms: "Kilang" }
story:
  en: "The central kitchen. Every recipe change is taste-tested and shipped by a conveyor belt."
  ms: "Dapur pusat. Setiap perubahan resepi diuji rasa dan dihantar oleh tali sawat."
hat: hardhat
tool: github-actions
toolVersion: "2026-10"
placement: cicd-c1-l01
requires:
  - { course: git, worlds: [7] }
title: { en: "CI/CD", ms: "CI/CD" }
summary:
  en: "Every pull request builds, tests and scans itself. Every merge ships a versioned image."
  ms: "Setiap pull request bina, uji dan imbas dirinya. Setiap merge hantar image berversi."
intro:
  en: "Every world is open. C1 starts with a short Robots recap. Pass it and skip ahead."
  ms: "Semua dunia terbuka. C1 bermula dengan ulang kaji Robot yang pendek. Lulus, dan terus ke depan."

badges:
  - { id: green-line, icon: belt, name: { en: "Green Line", ms: "Talian Hijau" }, when: { lessons: [cicd-c2-boss] } }
  - { id: hole-patcher, icon: shield, name: { en: "Hole Patcher", ms: "Penampal Lubang" }, when: { lessons: [cicd-c4-boss] } }
  - { id: cicd-world-1, icon: flow, name: { en: "Line Designer", ms: "Pereka Talian" }, when: { world: 1 } }
  - { id: cicd-world-2, icon: belt, name: { en: "Belt Builder", ms: "Pembina Tali Sawat" }, when: { world: 2 } }
  - { id: cicd-world-3, icon: truck, name: { en: "Safe Releaser", ms: "Pelancar Selamat" }, when: { world: 3 } }
  - { id: cicd-world-4, icon: shield, name: { en: "Pipeline Guard", ms: "Pengawal Pipeline" }, when: { world: 4 } }

