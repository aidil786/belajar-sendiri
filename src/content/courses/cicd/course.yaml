      ms: "Reka pipeline sebelum tulis YAML."
    lessons:
      - { id: cicd-c1-l01, slug: robots-recap, title: { en: "Robots recap", ms: "Ulang kaji Robot" }, minutes: 5, xp: 25, status: ready }
