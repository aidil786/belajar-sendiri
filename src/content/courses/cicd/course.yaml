      - { id: cicd-c1-l03, slug: stations-on-the-belt, title: { en: "Stations on the belt", ms: "Stesen pada tali sawat" }, minutes: 4, xp: 20, status: ready }
      - { id: cicd-c1-l04, slug: fast-feedback, title: { en: "Fast feedback and flaky tests", ms: "Maklum balas pantas dan ujian flaky" }, minutes: 4, xp: 20, status: ready }
      - { id: cicd-c1-l05, slug: testing-pyramid, title: { en: "The testing pyramid", ms: "Piramid ujian" }, minutes: 3, xp: 15, status: ready }
      - { id: cicd-c1-l06, slug: build-once-promote, title: { en: "Build once, promote through environments", ms: "Bina sekali, naikkan melalui persekitaran" }, minutes: 4, xp: 20, status: ready }
      - { id: cicd-c1-l07, slug: trunk-feature-flags, title: { en: "Trunk-based work and feature flags", ms: "Kerja trunk-based dan feature flag" }, minutes: 4, xp: 20, status: ready }
      - { id: cicd-c1-l08, slug: dora-metrics, title: { en: "DORA's five metrics", ms: "Lima metrik DORA" }, minutes: 4, xp: 20, status: ready }
      - { id: cicd-c1-l09, slug: other-ci-tools, title: { en: "Same ideas in GitLab, Jenkins, Azure", ms: "Idea sama dalam GitLab, Jenkins, Azure" }, minutes: 3, xp: 15, status: ready }
