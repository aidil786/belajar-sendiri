# Ship It, Part 1 "Dapur": Docker. 7 worlds (D0–D6), 69 lessons + capstone mission 1.
# Plan: docs/SHIP-IT-PLAN.md §5. Folders: <world dir>/NN-<slug>/ (en.mdx + ms.mdx), bosses in <world dir>/boss/.
# status: ready = lesson exists; soon = shown on the map as "Coming soon".
# Content helpers: only flip status: soon → ready for lessons you wrote. Do not reorder or retitle.
id: docker
family: ship-it
part: 1
partName: { en: "Dapur", ms: "Dapur" }
story:
  en: "Your home kitchen. Pack a dish so it tastes the same anywhere."
  ms: "Dapur rumah anda. Bungkus hidangan supaya rasanya sama di mana-mana."
hat: chef
tool: docker
toolVersion: "29"
placement: docker-d0-l10
requires:
  - { course: git, worlds: [0, 1, 2, 3, 4] }
title: { en: "Docker", ms: "Docker" }
summary:
  en: "Pack any app into a small, safe image. Run it anywhere with one command."
  ms: "Bungkus apa-apa aplikasi dalam image yang kecil dan selamat. Jalankan di mana-mana dengan satu arahan."
intro:
  en: "Every world is open. D0 to D4 build on each other. The placement test lets you skip what you know."
  ms: "Semua dunia terbuka. D0 hingga D4 bersambung. Ujian penempatan bantu anda langkau apa yang anda dah tahu."

badges:
  - { id: kek-lapis-master, icon: layers, name: { en: "Kek Lapis Master", ms: "Pakar Kek Lapis" }, when: { lessons: [docker-d2-l06] } }
  - { id: shrink-ray, icon: layers, name: { en: "Shrink Ray", ms: "Sinar Pengecut" }, when: { lessons: [docker-d2-boss] } }
