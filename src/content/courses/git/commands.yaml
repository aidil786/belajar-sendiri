# Command pages + cheat sheet. danger: safe | careful | lose (can lose work).
# confusable (optional): command ids that mean nearly the same; daily review never offers one as a wrong answer for the other.
groups:
  - { id: terminal, title: { en: "Terminal basics", ms: "Asas terminal" } }
  - { id: setup, title: { en: "Set up", ms: "Persediaan" } }
  - { id: save, title: { en: "Save your work", ms: "Simpan kerja anda" } }
  - { id: history, title: { en: "Look at history", ms: "Lihat sejarah" } }
  - { id: undo, title: { en: "Undo things", ms: "Undur" } }
  - { id: branch, title: { en: "Branches and merging", ms: "Branch dan merge" } }
  - { id: remote, title: { en: "Work with GitHub", ms: "Bekerja dengan GitHub" } }
  - { id: github, title: { en: "GitHub tools", ms: "Alatan GitHub" } }
  - { id: deep, title: { en: "Deep Git", ms: "Git mendalam" } }

commands:
  - id: pwd
    group: terminal
    syntax: "pwd"
    danger: safe
    lesson: git-w00-l02
    docs: "https://www.gnu.org/software/coreutils/manual/html_node/pwd-invocation.html"
    what: { en: "Shows the folder you are in right now.", ms: "Tunjuk folder tempat anda berada sekarang." }
    when: { en: "When you feel lost in the terminal.", ms: "Bila anda rasa sesat dalam terminal." }
    example: { command: "pwd", en: "Where am I?", ms: "Saya di mana?" }

  - id: ls
    group: terminal
    syntax: "ls [-a] [folder]"
    danger: safe
    lesson: git-w00-l02
    docs: "https://www.gnu.org/software/coreutils/manual/html_node/ls-invocation.html"
    what: { en: "Lists the files and folders here.", ms: "Senaraikan fail dan folder di sini." }
    when: { en: "To see what is inside a folder.", ms: "Untuk tengok isi sesuatu folder." }
    example: { command: "ls -a", en: "Show everything, even hidden files like .git.", ms: "Tunjuk semua, termasuk fail tersembunyi macam .git." }

  - id: cd
    group: terminal
    syntax: "cd <folder>"
    danger: safe
    lesson: git-w00-l02
    docs: "https://www.gnu.org/software/bash/manual/html_node/Bourne-Shell-Builtins.html"
    what: { en: "Moves you into another folder.", ms: "Bawa anda masuk ke folder lain." }
    when: { en: "To go to your project folder.", ms: "Untuk pergi ke folder projek anda." }
    example: { command: "cd diary", en: "Go into the diary folder.", ms: "Masuk ke folder diary." }
    variants:
      - { command: "cd ..", en: "Go up one folder.", ms: "Naik satu folder." }
      - { command: "cd ~", en: "Go to your home folder.", ms: "Pergi ke folder rumah anda." }

  - id: mkdir
    group: terminal
    syntax: "mkdir [-p] <folder>"
    danger: safe
    lesson: git-w00-l02
    docs: "https://www.gnu.org/software/coreutils/manual/html_node/mkdir-invocation.html"
    what: { en: "Makes a new folder.", ms: "Buat folder baru." }
    when: { en: "To start a new project folder.", ms: "Untuk mula folder projek baru." }
    example: { command: "mkdir diary", en: "Make a folder called diary.", ms: "Buat folder bernama diary." }

  - id: version
    group: setup
    syntax: "git --version"
    danger: safe
    lesson: git-w00-l03
    docs: "https://git-scm.com/docs/git"
    what: { en: "Shows which Git version you have.", ms: "Tunjuk versi Git yang anda ada." }
    when: { en: "To check Git is installed.", ms: "Untuk semak Git dah dipasang." }
    example: { command: "git --version", en: "Is Git here? Which version?", ms: "Git ada? Versi berapa?" }

  - id: config
    group: setup
    syntax: "git config [--global] <key> <value>"
    danger: safe
    lesson: git-w00-l04
    docs: "https://git-scm.com/docs/git-config"
    what: { en: "Reads or changes Git settings.", ms: "Baca atau ubah tetapan Git." }
    when: { en: "Once, when you set up a new computer.", ms: "Sekali, bila anda sediakan komputer baru." }
    example: { command: "git config --global user.name \"Aiman\"", en: "Tell Git your name, for all projects.", ms: "Beritahu Git nama anda, untuk semua projek." }
    variants:
      - { command: "git config --global user.email \"aiman@example.com\"", en: "Set your email.", ms: "Tetapkan e-mel anda." }
      - { command: "git config --global init.defaultBranch main", en: "New repos start on main.", ms: "Repo baru mula di main." }
      - { command: "git config --list", en: "Show all your settings.", ms: "Tunjuk semua tetapan anda." }

  - id: help
    group: setup
    syntax: "git help <command>  ·  git <command> -h"
    danger: safe
    lesson: git-w00-l08
    docs: "https://git-scm.com/docs/git-help"
    what: { en: "Shows help for a command.", ms: "Tunjuk bantuan untuk sesuatu arahan." }
    when: { en: "When you forget a flag.", ms: "Bila anda lupa sesuatu pilihan." }
    example: { command: "git add -h", en: "Short help, right in the terminal.", ms: "Bantuan ringkas, terus dalam terminal." }
    variants:
      - { command: "git help commit", en: "The full manual page.", ms: "Halaman manual penuh." }

  - id: init
    group: save
    syntax: "git init [folder]"
    danger: safe
    lesson: git-w01-l01
    docs: "https://git-scm.com/docs/git-init"
    what: { en: "Makes a folder into a Git repo.", ms: "Jadikan folder sebuah repo Git." }
    when: { en: "Once, at the start of a project.", ms: "Sekali, pada awal projek." }
    example: { command: "git init", en: "Git starts watching this folder.", ms: "Git mula jaga folder ini." }

  - id: status
    group: save
    syntax: "git status [-s]"
    danger: safe
    lesson: git-w01-l04
    docs: "https://git-scm.com/docs/git-status"
    what: { en: "Shows what changed and what is in the box.", ms: "Tunjuk apa yang berubah dan apa dalam kotak." }
    when: { en: "All the time. It never changes anything.", ms: "Setiap masa. Ia tak ubah apa-apa." }
    example: { command: "git status", en: "Green = in the box. Red = not yet.", ms: "Hijau = dalam kotak. Merah = belum." }
    variants:
      - { command: "git status -s", en: "A short view.", ms: "Paparan pendek." }

  - id: add
    group: save
    syntax: "git add <file> | . | -p"
    danger: safe
    lesson: git-w01-l03
    docs: "https://git-scm.com/docs/git-add"
    what: { en: "Puts changes in the box (staging area).", ms: "Masukkan perubahan ke dalam kotak (kawasan staging)." }
    when: { en: "When a change is ready to save.", ms: "Bila perubahan dah siap untuk disimpan." }
    example: { command: "git add index.html", en: "Put one file in the box.", ms: "Masukkan satu fail ke dalam kotak." }
    variants:
      - { command: "git add .", en: "Put all changes here in the box.", ms: "Masukkan semua perubahan di sini ke dalam kotak." }
      - { command: "git add -p", en: "Pick pieces of a change, one by one.", ms: "Pilih bahagian perubahan, satu demi satu." }

  - id: commit
    group: save
    syntax: "git commit -m \"<message>\""
    danger: safe
    lesson: git-w01-l05
    docs: "https://git-scm.com/docs/git-commit"
    what: { en: "Saves the box as a save point.", ms: "Simpan isi kotak sebagai titik simpan." }
    when: { en: "After git add, when one change is done.", ms: "Selepas git add, bila satu perubahan siap." }
    example: { command: "git commit -m \"Add day 1 page\"", en: "Save with a clear message.", ms: "Simpan dengan mesej yang jelas." }
    variants:
      - { command: "git commit -am \"Fix typo\"", en: "Add tracked changes and commit in one go.", ms: "Add perubahan yang dijejak dan commit sekali gus." }
      - { command: "git commit --amend -m \"Better message\"", en: "Replace the last commit. Not after you push!", ms: "Ganti commit terakhir. Jangan selepas push!" }

  - id: rm
    group: save
    syntax: "git rm [--cached] <file>"
    danger: careful
    lesson: git-w01-l10
    docs: "https://git-scm.com/docs/git-rm"
    what: { en: "Deletes a file and tells Git.", ms: "Padam fail dan beritahu Git." }
    when: { en: "When a file should leave the project.", ms: "Bila fail patut keluar dari projek." }
    example: { command: "git rm old.html", en: "Delete it and stage the delete.", ms: "Padam dan masukkan pemadaman ke kotak." }
    variants:
      - { command: "git rm --cached secret.txt", en: "Stop tracking it, but keep the file.", ms: "Berhenti jejak, tapi simpan fail itu." }

  - id: mv
    group: save
    syntax: "git mv <old> <new>"
    danger: safe
    lesson: git-w01-l10
    docs: "https://git-scm.com/docs/git-mv"
    what: { en: "Renames or moves a file.", ms: "Tukar nama atau alih fail." }
    when: { en: "When a file needs a better name.", ms: "Bila fail perlukan nama yang lebih baik." }
    example: { command: "git mv home.html index.html", en: "Rename it. Git knows it moved.", ms: "Tukar nama. Git tahu ia dialih." }

  - id: log
    group: history
    syntax: "git log [--oneline] [--graph] [--all] [-n <n>]"
    danger: safe
    lesson: git-w01-l07
    docs: "https://git-scm.com/docs/git-log"
    what: { en: "Lists your save points, newest first.", ms: "Senaraikan titik simpan anda, yang terbaru dulu." }
    when: { en: "To see what happened and when.", ms: "Untuk tengok apa berlaku dan bila." }
    example: { command: "git log --oneline", en: "One line per commit.", ms: "Satu baris setiap commit." }
    variants:
      - { command: "git log --oneline --graph --all", en: "Draw the whole history.", ms: "Lukis seluruh sejarah." }

  - id: show
    group: history
    syntax: "git show [commit]"
    danger: safe
    lesson: git-w01-l07
    docs: "https://git-scm.com/docs/git-show"
    what: { en: "Shows one commit and what it changed.", ms: "Tunjuk satu commit dan apa yang ia ubah." }
    when: { en: "To look inside an old save point.", ms: "Untuk tengok dalam titik simpan lama." }
    example: { command: "git show HEAD~1", en: "Show the commit before the last one.", ms: "Tunjuk commit sebelum yang terakhir." }

  - id: diff
    group: history
    syntax: "git diff [--staged] [a] [b]"
    danger: safe
    lesson: git-w01-l08
    confusable: [show]
    docs: "https://git-scm.com/docs/git-diff"
    what: { en: "Shows the changed lines. Red removed, green added.", ms: "Tunjuk baris yang berubah. Merah dibuang, hijau ditambah." }
    when: { en: "Before you add or commit.", ms: "Sebelum anda add atau commit." }
    example: { command: "git diff", en: "Changes not in the box yet.", ms: "Perubahan yang belum masuk kotak." }
    variants:
      - { command: "git diff --staged", en: "Changes in the box.", ms: "Perubahan dalam kotak." }
      - { command: "git diff HEAD~2 HEAD", en: "Between two commits.", ms: "Antara dua commit." }

  - id: branch
    group: history
    syntax: "git branch"
    danger: safe
    lesson: git-w01-l11
    docs: "https://git-scm.com/docs/git-branch"
    what: { en: "Lists branches. A star shows where you are.", ms: "Senaraikan branch. Bintang tunjuk tempat anda." }
    when: { en: "To check which branch you are on.", ms: "Untuk semak anda di branch mana." }
    example: { command: "git branch", en: "* main means you are on main.", ms: "* main maksudnya anda di main." }

  - id: restore
    group: undo
    syntax: "git restore [--staged] [--source=<commit>] <file>"
    danger: lose
    lesson: git-w02-l01
    confusable: [checkout]
    docs: "https://git-scm.com/docs/git-restore"
    what: { en: "Puts a file back to a saved version.", ms: "Kembalikan fail ke versi yang disimpan." }
    when: { en: "To throw away a change you don't want.", ms: "Untuk buang perubahan yang anda tak mahu." }
    example: { command: "git restore index.html", en: "Throw away changes. They are gone!", ms: "Buang perubahan. Ia hilang terus!" }
    variants:
      - { command: "git restore --staged index.html", en: "Take it out of the box. Safe: the change stays.", ms: "Keluarkan dari kotak. Selamat: perubahan kekal." }

  - id: reset
    group: undo
    syntax: "git reset [--soft | --mixed | --hard] <commit>"
    danger: careful
    lesson: git-w02-l04
    docs: "https://git-scm.com/docs/git-reset"
    what: { en: "Moves your branch back to an older commit.", ms: "Undurkan branch anda ke commit yang lebih lama." }
    when: { en: "Only for commits you have not shared yet.", ms: "Hanya untuk commit yang belum dikongsi." }
    example: { command: "git reset --soft HEAD~1", en: "Undo the last commit. Changes stay in the box.", ms: "Undur commit terakhir. Perubahan kekal dalam kotak." }
    variants:
      - { command: "git reset HEAD~1", en: "Changes go back to your folder.", ms: "Perubahan kembali ke folder anda." }
      - { command: "git reset --hard HEAD~1", en: "Changes are wiped. Danger!", ms: "Perubahan dihapus. Bahaya!" }

  - id: revert
    group: undo
    syntax: "git revert <commit>"
    danger: safe
    lesson: git-w02-l05
    docs: "https://git-scm.com/docs/git-revert"
    what: { en: "Makes a new commit that undoes an old one.", ms: "Buat commit baru yang membatalkan commit lama." }
    when: { en: "To undo a commit others already have.", ms: "Untuk undur commit yang orang lain dah ada." }
    example: { command: "git revert HEAD", en: "Undo the last commit, safely.", ms: "Undur commit terakhir, dengan selamat." }

  - id: switch
    group: undo
    syntax: "git switch <branch>  ·  git switch --detach <commit>"
    danger: safe
    lesson: git-w02-l07
    confusable: [checkout]
    docs: "https://git-scm.com/docs/git-switch"
    what: { en: "Moves HEAD to a branch, or to a commit.", ms: "Alih HEAD ke branch, atau ke commit." }
    when: { en: "To visit an old commit, then come back.", ms: "Untuk melawat commit lama, kemudian kembali." }
    example: { command: "git switch main", en: "Come back to main.", ms: "Kembali ke main." }
    variants:
      - { command: "git switch --detach HEAD~2", en: "Visit an old commit (detached HEAD).", ms: "Lawat commit lama (HEAD terlerai)." }
      - { command: "git switch -", en: "Go back to where you were.", ms: "Kembali ke tempat tadi." }

  - id: checkout
    group: undo
    syntax: "git checkout <commit>"
    danger: careful
    lesson: git-w02-l07
    docs: "https://git-scm.com/docs/git-checkout"
    what: { en: "The older way to switch branches or visit commits.", ms: "Cara lama untuk tukar branch atau lawat commit." }
    when: { en: "You will see it in old guides. Prefer switch and restore.", ms: "Anda akan jumpa dalam panduan lama. Lebih baik guna switch dan restore." }
    example: { command: "git checkout a1b2c3d", en: "Visit commit a1b2c3d (detached HEAD).", ms: "Lawat commit a1b2c3d (HEAD terlerai)." }

  - id: clean
    group: undo
    syntax: "git clean -n | -f [-d]"
    danger: lose
    lesson: git-w02-l08
    docs: "https://git-scm.com/docs/git-clean"
    what: { en: "Deletes untracked junk files.", ms: "Padam fail sampah yang tak dijejak." }
    when: { en: "To tidy up. Always preview with -n first.", ms: "Untuk kemas. Sentiasa pratonton dengan -n dulu." }
    example: { command: "git clean -n", en: "Preview only. Nothing is deleted.", ms: "Pratonton sahaja. Tiada yang dipadam." }
    variants:
      - { command: "git clean -f", en: "Delete them. Git can't bring them back.", ms: "Padam. Git tak boleh kembalikan." }
      - { command: "git clean -fd", en: "Untracked folders too.", ms: "Folder tak dijejak juga." }

  - id: reflog
    group: undo
    syntax: "git reflog"
    danger: safe
    lesson: git-w02-l09
    docs: "https://git-scm.com/docs/git-reflog"
    what: { en: "Shows every place HEAD has been.", ms: "Tunjuk semua tempat HEAD pernah pergi." }
    when: { en: "When commits seem lost after a reset.", ms: "Bila commit nampak hilang selepas reset." }
    example: { command: "git reflog", en: "Find the lost commit.", ms: "Cari commit yang hilang." }
    variants:
      - { command: "git reset --hard HEAD@{1}", en: "Jump back to where HEAD was one move ago.", ms: "Lompat balik ke tempat HEAD satu langkah lalu." }

  # --- World 3 commands (add new World 3 command pages below this line) ---

  - id: branch-manage
    group: branch
    syntax: "git branch <name> [<start>]  ·  git branch -d <name>"
    danger: careful
    lesson: git-w03-l01
    docs: "https://git-scm.com/docs/git-branch"
    what: { en: "Makes, renames or deletes a branch. A branch is a sticky note on a commit.", ms: "Buat, tukar nama atau padam branch. Branch ialah nota pelekat pada commit." }
    when: { en: "To start new work without touching main.", ms: "Untuk mula kerja baru tanpa sentuh main." }
    example: { command: "git branch feature/login-form", en: "Make a new branch here. You stay where you are.", ms: "Buat branch baru di sini. Anda kekal di tempat sama." }
    variants:
      - { command: "git branch -d feature/login-form", en: "Delete a branch that is already merged. Safe.", ms: "Padam branch yang dah di-merge. Selamat." }
      - { command: "git branch -D old-idea", en: "Delete it even if it is not merged. Careful!", ms: "Padam walaupun belum di-merge. Hati-hati!" }
      - { command: "git branch -m new-name", en: "Rename the branch you are on.", ms: "Tukar nama branch tempat anda berada." }
      - { command: "git branch --merged", en: "Which branches are already merged here?", ms: "Branch mana yang dah di-merge ke sini?" }

  - id: switch-create
    group: branch
    syntax: "git switch -c <name> [<start>]"
    danger: safe
    lesson: git-w03-l02
    docs: "https://git-scm.com/docs/git-switch"
    what: { en: "Makes a new branch and moves you onto it.", ms: "Buat branch baru dan bawa anda ke situ." }
    when: { en: "To start a new feature or fix right away.", ms: "Untuk terus mula ciri atau pembaikan baru." }
    example: { command: "git switch -c hotfix/pay-button", en: "New branch, and you are on it now.", ms: "Branch baru, dan anda kini di situ." }
    variants:
      - { command: "git checkout -b hotfix/pay-button", en: "The older way to do the same thing.", ms: "Cara lama untuk buat benda sama." }
      - { command: "git switch -", en: "Jump back to the branch you were on.", ms: "Lompat balik ke branch tadi." }

  - id: merge
    group: branch
    syntax: "git merge <branch>"
    danger: safe
    lesson: git-w03-l04
    docs: "https://git-scm.com/docs/git-merge"
    what: { en: "Joins another branch's work into the branch you are on.", ms: "Cantum kerja branch lain ke dalam branch tempat anda berada." }
    when: { en: "When a feature is ready to go into main.", ms: "Bila sesuatu ciri dah sedia untuk masuk ke main." }
    example: { command: "git merge feature/login-form", en: "Bring the login form into this branch.", ms: "Bawa borang log masuk ke branch ini." }
    variants:
      - { command: "git merge --no-ff feature/login-form", en: "Always make a merge commit, even if Git could fast-forward.", ms: "Sentiasa buat merge commit, walaupun Git boleh fast-forward." }
      - { command: "git merge --abort", en: "Stuck in a conflict? Go back to before the merge.", ms: "Tersekat dalam konflik? Kembali ke sebelum merge." }

  - id: stash
    group: branch
    syntax: "git stash [push -m <msg>]  ·  git stash pop"
    danger: careful
    lesson: git-w03-l09
    docs: "https://git-scm.com/docs/git-stash"
    what: { en: "Puts your unsaved changes in a drawer, so your folder is clean.", ms: "Simpan perubahan belum disimpan dalam laci, jadi folder bersih." }
    when: { en: "When you must switch branches but your work is not ready.", ms: "Bila anda perlu tukar branch tapi kerja belum siap." }
    example: { command: "git stash", en: "Put my changes away for now.", ms: "Simpan dulu perubahan saya." }
    variants:
      - { command: "git stash pop", en: "Take the newest stash back out.", ms: "Keluarkan semula stash paling baru." }
      - { command: "git stash list", en: "See what is in the drawer.", ms: "Tengok isi laci." }
      - { command: "git stash -u", en: "Also put away new, untracked files.", ms: "Simpan juga fail baru yang tak dijejak." }
      - { command: "git stash drop", en: "Throw one stash away. It is gone!", ms: "Buang satu stash. Ia hilang!" }

  - id: rebase
    group: branch
    syntax: "git rebase <branch>"
    danger: careful
    lesson: git-w03-l10
    docs: "https://git-scm.com/docs/git-rebase"
    what: { en: "Replays your commits on top of another branch. You get new commits.", ms: "Main semula commit anda di atas branch lain. Anda dapat commit baru." }
    when: { en: "To update your own branch before sharing it. Not on shared branches.", ms: "Untuk kemas kini branch sendiri sebelum dikongsi. Bukan pada branch kongsi." }
    example: { command: "git rebase main", en: "Put my branch's commits on top of the latest main.", ms: "Letak commit branch saya di atas main yang terkini." }
    variants:
      - { command: "git rebase --continue", en: "Go on after you fixed a conflict and added it.", ms: "Teruskan selepas anda baiki konflik dan add." }
      - { command: "git rebase --abort", en: "Cancel and go back to how it was.", ms: "Batal dan kembali macam asal." }
      - { command: "git rebase -i main", en: "Tidy your commits: squash, reword, drop, reorder.", ms: "Kemaskan commit anda: squash, reword, drop, susun semula." }

  - id: cherry-pick
    group: branch
    syntax: "git cherry-pick <commit>"
    danger: safe
    lesson: git-w03-l12
    docs: "https://git-scm.com/docs/git-cherry-pick"
    what: { en: "Copies one commit from somewhere else onto your branch.", ms: "Salin satu commit dari tempat lain ke branch anda." }
    when: { en: "When you need one fix, not a whole branch.", ms: "Bila anda perlu satu pembaikan, bukan seluruh branch." }
    example: { command: "git cherry-pick a1b2c3d", en: "Copy that one commit here.", ms: "Salin commit itu ke sini." }
    variants:
      - { command: "git cherry-pick --abort", en: "Stop and go back to before.", ms: "Berhenti dan kembali macam sebelum." }

  # --- World 4 commands (add new World 4 command pages below this line) ---

  - id: remote
    group: remote
    syntax: "git remote [-v]  ·  git remote add <name> <url>"
    danger: safe
    lesson: git-w04-l04
    docs: "https://git-scm.com/docs/git-remote"
    what: { en: "Lists or saves remotes: short names for online copies of your project.", ms: "Senarai atau simpan remote: nama pendek untuk salinan projek dalam talian." }
    when: { en: "To connect your project to a repo on GitHub.", ms: "Untuk sambungkan projek anda ke repo di GitHub." }
    example: { command: "git remote add origin https://github.com/you/diary.git", en: "Call this GitHub address origin.", ms: "Panggil alamat GitHub ini origin." }
    variants:
      - { command: "git remote -v", en: "Show each remote and its address.", ms: "Tunjuk setiap remote dan alamatnya." }
      - { command: "git remote rename origin upstream", en: "Give a remote a new name.", ms: "Beri remote nama baru." }
      - { command: "git remote set-url origin <new-url>", en: "The repo moved? Update the address.", ms: "Repo berpindah? Kemas kini alamatnya." }

  - id: push
    group: remote
    syntax: "git push [-u] [<remote> <branch>]"
    danger: careful
    lesson: git-w04-l05
    docs: "https://git-scm.com/docs/git-push"
    what: { en: "Sends your new commits to the remote, like GitHub.", ms: "Hantar commit baru anda ke remote, macam GitHub." }
    when: { en: "When your work is ready for others to see.", ms: "Bila kerja anda dah sedia untuk dilihat orang lain." }
    example: { command: "git push -u origin main", en: "First push: send main and remember where it goes.", ms: "Push pertama: hantar main dan ingat ke mana ia pergi." }
    variants:
      - { command: "git push", en: "After the first time, this is enough.", ms: "Selepas kali pertama, ini dah cukup." }
      - { command: "git push --tags", en: "Send your tags too.", ms: "Hantar tag anda juga." }
      - { command: "git push origin --delete old-branch", en: "Delete a branch on the remote.", ms: "Padam branch di remote." }

  - id: push-force
    group: remote
    syntax: "git push --force-with-lease"
    danger: lose
    lesson: git-w04-l10
    docs: "https://git-scm.com/docs/git-push"
    what: { en: "Overwrites the remote branch with yours. Other people's commits there can be lost.", ms: "Tindih branch remote dengan branch anda. Commit orang lain di sana boleh hilang." }
    when: { en: "Only on your own branch, after a rebase or amend.", ms: "Hanya pada branch sendiri, selepas rebase atau amend." }
    example: { command: "git push --force-with-lease", en: "Force, but stop if someone else pushed since your last fetch.", ms: "Paksa, tapi berhenti jika orang lain dah push sejak fetch terakhir anda." }
    variants:
      - { command: "git push --force", en: "Force with no safety check. Avoid it.", ms: "Paksa tanpa semakan keselamatan. Elakkan." }

  - id: clone
    group: remote
    syntax: "git clone <url> [<folder>]"
    danger: safe
    lesson: git-w04-l06
    docs: "https://git-scm.com/docs/git-clone"
    what: { en: "Copies a whole project, with all its history, to your computer.", ms: "Salin seluruh projek, dengan semua sejarahnya, ke komputer anda." }
    when: { en: "To start working on a project that is already online.", ms: "Untuk mula kerja pada projek yang dah ada dalam talian." }
    example: { command: "git clone https://github.com/you/diary.git", en: "Make a diary folder with the whole project.", ms: "Buat folder diary dengan seluruh projek." }

  - id: fetch
    group: remote
    syntax: "git fetch [<remote>]"
    danger: safe
    lesson: git-w04-l07
    docs: "https://git-scm.com/docs/git-fetch"
    what: { en: "Downloads news from the remote. Your own branches stay the same.", ms: "Muat turun berita dari remote. Branch anda sendiri kekal sama." }
    when: { en: "To see what others pushed before you join it in.", ms: "Untuk tengok apa orang lain push sebelum anda cantumkan." }
    example: { command: "git fetch", en: "Update origin/main, then look with git status.", ms: "Kemas kini origin/main, kemudian tengok dengan git status." }
    variants:
      - { command: "git fetch --prune", en: "Also forget remote branches that were deleted.", ms: "Lupakan juga branch remote yang dah dipadam." }

  - id: pull
    group: remote
    syntax: "git pull [--rebase | --no-rebase | --ff-only]"
    danger: careful
    lesson: git-w04-l07
    docs: "https://git-scm.com/docs/git-pull"
    what: { en: "Fetches, then joins the new commits into your branch.", ms: "Fetch, kemudian cantum commit baru ke dalam branch anda." }
    when: { en: "To catch up with your team before you push.", ms: "Untuk kejar pasukan anda sebelum push." }
    example: { command: "git pull", en: "Get the latest work from GitHub.", ms: "Dapatkan kerja terkini dari GitHub." }
    variants:
      - { command: "git pull --rebase", en: "Put your new commits on top of theirs.", ms: "Letak commit baru anda di atas commit mereka." }
      - { command: "git pull --no-rebase", en: "Join with a merge commit.", ms: "Cantum dengan merge commit." }
      - { command: "git config pull.rebase false", en: "Choose merge as your usual way to pull.", ms: "Pilih merge sebagai cara biasa untuk pull." }

  - id: tag
    group: remote
    syntax: "git tag [-a <name> -m <msg>] [<commit>]"
    danger: safe
    lesson: git-w04-l11
    docs: "https://git-scm.com/docs/git-tag"
    what: { en: "Puts a name that never moves on a commit, like v1.0.", ms: "Letak nama yang tak pernah bergerak pada commit, macam v1.0." }
    when: { en: "To mark a release.", ms: "Untuk tanda sesuatu keluaran." }
    example: { command: "git tag -a v1.0 -m \"First release\"", en: "Tag this commit as version 1.0, with a note.", ms: "Tag commit ini sebagai versi 1.0, dengan nota." }
    variants:
      - { command: "git tag", en: "List your tags.", ms: "Senaraikan tag anda." }
      - { command: "git push origin v1.0", en: "Send one tag to GitHub.", ms: "Hantar satu tag ke GitHub." }
      - { command: "git tag -d v1.0", en: "Delete a tag on your computer.", ms: "Padam tag di komputer anda." }

  # --- World 7 commands (add new World 7 command pages below this line) ---

  # --- World 8 commands (add new World 8 command pages below this line) ---
  - id: filter-repo
    group: undo
    syntax: "git filter-repo --sensitive-data-removal --invert-paths --path <file>"
    danger: lose
    lesson: git-w08-l04
    docs: "https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/removing-sensitive-data-from-a-repository"
    what: { en: "Rewrites history, for example to wipe a file from every commit. A separate tool you install.", ms: "Tulis semula sejarah, contohnya padam fail dari setiap commit. Alat berasingan yang anda pasang." }
    when: { en: "After a secret leaked, and only after you rotated the key.", ms: "Selepas rahsia bocor, dan hanya selepas anda rotate kunci itu." }
    example: { command: "git filter-repo --sensitive-data-removal --invert-paths --path .env", en: "Wipe .env from all history. Every later commit id changes.", ms: "Padam .env dari seluruh sejarah. Setiap id commit selepasnya berubah." }
    variants:
      - { command: "git filter-repo --sensitive-data-removal --replace-text ../secrets.txt", en: "Replace secret text listed in a file, in every commit.", ms: "Ganti teks rahsia yang disenaraikan dalam fail, dalam setiap commit." }

  # --- World 9 commands (add new World 9 command pages below this line) ---
  - id: gh-repo-clone
    group: github
    syntax: "gh repo clone <owner/repo> [folder]"
    danger: safe
    lesson: git-w09-l01
    docs: "https://cli.github.com/manual/gh_repo_clone"
    what: { en: "Copies a GitHub repo to your computer, like git clone.", ms: "Salin repo GitHub ke komputer anda, macam git clone." }
    when: { en: "To start working on a project that is on GitHub.", ms: "Untuk mula kerja pada projek yang ada di GitHub." }
    example: { command: "gh repo clone aina-codes/diary", en: "Copy the diary repo into a new diary folder.", ms: "Salin repo diary ke dalam folder diary baru." }

  - id: gh-repo-fork
    group: github
    syntax: "gh repo fork [<owner/repo>] [--clone]"
    danger: safe
    lesson: git-w09-l01
    docs: "https://cli.github.com/manual/gh_repo_fork"
    what: { en: "Makes your own copy (a fork) of a repo in your GitHub account.", ms: "Buat salinan sendiri (fork) bagi sesuatu repo dalam akaun GitHub anda." }
    when: { en: "To change a project you can't push to.", ms: "Untuk ubah projek yang anda tak boleh push." }
    example: { command: "gh repo fork aina-codes/diary --clone", en: "Fork the repo, then copy your fork to your computer.", ms: "Fork repo itu, kemudian salin fork anda ke komputer." }

  - id: gh-issue-create
    group: github
    syntax: "gh issue create [--title <text>] [--body <text>]"
    danger: safe
    lesson: git-w09-l01
    docs: "https://cli.github.com/manual/gh_issue_create"
    what: { en: "Opens a new issue on GitHub from your terminal.", ms: "Buka issue baru di GitHub dari terminal anda." }
    when: { en: "When you spot a bug or an idea and want to write it down.", ms: "Bila anda jumpa pepijat atau idea dan mahu catatkannya." }
    example: { command: "gh issue create --title \"Typo on home page\" --body \"It says Dairy.\"", en: "Report a typo. gh prints the new issue's link.", ms: "Laporkan salah ejaan. gh cetak pautan issue baru itu." }
    variants:
      - { command: "gh issue create --web", en: "Finish writing the issue in your browser.", ms: "Habiskan tulis issue itu dalam pelayar." }

  - id: gh-issue-list
    group: github
    syntax: "gh issue list [--label <name>] [--state open|closed|all]"
    danger: safe
    lesson: git-w09-l01
    docs: "https://cli.github.com/manual/gh_issue_list"
    what: { en: "Lists the open issues in this repo.", ms: "Senaraikan issue yang masih terbuka dalam repo ini." }
    when: { en: "To pick what to work on next.", ms: "Untuk pilih kerja seterusnya." }
    example: { command: "gh issue list --label bug", en: "Show only open issues labelled bug.", ms: "Tunjuk issue terbuka berlabel bug sahaja." }

  - id: gh-pr-create
    group: github
    syntax: "gh pr create [--fill | --title <text> --body <text>]"
    danger: safe
    lesson: git-w09-boss
    docs: "https://cli.github.com/manual/gh_pr_create"
    what: { en: "Opens a pull request for your current branch.", ms: "Buka pull request untuk branch anda sekarang." }
    when: { en: "After you push a branch and want a review.", ms: "Selepas anda push branch dan mahu ia disemak." }
    example: { command: "gh pr create --fill", en: "Use your commit message as the title and body.", ms: "Guna mesej commit anda sebagai tajuk dan isi." }
    variants:
      - { command: "gh pr create --title \"Fix typo\" --body \"Closes #5\"", en: "Write your own title and body.", ms: "Tulis tajuk dan isi sendiri." }

  - id: gh-pr-checkout
    group: github
    syntax: "gh pr checkout <number>"
    danger: safe
    lesson: git-w09-l01
    docs: "https://cli.github.com/manual/gh_pr_checkout"
    what: { en: "Brings a pull request's branch to your computer and switches to it.", ms: "Bawa branch sesuatu pull request ke komputer anda dan tukar ke branch itu." }
    when: { en: "To try a teammate's change before you review it.", ms: "Untuk cuba perubahan rakan sepasukan sebelum anda semak." }
    example: { command: "gh pr checkout 6", en: "Switch to the branch of pull request 6.", ms: "Tukar ke branch pull request 6." }

  - id: gh-codespace-create
    group: github
    syntax: "gh codespace create [--repo <owner/repo>]"
    danger: safe
    lesson: git-w09-l02
    docs: "https://cli.github.com/manual/gh_codespace_create"
    what: { en: "Starts a new Codespace: a computer in the cloud for a repo.", ms: "Mulakan Codespace baru: komputer di awan untuk sesuatu repo." }
    when: { en: "When you need a terminal and can't use your own computer.", ms: "Bila anda perlukan terminal tapi tak boleh guna komputer sendiri." }
    example: { command: "gh codespace create --repo aina-codes/diary", en: "Make a Codespace for the diary repo. Uses your monthly allowance.", ms: "Buat Codespace untuk repo diary. Ia guna had bulanan anda." }
    variants:
      - { command: "gh codespace code --web", en: "Open a Codespace in your browser.", ms: "Buka Codespace dalam pelayar anda." }
      - { command: "gh codespace stop", en: "Stop a Codespace when you are done.", ms: "Hentikan Codespace bila anda dah selesai." }

  # --- World 10 commands (add new World 10 command pages below this line) ---
  - id: cat-file
    group: deep
    syntax: "git cat-file (-t | -s | -p) <object>"
    danger: safe
    lesson: git-w10-l01
    docs: "https://git-scm.com/docs/git-cat-file"
    what: { en: "Shows one object from inside Git: a commit, tree, blob or tag.", ms: "Tunjuk satu objek dalam Git: commit, tree, blob atau tag." }
    when: { en: "To see what a commit really stores.", ms: "Untuk tengok apa yang sebenarnya disimpan oleh commit." }
    example: { command: "git cat-file -p HEAD", en: "Print the newest commit: its tree, parent, author and message.", ms: "Cetak commit terbaru: tree, induk, pengarang dan mesejnya." }
    variants:
      - { command: "git cat-file -t HEAD^{tree}", en: "Print the type of an object. Here it says tree.", ms: "Cetak jenis objek. Di sini ia sebut tree." }
      - { command: "git cat-file -s HEAD", en: "Print the size of an object in bytes.", ms: "Cetak saiz objek dalam bait." }

  - id: hash-object
    group: deep
    syntax: "git hash-object [-w] <file>"
    danger: safe
    lesson: git-w10-l03
    docs: "https://git-scm.com/docs/git-hash-object"
    what: { en: "Prints the id Git gives a file's content.", ms: "Cetak id yang Git beri kepada isi sesuatu fail." }
    when: { en: "To see that the same content always gets the same id.", ms: "Untuk tengok isi yang sama sentiasa dapat id yang sama." }
    example: { command: "git hash-object index.html", en: "Print the blob id of index.html. Nothing is saved.", ms: "Cetak id blob bagi index.html. Tiada apa disimpan." }
    variants:
      - { command: "git hash-object -w notes.txt", en: "Also save the content in Git as a blob.", ms: "Juga simpan isi itu dalam Git sebagai blob." }

  - id: ls-tree
    group: deep
    syntax: "git ls-tree [-r] [--name-only] <tree-ish> [<path>]"
    danger: safe
    lesson: git-w10-l03
    docs: "https://git-scm.com/docs/git-ls-tree"
    what: { en: "Lists the files and folders inside one tree.", ms: "Senaraikan fail dan folder dalam satu tree." }
    when: { en: "To see what a commit saved, without checking it out.", ms: "Untuk tengok apa yang commit simpan, tanpa checkout." }
    example: { command: "git ls-tree HEAD", en: "List the top folder of the newest commit.", ms: "Senaraikan folder atas bagi commit terbaru." }
    variants:
      - { command: "git ls-tree -r --name-only HEAD~1", en: "List every file of an older commit.", ms: "Senaraikan setiap fail bagi commit yang lebih lama." }

  - id: rev-parse
    group: deep
    syntax: "git rev-parse [--short] [--abbrev-ref] <rev>"
    danger: safe
    lesson: git-w10-l05
    docs: "https://git-scm.com/docs/git-rev-parse"
    what: { en: "Turns a name like HEAD~2 or main into a full commit id.", ms: "Tukar nama seperti HEAD~2 atau main kepada id commit penuh." }
    when: { en: "To check what a revision name points to.", ms: "Untuk semak nama revision itu tunjuk ke mana." }
    example: { command: "git rev-parse HEAD~2", en: "Print the full id of the commit two steps back.", ms: "Cetak id penuh commit dua langkah ke belakang." }
    variants:
      - { command: "git rev-parse --short HEAD", en: "Print the short id instead.", ms: "Cetak id pendek sebagai ganti." }
      - { command: "git rev-parse --abbrev-ref HEAD", en: "Print the name of your branch.", ms: "Cetak nama branch anda." }
      - { command: "git rev-parse --show-toplevel", en: "Print the top folder of this repo.", ms: "Cetak folder paling atas repo ini." }

  - id: log-search
    group: deep
    syntax: "git log (-S <text> | -G <regex> | --author=<name> | --grep=<text>)"
    danger: safe
    lesson: git-w10-l06
    docs: "https://git-scm.com/docs/git-log"
    what: { en: "Finds commits by what they changed, who made them, or their message.", ms: "Cari commit ikut apa yang diubah, siapa yang buat, atau mesejnya." }
    when: { en: "To find when a line or word came in or went out.", ms: "Untuk cari bila satu baris atau perkataan masuk atau keluar." }
    example: { command: "git log -S \"TODO\" --oneline", en: "Show commits that added or removed the word TODO.", ms: "Tunjuk commit yang tambah atau buang perkataan TODO." }
    variants:
      - { command: "git log -G \"phone|Call\" -p", en: "Show commits whose changed lines match, with their changes.", ms: "Tunjuk commit yang baris ubahannya padan, dengan perubahannya." }
      - { command: "git log --author=Aisyah --oneline", en: "Show only the commits Aisyah made.", ms: "Tunjuk commit yang Aisyah buat sahaja." }
      - { command: "git log --grep=footer -i --oneline", en: "Show commits whose message says footer, in any case.", ms: "Tunjuk commit yang mesejnya sebut footer, huruf besar atau kecil." }

  - id: grep
    group: deep
    syntax: "git grep [-n] [-i] <pattern> [<rev>]"
    danger: safe
    lesson: git-w10-l06
    docs: "https://git-scm.com/docs/git-grep"
    what: { en: "Searches the files Git tracks for a word or pattern.", ms: "Cari perkataan atau corak dalam fail yang Git jejak." }
    when: { en: "To find where something is used in your project.", ms: "Untuk cari di mana sesuatu digunakan dalam projek anda." }
    example: { command: "git grep -n footer", en: "Show every line with footer, with line numbers.", ms: "Tunjuk setiap baris dengan footer, berserta nombor baris." }
    variants:
      - { command: "git grep TODO HEAD~2", en: "Search the files as they were two commits ago.", ms: "Cari dalam fail seperti dua commit dahulu." }

  - id: blame
    group: deep
    syntax: "git blame [-L <start>,<end>] <file>"
    danger: safe
    lesson: git-w10-l06
    docs: "https://git-scm.com/docs/git-blame"
    what: { en: "Shows who last changed each line of a file, and in which commit.", ms: "Tunjuk siapa ubah setiap baris fail kali terakhir, dan dalam commit mana." }
    when: { en: "To learn why a line looks the way it does.", ms: "Untuk tahu kenapa satu baris jadi begitu." }
    example: { command: "git blame index.html", en: "Each line gets a commit id, a name and a date.", ms: "Setiap baris dapat id commit, nama dan tarikh." }
    variants:
      - { command: "git blame -L 2,3 index.html", en: "Look at lines 2 to 3 only.", ms: "Tengok baris 2 hingga 3 sahaja." }

  - id: shortlog
    group: deep
    syntax: "git shortlog [-s] [-n] [-e]"
    danger: safe
    lesson: git-w10-l06
    docs: "https://git-scm.com/docs/git-shortlog"
    what: { en: "Groups the commits by author.", ms: "Kumpulkan commit ikut pengarang." }
    when: { en: "To see who worked on a project, for credits or release notes.", ms: "Untuk tengok siapa kerja dalam projek, untuk kredit atau nota keluaran." }
    example: { command: "git shortlog -sn", en: "Count commits per person, the most first.", ms: "Kira commit setiap orang, yang paling banyak dulu." }

  - id: bisect
    group: deep
    syntax: "git bisect (start | good | bad | skip | run | log | reset)"
    danger: careful
    lesson: git-w10-l07
    docs: "https://git-scm.com/docs/git-bisect"
    what: { en: "Finds the commit that broke something by halving the history.", ms: "Cari commit yang merosakkan sesuatu dengan membelah dua sejarah." }
    when: { en: "When it worked before and you don't know which commit broke it.", ms: "Bila ia berfungsi dulu dan anda tak tahu commit mana yang merosakkannya." }
    example: { command: "git bisect start HEAD HEAD~9", en: "Bad is HEAD, good is nine commits back. Git checks out the middle.", ms: "Bad ialah HEAD, good sembilan commit ke belakang. Git checkout yang tengah." }
    variants:
      - { command: "git bisect good", en: "The commit you are testing works.", ms: "Commit yang anda uji berfungsi." }
      - { command: "git bisect bad", en: "The commit you are testing is broken.", ms: "Commit yang anda uji rosak." }
      - { command: "git bisect run sh test.sh", en: "Let a test script judge every step for you.", ms: "Biar skrip ujian menilai setiap langkah untuk anda." }
      - { command: "git bisect reset", en: "Finish and go back to your branch.", ms: "Tamatkan dan kembali ke branch anda." }

  - id: worktree
    group: deep
    syntax: "git worktree (add <path> [-b <branch>] | list | remove <path>)"
    danger: careful
    lesson: git-w10-l10
    docs: "https://git-scm.com/docs/git-worktree"
    what: { en: "Opens a second working folder for the same repo.", ms: "Buka folder kerja kedua untuk repo yang sama." }
    when: { en: "To fix something on another branch without leaving your work.", ms: "Untuk baiki sesuatu di branch lain tanpa tinggalkan kerja anda." }
    example: { command: "git worktree add ../hotfix -b hotfix", en: "Make folder ../hotfix on a new branch called hotfix.", ms: "Buat folder ../hotfix di branch baru bernama hotfix." }
    variants:
      - { command: "git worktree list", en: "Show every working folder and its branch.", ms: "Tunjuk setiap folder kerja dan branchnya." }
      - { command: "git worktree remove ../hotfix", en: "Delete that folder. The branch and its commits stay.", ms: "Padam folder itu. Branch dan commitnya kekal." }

  - id: alias
    group: deep
    syntax: "git config --global alias.<name> \"<command>\""
    danger: safe
    lesson: git-w10-l09
    confusable: [config]
    docs: "https://git-scm.com/docs/git-config"
    what: { en: "Makes a short name for a Git command you type often.", ms: "Buat nama pendek untuk arahan Git yang anda selalu taip." }
    when: { en: "When you are tired of typing a long command.", ms: "Bila anda penat taip arahan yang panjang." }
    example: { command: "git config --global alias.st status", en: "Now git st does the same as git status.", ms: "Sekarang git st sama dengan git status." }
    variants:
      - { command: "git config --global alias.lg \"log --oneline --graph --all\"", en: "git lg draws your whole history.", ms: "git lg lukis seluruh sejarah anda." }
      - { command: "git config --global --get-regexp alias", en: "List all your aliases.", ms: "Senaraikan semua alias anda." }

  - id: show-ref
    group: deep
    syntax: "git show-ref [--heads | --tags]"
    danger: safe
    lesson: git-w10-l02
    docs: "https://git-scm.com/docs/git-show-ref"
    what: { en: "Lists your refs (branches and tags) with the commit id of each.", ms: "Senaraikan ref anda (branch dan tag) dengan id commit setiap satu." }
    when: { en: "To see every name Git keeps, in a script-friendly list.", ms: "Untuk tengok setiap nama yang Git simpan, dalam senarai mesra skrip." }
    example: { command: "git show-ref", en: "Each line: an id, then a ref like refs/heads/main.", ms: "Setiap baris: id, kemudian ref seperti refs/heads/main." }
    variants:
      - { command: "git show-ref --heads", en: "Only branches.", ms: "Branch sahaja." }

  - id: pack-refs
    group: deep
    syntax: "git pack-refs [--all]"
    danger: safe
    lesson: git-w10-l02
    docs: "https://git-scm.com/docs/git-pack-refs"
    what: { en: "Moves many small ref files into one file, .git/packed-refs.", ms: "Pindahkan banyak fail ref kecil ke dalam satu fail, .git/packed-refs." }
    when: { en: "Rarely by hand: git gc does it for you.", ms: "Jarang dibuat sendiri: git gc buat untuk anda." }
    example: { command: "git pack-refs --all", en: "Pack branches too, not only tags.", ms: "Padatkan branch juga, bukan tag sahaja." }

  - id: gc
    group: deep
    syntax: "git gc [--prune=<date>] [--aggressive]"
    danger: careful
    lesson: git-w10-l04
    docs: "https://git-scm.com/docs/git-gc"
    what: { en: "Tidies the repo: packs objects and throws away ones nothing can reach.", ms: "Kemaskan repo: padatkan objek dan buang objek yang tiada apa boleh capai." }
    when: { en: "Rarely by hand. Git runs a light version by itself.", ms: "Jarang dibuat sendiri. Git jalankan versi ringan secara automatik." }
    example: { command: "git gc", en: "Pack and tidy now. Objects in the reflog stay safe.", ms: "Padat dan kemas sekarang. Objek dalam reflog kekal selamat." }
    variants:
      - { command: "git gc --prune=now", en: "Drop unreachable objects at once, with no grace time.", ms: "Buang objek yang tak boleh dicapai serta-merta, tanpa tempoh tangguh." }

  - id: maintenance
    group: deep
    syntax: "git maintenance (start | stop | run [--task=<task>])"
    danger: safe
    lesson: git-w10-l04
    docs: "https://git-scm.com/docs/git-maintenance"
    what: { en: "Keeps a repo fast with small tidy-up jobs, in the background.", ms: "Kekalkan repo laju dengan kerja kemas kecil, di belakang tabir." }
    when: { en: "For a big repo you use every day.", ms: "Untuk repo besar yang anda guna setiap hari." }
    example: { command: "git maintenance start", en: "Run the jobs on a schedule for this repo.", ms: "Jalankan kerja itu ikut jadual untuk repo ini." }
    variants:
      - { command: "git maintenance stop", en: "Stop the scheduled jobs.", ms: "Hentikan kerja berjadual itu." }

  - id: submodule
    group: deep
    syntax: "git submodule (add <url> <path> | update --init [--recursive] | status)"
    danger: careful
    lesson: git-w10-l11
    docs: "https://git-scm.com/docs/git-submodule"
    what: { en: "Keeps another repo inside yours, linked at one exact commit.", ms: "Simpan repo lain di dalam repo anda, dipaut pada satu commit yang tepat." }
    when: { en: "When you share code with other projects and want each to pick its version.", ms: "Bila anda kongsi kod dengan projek lain dan mahu setiap satu pilih versinya." }
    example: { command: "git submodule add https://github.com/you/kuih-menu.git menu", en: "Link the kuih-menu repo into a folder called menu.", ms: "Pautkan repo kuih-menu ke dalam folder bernama menu." }
    variants:
      - { command: "git submodule update --init --recursive", en: "Fill in empty submodule folders after a plain clone.", ms: "Isi folder submodule yang kosong selepas clone biasa." }
      - { command: "git clone --recurse-submodules https://github.com/you/shop.git", en: "Clone a repo and its submodules in one go.", ms: "Clone repo dan submodulenya sekali gus." }

  - id: sparse-checkout
    group: deep
    syntax: "git sparse-checkout (set <folder>... | disable)"
    danger: safe
    lesson: git-w10-l12
    docs: "https://git-scm.com/docs/git-sparse-checkout"
    what: { en: "Shows only some folders of a big repo in your working folder.", ms: "Papar sebahagian folder repo besar sahaja dalam folder kerja anda." }
    when: { en: "In a huge repo where you only work in one part.", ms: "Dalam repo gergasi yang anda kerja di satu bahagian sahaja." }
    example: { command: "git sparse-checkout set docs", en: "Show only the docs folder (and files at the top).", ms: "Papar folder docs sahaja (dan fail di bahagian atas)." }
    variants:
      - { command: "git sparse-checkout disable", en: "Show every folder again.", ms: "Papar semua folder semula." }

  - id: rerere
    group: deep
    syntax: "git rerere [forget <path> | diff | status]"
    danger: safe
    lesson: git-w10-l13
    docs: "https://git-scm.com/docs/git-rerere"
    what: { en: "Remembers how you fixed a conflict and replays the fix next time.", ms: "Ingat cara anda baiki konflik dan ulang pembaikan itu lain kali." }
    when: { en: "When you rebase often and the same conflicts keep coming back.", ms: "Bila anda kerap rebase dan konflik yang sama asyik muncul." }
    example: { command: "git config --global rerere.enabled true", en: "Turn it on once. Git records fixes by itself after that.", ms: "Hidupkan sekali. Selepas itu Git rakam pembaikan sendiri." }
    variants:
      - { command: "git rerere forget index.html", en: "Drop a recorded fix you no longer want.", ms: "Buang pembaikan yang dirakam yang anda tak mahu lagi." }

  - id: range-diff
    group: deep
    syntax: "git range-diff <base> <old-tip> <new-tip>"
    danger: safe
    lesson: git-w10-l13
    docs: "https://git-scm.com/docs/git-range-diff"
    what: { en: "Compares two versions of a branch, commit by commit.", ms: "Banding dua versi branch, satu commit demi satu commit." }
    when: { en: "After a rebase, or to review version 2 of a branch.", ms: "Selepas rebase, atau untuk semak versi 2 sesuatu branch." }
    example: { command: "git range-diff main feature@{1} feature", en: "Compare the branch before and after your rebase.", ms: "Banding branch sebelum dan selepas rebase anda." }

