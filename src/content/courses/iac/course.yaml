# Level Up, Part 2 "Pelan Arkitek": Terraform & OpenTofu. 4 worlds (T1–T4), 32 lessons + capstone mission 8.
# Plan: docs/LEVEL-UP-PLAN.md §1–2. Story: the architect's blueprint (plan first, then build).
# Lessons run OpenTofu 1.13 (`tofu`); Terraform 1.16 (`terraform`) reads the same language and is named where it differs.
# Folders: <world dir>/NN-<slug>/ (en.mdx + ms.mdx), bosses in <world dir>/boss/.
# status: ready = lesson exists; soon = shown on the map as "Coming soon".
# Content helpers: only flip status: soon → ready for lessons you wrote. Do not reorder or retitle.
id: iac
family: level-up
part: 2
partName: { en: "Pelan Arkitek", ms: "Pelan Arkitek" }
story:
  en: "The architect's blueprint. Draw the plan first, then build exactly that."
  ms: "Pelan arkitek. Lukis pelan dahulu, kemudian bina betul-betul seperti itu."
hat: pencil
tool: opentofu
toolVersion: "1.13"
requires:
  - { course: git, worlds: [4] }
  - { course: cicd, worlds: [1] }
title: { en: "Terraform & OpenTofu", ms: "Terraform & OpenTofu" }
summary:
  en: "Write your servers down as code. Plan, review, then build."
  ms: "Tulis server anda sebagai kod. Rancang, semak, kemudian bina."
intro:
  en: "Every world is open. T1 to T3 build on each other. Lessons use OpenTofu. Terraform uses the same language."
  ms: "Semua dunia terbuka. T1 hingga T3 bersambung. Pelajaran guna OpenTofu. Terraform guna bahasa yang sama."

badges:
  - { id: plan-reader, icon: blueprint, name: { en: "Plan Reader", ms: "Pembaca Plan" }, when: { lessons: [iac-t1-boss] } }
  - { id: drift-hunter, icon: team, name: { en: "Drift Hunter", ms: "Pemburu Drift" }, when: { lessons: [iac-t3-boss] } }
  - { id: iac-world-1, icon: blueprint, name: { en: "Blueprint Drawer", ms: "Pelukis Pelan" }, when: { world: 1 } }
  - { id: iac-world-2, icon: flow, name: { en: "Input Tamer", ms: "Penjinak Input" }, when: { world: 2 } }
  - { id: iac-world-3, icon: team, name: { en: "State Keeper", ms: "Penjaga State" }, when: { world: 3 } }
  - { id: iac-world-4, icon: package, name: { en: "Module Maker", ms: "Pembuat Modul" }, when: { world: 4 } }

worlds:
  - id: 1
    code: T1
    slug: blueprints
    dir: t1-blueprints
    icon: blueprint
    color: working
    title: { en: "Blueprints", ms: "Pelan" }
    summary:
      en: "Why write it down. The loop: init, plan, apply, destroy."
      ms: "Kenapa perlu tulis. Kitaran: init, plan, apply, destroy."
    topics:
      en: "HCL, providers, init, plan, apply, destroy, state, fmt, validate"
      ms: "HCL, provider, init, plan, apply, destroy, state, fmt, validate"
    lessons:
      - { id: iac-t1-l01, slug: click-or-code, title: { en: "Clicking vs writing it down", ms: "Klik atau tulis?" }, minutes: 3, xp: 15, status: ready }
      - { id: iac-t1-l02, slug: hcl-blocks, title: { en: "HCL blocks", ms: "Blok HCL" }, minutes: 4, xp: 20, status: ready }
      - { id: iac-t1-l03, slug: providers-init, title: { en: "Providers and init", ms: "Provider dan init" }, minutes: 4, xp: 20, status: ready }
      - { id: iac-t1-l04, slug: read-a-plan, title: { en: "Read a plan: + ~ - -/+", ms: "Baca plan: + ~ - -/+" }, minutes: 5, xp: 25, status: ready }
      - { id: iac-t1-l05, slug: apply-destroy, title: { en: "apply and destroy", ms: "apply dan destroy" }, minutes: 4, xp: 20, status: ready }
      - { id: iac-t1-l06, slug: state, title: { en: "State: the building's register", ms: "State: daftar bangunan" }, minutes: 4, xp: 20, status: ready }
      - { id: iac-t1-l07, slug: fmt-validate, title: { en: "fmt and validate", ms: "fmt dan validate" }, minutes: 3, xp: 15, status: ready }
      - { id: iac-t1-l08, slug: terraform-or-opentofu, title: { en: "Terraform or OpenTofu?", ms: "Terraform atau OpenTofu?" }, minutes: 4, xp: 20, status: ready }
    boss:
      id: iac-t1-boss
      title: { en: "Build a tiny food court", ms: "Bina medan selera kecil" }
      summary: { en: "Build local files with random names, then tear them down.", ms: "Bina fail tempatan dengan nama rawak, kemudian robohkan." }
      xp: 50
      status: ready

  - id: 2
    code: T2
    slug: inputs-outputs
    dir: t2-inputs-outputs
    icon: flow
    color: staging
    title: { en: "Inputs & Outputs", ms: "Input & Output" }
    summary:
      en: "Variables, outputs and loops. One blueprint, many buildings."
      ms: "Variable, output dan gelung. Satu pelan, banyak bangunan."
    topics:
      en: "variables, tfvars, outputs, locals, count, for_each, data sources, functions"
      ms: "variable, tfvars, output, locals, count, for_each, data source, fungsi"
    lessons:
      - { id: iac-t2-l01, slug: variables-types, title: { en: "Variables and types", ms: "Variable dan jenis" }, minutes: 4, xp: 20, status: ready }
      - { id: iac-t2-l02, slug: tfvars, title: { en: "tfvars files", ms: "Fail tfvars" }, minutes: 3, xp: 15, status: ready }
      - { id: iac-t2-l03, slug: outputs, title: { en: "Outputs", ms: "Output" }, minutes: 3, xp: 15, status: ready }
      - { id: iac-t2-l04, slug: locals, title: { en: "Locals: names for repeats", ms: "Locals: nama untuk ulangan" }, minutes: 3, xp: 15, status: ready }
      - { id: iac-t2-l05, slug: count, title: { en: "count: many of the same", ms: "count: banyak yang sama" }, minutes: 4, xp: 20, status: ready }
      - { id: iac-t2-l06, slug: for-each, title: { en: "for_each: one per item", ms: "for_each: satu setiap item" }, minutes: 5, xp: 25, status: ready }
      - { id: iac-t2-l07, slug: data-sources, title: { en: "Data sources: read what exists", ms: "Data source: baca apa yang ada" }, minutes: 4, xp: 20, status: ready }
      - { id: iac-t2-l08, slug: expressions-functions, title: { en: "Expressions and functions", ms: "Ungkapan dan fungsi" }, minutes: 5, xp: 25, status: ready }
    boss:
      id: iac-t2-boss
      title: { en: "Three stalls from one list", ms: "Tiga gerai dari satu senarai" }
      summary: { en: "Use variables and for_each to build three stalls. Output their names.", ms: "Guna variable dan for_each untuk bina tiga gerai. Paparkan nama mereka." }
      xp: 50
      status: ready

  - id: 3
    code: T3
    slug: state-teams
    dir: t3-state-teams
    icon: team
    color: remote
    title: { en: "State & Teams", ms: "State & Pasukan" }
    summary:
      en: "Share state safely. Fix drift. Refactor without rebuilding."
      ms: "Kongsi state dengan selamat. Baiki drift. Refactor tanpa bina semula."
    topics:
      en: "backends, locking, drift, import, moved, state commands, secrets, workspaces"
      ms: "backend, locking, drift, import, moved, arahan state, rahsia, workspace"
    lessons:
      - { id: iac-t3-l01, slug: remote-state, title: { en: "Remote state backends", ms: "Backend state jauh" }, minutes: 4, xp: 20, status: ready }
      - { id: iac-t3-l02, slug: locking, title: { en: "Locking: one builder at a time", ms: "Locking: seorang pembina pada satu masa" }, minutes: 3, xp: 15, status: ready }
      - { id: iac-t3-l03, slug: drift, title: { en: "Drift: someone clicked", ms: "Drift: ada orang klik" }, minutes: 4, xp: 20, status: ready }
      - { id: iac-t3-l04, slug: import-blocks, title: { en: "import blocks", ms: "Blok import" }, minutes: 4, xp: 20, status: ready }
      - { id: iac-t3-l05, slug: moved-blocks, title: { en: "moved blocks and refactors", ms: "Blok moved dan refactor" }, minutes: 4, xp: 20, status: ready }
      - { id: iac-t3-l06, slug: state-commands, title: { en: "state list, show and rm", ms: "state list, show dan rm" }, minutes: 4, xp: 20, status: ready }
      - { id: iac-t3-l07, slug: secrets-in-state, title: { en: "Sensitive values and secrets in state", ms: "Nilai sensitif dan rahsia dalam state" }, minutes: 4, xp: 20, status: ready }
      - { id: iac-t3-l08, slug: environments, title: { en: "Workspaces or folders per environment?", ms: "Workspace atau folder setiap persekitaran?" }, minutes: 4, xp: 20, status: ready }
    boss:
      id: iac-t3-boss
      title: { en: "Someone clicked", ms: "Ada orang klik" }
      summary: { en: "Find the drift, import the stray, rename without rebuilding.", ms: "Cari drift, import yang tersasar, tukar nama tanpa bina semula." }
      xp: 50
      status: ready

  - id: 4
    code: T4
    slug: modules-pipelines
    dir: t4-modules-pipelines
    icon: package
    color: repo
    title: { en: "Modules & Pipelines", ms: "Modul & Pipeline" }
    summary:
      en: "Reuse blueprints as modules. Plan every change in a pull request."
      ms: "Guna semula pelan sebagai modul. Plan setiap perubahan dalam pull request."
    topics:
      en: "modules, version pins, lock file, plan in CI, policy, cost, OIDC"
      ms: "modul, pin versi, fail lock, plan dalam CI, polisi, kos, OIDC"
    lessons:
      - { id: iac-t4-l01, slug: modules, title: { en: "Modules: a stall you can reuse", ms: "Modul: gerai yang boleh diguna semula" }, minutes: 5, xp: 25, status: ready }
      - { id: iac-t4-l02, slug: module-sources, title: { en: "Module sources and version pins", ms: "Sumber modul dan pin versi" }, minutes: 4, xp: 20, status: ready }
      - { id: iac-t4-l03, slug: lock-file, title: { en: "Provider pins and the lock file", ms: "Pin provider dan fail lock" }, minutes: 4, xp: 20, status: ready }
      - { id: iac-t4-l04, slug: plan-on-pr, title: { en: "A plan on every pull request", ms: "Plan pada setiap pull request" }, minutes: 5, xp: 25, status: ready }
      - { id: iac-t4-l05, slug: policy-checks, title: { en: "Policy checks", ms: "Semakan polisi" }, minutes: 4, xp: 20, status: ready }
      - { id: iac-t4-l06, slug: cost-checks, title: { en: "Cost checks", ms: "Semakan kos" }, minutes: 3, xp: 15, status: ready }
      - { id: iac-t4-l07, slug: secrets-oidc, title: { en: "Secrets and OIDC", ms: "Rahsia dan OIDC" }, minutes: 4, xp: 20, status: ready }
      - { id: iac-t4-l08, slug: when-not-iac, title: { en: "When not to use IaC", ms: "Bila tak perlu IaC" }, minutes: 3, xp: 15, status: ready }
      - { id: iac-t4-m8, slug: mission-8-blueprint, mission: 8, title: { en: "Capstone mission 8: Blueprint Kedai Kancil", ms: "Misi capstone 8: Pelan Kedai Kancil" }, minutes: 5, xp: 100, status: ready }
    boss:
      id: iac-t4-boss
      title: { en: "Review the blueprint", ms: "Semak pelan" }
      summary: { en: "Wrap it in a module, pin it, and plan it on a pull request.", ms: "Bungkus dalam modul, pin, dan plan pada pull request." }
      xp: 50
      status: ready
