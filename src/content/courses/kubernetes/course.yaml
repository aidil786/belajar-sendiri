# Ship It, Part 3 "Medan Selera": Kubernetes. 7 worlds (K1–K7), 81 lessons + capstone missions 4–6,
# plus Career Quest (world 8, 8 lessons). Plan: docs/SHIP-IT-PLAN.md §7–8.
# Level Up adds the CKA pack: world 9 (K9 Cluster Admin, 12 lessons), an optional extra pack
# (`extra: true`, docs/LEVEL-UP-PLAN.md §2). Career Quest stays the finale on every map.
# Folders: <world dir>/NN-<slug>/ (en.mdx + ms.mdx), bosses in <world dir>/boss/.
# status: ready = lesson exists; soon = shown on the map as "Coming soon".
# Content helpers: only flip status: soon → ready for lessons you wrote. Do not reorder or retitle.
id: kubernetes
family: ship-it
part: 3
partName: { en: "Medan Selera", ms: "Medan Selera" }
story:
  en: "The food court. A manager keeps many stalls serving, all day."
  ms: "Medan selera. Seorang pengurus pastikan banyak gerai terus menjual, sepanjang hari."
hat: captain
tool: kubernetes
toolVersion: "1.37"
placement: k8s-k1-l01
requires: []
title: { en: "Kubernetes", ms: "Kubernetes" }
summary:
  en: "Run an app that heals itself, scales at lunch rush and updates itself from Git."
  ms: "Jalankan aplikasi yang pulih sendiri, berskala waktu puncak dan dikemas kini sendiri dari Git."
intro:
  en: "Every world is open. K1 to K3 build on each other. K1 starts with a quick check of what you know."
  ms: "Semua dunia terbuka. K1 hingga K3 bersambung. K1 bermula dengan semakan pantas apa yang anda tahu."

