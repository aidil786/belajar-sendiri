# Level Up, Part 1 "Rumah Kedai": Linux & Networking. 4 worlds (L1–L4), 38 lessons + capstone mission 7.
# Plan: docs/LEVEL-UP-PLAN.md §1–2. Story: the shophouse (rooms, keys, staff, phone lines).
# Folders: <world dir>/NN-<slug>/ (en.mdx + ms.mdx), bosses in <world dir>/boss/.
# status: ready = lesson exists; soon = shown on the map as "Coming soon".
# Content helpers: only flip status: soon → ready for lessons you wrote. Do not reorder or retitle.
id: linux
family: level-up
part: 1
partName: { en: "Rumah Kedai", ms: "Rumah Kedai" }
story:
  en: "The shophouse. Rooms are folders, keys are permissions, staff run the jobs."
  ms: "Rumah kedai. Bilik ialah folder, kunci ialah kebenaran, pekerja jalankan tugas."
hat: toolbelt
tool: linux
toolVersion: "debian-13"
requires: []
title: { en: "Linux & Networking", ms: "Linux & Rangkaian" }
summary:
  en: "Drive a Linux server from the terminal. Find out why it can't connect."
  ms: "Pandu server Linux dari terminal. Cari sebab ia tak dapat bersambung."
intro:
  en: "Every world is open. You need no other course first. It is a good first step, even before Ship It."
  ms: "Semua dunia terbuka. Tak perlu kursus lain dahulu. Ia langkah pertama yang baik, malah sebelum Ship It."

badges:
  - { id: service-medic, icon: key, name: { en: "Service Medic", ms: "Doktor Servis" }, when: { lessons: [linux-l2-boss] } }
  - { id: path-finder, icon: network, name: { en: "Path Finder", ms: "Pencari Laluan" }, when: { lessons: [linux-l3-boss] } }
  - { id: linux-world-1, icon: shophouse, name: { en: "Shell Explorer", ms: "Peneroka Shell" }, when: { world: 1 } }
  - { id: linux-world-2, icon: key, name: { en: "Key Keeper", ms: "Pemegang Kunci" }, when: { world: 2 } }
  - { id: linux-world-3, icon: network, name: { en: "Line Fixer", ms: "Pembaiki Talian" }, when: { world: 3 } }
  - { id: linux-world-4, icon: server, name: { en: "Remote Chef", ms: "Chef Jarak Jauh" }, when: { world: 4 } }

worlds:
  - id: 1
    code: L1
    slug: shophouse
    dir: l1-shophouse
    icon: shophouse
    color: working
    title: { en: "The Shophouse", ms: "Rumah Kedai" }
    summary:
      en: "Move around the shell. Read, make and find files."
      ms: "Bergerak dalam shell. Baca, buat dan cari fail."
    topics:
      en: "pwd, cd, ls, cat, less, mkdir, cp, mv, rm, find, grep, pipes"
      ms: "pwd, cd, ls, cat, less, mkdir, cp, mv, rm, find, grep, pipe"
    lessons:
      - { id: linux-l1-l01, slug: terminal-prompt, title: { en: "The terminal and the prompt", ms: "Terminal dan prompt" }, minutes: 3, xp: 15, status: ready }
      - { id: linux-l1-l02, slug: where-am-i, title: { en: "Where am I? pwd, cd, ls", ms: "Saya di mana? pwd, cd, ls" }, minutes: 4, xp: 20, status: ready }
      - { id: linux-l1-l03, slug: read-files, title: { en: "Read files: cat, less, head, tail", ms: "Baca fail: cat, less, head, tail" }, minutes: 4, xp: 20, status: ready }
      - { id: linux-l1-l04, slug: make-copy-move, title: { en: "Make, copy, move: mkdir, cp, mv", ms: "Buat, salin, alih: mkdir, cp, mv" }, minutes: 4, xp: 20, status: ready }
      - { id: linux-l1-l05, slug: delete-with-care, title: { en: "Delete with care: rm has no undo", ms: "Padam dengan cermat: rm tiada undo" }, minutes: 4, xp: 20, status: ready }
      - { id: linux-l1-l06, slug: find-files, title: { en: "Find files with find", ms: "Cari fail dengan find" }, minutes: 4, xp: 20, status: ready }
      - { id: linux-l1-l07, slug: grep, title: { en: "Search inside files: grep", ms: "Cari dalam fail: grep" }, minutes: 4, xp: 20, status: ready }
      - { id: linux-l1-l08, slug: pipes-redirects, title: { en: "Pipes and redirects", ms: "Pipe dan redirect" }, minutes: 5, xp: 25, status: ready }
      - { id: linux-l1-l09, slug: wildcards-tab, title: { en: "Wildcards and tab completion", ms: "Wildcard dan tab completion" }, minutes: 3, xp: 15, status: ready }
    boss:
      id: linux-l1-boss
      title: { en: "Tidy the messy kitchen", ms: "Kemaskan dapur bersepah" }
      summary: { en: "Sort a messy folder: find, move and delete safely.", ms: "Susun folder bersepah: cari, alih dan padam dengan selamat." }
      xp: 50
      status: ready

  - id: 2
    code: L2
    slug: keys-staff
    dir: l2-keys-staff
    icon: key
    color: staging
    title: { en: "Keys & Staff", ms: "Kunci & Pekerja" }
    summary:
      en: "Users, permissions, processes, services and packages."
      ms: "Pengguna, kebenaran, proses, servis dan pakej."
    topics:
      en: "sudo, rwx, chmod, chown, ps, top, kill, PATH, systemctl, journalctl, apt"
      ms: "sudo, rwx, chmod, chown, ps, top, kill, PATH, systemctl, journalctl, apt"
    lessons:
      - { id: linux-l2-l01, slug: users-groups-sudo, title: { en: "Users, groups and sudo", ms: "Pengguna, kumpulan dan sudo" }, minutes: 4, xp: 20, status: ready }
      - { id: linux-l2-l02, slug: read-permissions, title: { en: "Read rwx permissions", ms: "Baca kebenaran rwx" }, minutes: 4, xp: 20, status: ready }
      - { id: linux-l2-l03, slug: chmod, title: { en: "Change permissions: chmod", ms: "Tukar kebenaran: chmod" }, minutes: 5, xp: 25, status: ready }
      - { id: linux-l2-l04, slug: chown, title: { en: "Change the owner: chown", ms: "Tukar pemilik: chown" }, minutes: 3, xp: 15, status: ready }
      - { id: linux-l2-l05, slug: processes, title: { en: "Processes: ps and top", ms: "Proses: ps dan top" }, minutes: 4, xp: 20, status: ready }
      - { id: linux-l2-l06, slug: signals-jobs, title: { en: "Signals, kill and jobs", ms: "Isyarat, kill dan job" }, minutes: 5, xp: 25, status: ready }
      - { id: linux-l2-l07, slug: env-path, title: { en: "Environment variables and PATH", ms: "Pemboleh ubah persekitaran dan PATH" }, minutes: 4, xp: 20, status: ready }
      - { id: linux-l2-l08, slug: systemctl, title: { en: "Services with systemctl", ms: "Servis dengan systemctl" }, minutes: 5, xp: 25, status: ready }
      - { id: linux-l2-l09, slug: journalctl, title: { en: "Logs with journalctl", ms: "Log dengan journalctl" }, minutes: 4, xp: 20, status: ready }
      - { id: linux-l2-l10, slug: apt, title: { en: "Packages with apt", ms: "Pakej dengan apt" }, minutes: 4, xp: 20, status: ready }
    boss:
      id: linux-l2-boss
      title: { en: "The service that won't start", ms: "Servis yang tak mahu hidup" }
      summary: { en: "Read the logs, fix the file, start it again.", ms: "Baca log, baiki fail, hidupkan semula." }
      xp: 50
      status: ready

  - id: 3
    code: L3
    slug: phone-lines
    dir: l3-phone-lines
    icon: network
    color: remote
    title: { en: "Phone Lines", ms: "Talian Telefon" }
    summary:
      en: "Addresses, ports, DNS and HTTP. Find why it can't connect."
      ms: "Alamat, port, DNS dan HTTP. Cari sebab ia tak dapat bersambung."
    topics:
      en: "IP, CIDR, ss, DNS, dig, curl, HTTPS, ufw, ping, traceroute"
      ms: "IP, CIDR, ss, DNS, dig, curl, HTTPS, ufw, ping, traceroute"
    lessons:
      - { id: linux-l3-l01, slug: ip-addresses, title: { en: "IP addresses: the shop's number", ms: "Alamat IP: nombor kedai" }, minutes: 4, xp: 20, status: ready }
      - { id: linux-l3-l02, slug: subnets-cidr, title: { en: "Subnets and CIDR", ms: "Subnet dan CIDR" }, minutes: 5, xp: 25, status: ready }
      - { id: linux-l3-l03, slug: ports-listening, title: { en: "Ports and listening: ss", ms: "Port dan mendengar: ss" }, minutes: 4, xp: 20, status: ready }
      - { id: linux-l3-l04, slug: localhost-all, title: { en: "localhost or 0.0.0.0?", ms: "localhost atau 0.0.0.0?" }, minutes: 3, xp: 15, status: ready }
      - { id: linux-l3-l05, slug: dns, title: { en: "DNS: dig and /etc/hosts", ms: "DNS: dig dan /etc/hosts" }, minutes: 5, xp: 25, status: ready }
      - { id: linux-l3-l06, slug: http-curl, title: { en: "HTTP with curl -v", ms: "HTTP dengan curl -v" }, minutes: 5, xp: 25, status: ready }
      - { id: linux-l3-l07, slug: https-certs, title: { en: "HTTPS and certificates", ms: "HTTPS dan sijil" }, minutes: 4, xp: 20, status: ready }
      - { id: linux-l3-l08, slug: firewalls, title: { en: "Firewalls: ufw and nftables", ms: "Firewall: ufw dan nftables" }, minutes: 4, xp: 20, status: ready }
      - { id: linux-l3-l09, slug: ping-traceroute, title: { en: "ping and traceroute", ms: "ping dan traceroute" }, minutes: 3, xp: 15, status: ready }
      - { id: linux-l3-l10, slug: cant-connect-ladder, title: { en: "The can't-connect ladder", ms: "Tangga tak dapat sambung" }, minutes: 5, xp: 25, status: ready }
    boss:
      id: linux-l3-boss
      title: { en: "Why can't the customer reach the shop?", ms: "Kenapa pelanggan tak sampai ke kedai?" }
      summary: { en: "Climb the ladder: DNS, port, firewall, service.", ms: "Panjat tangga: DNS, port, firewall, servis." }
      xp: 50
      status: ready

  - id: 4
    code: L4
    slug: remote-kitchens
    dir: l4-remote-kitchens
    icon: server
    color: repo
    title: { en: "Remote Kitchens", ms: "Dapur Jauh" }
    summary:
      en: "SSH into servers, schedule jobs and write safe scripts."
      ms: "SSH ke server, jadualkan kerja dan tulis skrip yang selamat."
    topics:
      en: "ssh, scp, rsync, df, du, cron, timers, bash scripts, nginx"
      ms: "ssh, scp, rsync, df, du, cron, timer, skrip bash, nginx"
    lessons:
      - { id: linux-l4-l01, slug: ssh-keys, title: { en: "SSH keys", ms: "Kunci SSH" }, minutes: 5, xp: 25, status: ready }
      - { id: linux-l4-l02, slug: ssh-config, title: { en: "Short names: ~/.ssh/config", ms: "Nama pendek: ~/.ssh/config" }, minutes: 3, xp: 15, status: ready }
      - { id: linux-l4-l03, slug: scp-rsync, title: { en: "Copy files: scp and rsync", ms: "Salin fail: scp dan rsync" }, minutes: 4, xp: 20, status: ready }
      - { id: linux-l4-l04, slug: disk-space, title: { en: "Disk space: df and du", ms: "Ruang cakera: df dan du" }, minutes: 3, xp: 15, status: ready }
      - { id: linux-l4-l05, slug: cron-timers, title: { en: "Scheduled jobs: cron and timers", ms: "Kerja berjadual: cron dan timer" }, minutes: 5, xp: 25, status: ready }
      - { id: linux-l4-l06, slug: bash-variables-if, title: { en: "Bash scripts: variables and if", ms: "Skrip bash: pemboleh ubah dan if" }, minutes: 5, xp: 25, status: ready }
      - { id: linux-l4-l07, slug: loops-exit-codes, title: { en: "Loops and exit codes", ms: "Gelung dan kod keluar" }, minutes: 4, xp: 20, status: ready }
      - { id: linux-l4-l08, slug: strict-mode, title: { en: "Safer scripts: set -euo pipefail", ms: "Skrip lebih selamat: set -euo pipefail" }, minutes: 4, xp: 20, status: ready }
      - { id: linux-l4-l09, slug: nginx, title: { en: "A small web server with nginx", ms: "Web server kecil dengan nginx" }, minutes: 5, xp: 25, status: ready }
      - { id: linux-l4-m7, slug: mission-7-server-from-scratch, mission: 7, title: { en: "Capstone mission 7: A server from scratch", ms: "Misi capstone 7: Server dari kosong" }, minutes: 5, xp: 100, status: ready }
    boss:
      id: linux-l4-boss
      title: { en: "Fix the nightly backup", ms: "Baiki sandaran malam" }
      summary: { en: "The backup script failed quietly. Make it loud and safe.", ms: "Skrip sandaran gagal senyap-senyap. Jadikan ia jelas dan selamat." }
      xp: 50
      status: ready
