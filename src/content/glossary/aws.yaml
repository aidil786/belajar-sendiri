# Cloud with AWS glossary (Level Up, Part 4 "Pusat Beli-belah"). Same shape as git.yaml. Drives <Term>
# tooltips in /<lang>/aws/... lessons and the page /<lang>/aws/glossary/.
# Every word hangs on the mall story (docs/LEVEL-UP-PLAN.md §1). `world` = the world id (A1 = 1 … A4 = 4).
# Ids are unique within this file. Words from other courses stay there: <Term id="subnet" course="linux">.
# Add words under your world's marker line, indented like this:
#   - id: region
#     world: 1
#     en: { term: "Region", meaning: "…" }
#     ms: { term: "Region", meaning: "…" }
terms:
  # --- World A1 terms (add new A1 terms below this line) ---
  - id: cloud
    world: 1
    en: { term: "cloud", meaning: "A giant mall of computers. You rent what you need by the hour, over the internet, and hand it back." }
    ms: { term: "cloud", meaning: "Pusat beli-belah komputer yang besar. Anda sewa apa yang perlu ikut jam, melalui internet, dan pulangkan." }
  - id: region
    world: 1
    en: { term: "Region", meaning: "One AWS mall in one part of the world, like ap-southeast-5 in Malaysia." }
    ms: { term: "Region", meaning: "Satu pusat beli-belah AWS di satu bahagian dunia, seperti ap-southeast-5 di Malaysia." }
  - id: availability-zone
    world: 1
    en: { term: "Availability Zone (AZ)", meaning: "One wing of the mall, with its own power and cooling. If one wing fails, the others keep going." }
    ms: { term: "Availability Zone (AZ)", meaning: "Satu sayap pusat beli-belah, dengan elektrik dan penyejuk sendiri. Kalau satu gagal, yang lain terus jalan." }
  - id: opt-in-region
    world: 1
    en: { term: "opt-in Region", meaning: "A newer mall that stays shut until you switch it on for your account. Malaysia is one." }
    ms: { term: "opt-in Region", meaning: "Pusat baru yang kekal tutup sehingga anda hidupkan untuk akaun anda. Malaysia salah satunya." }
  - id: shared-responsibility
    world: 1
    en: { term: "shared responsibility model", meaning: "AWS guards the building. You guard what you put inside your unit and who gets your keys." }
    ms: { term: "model tanggungjawab bersama", meaning: "AWS jaga bangunan. Anda jaga apa yang ada dalam unit anda dan siapa dapat kunci anda." }
  - id: root-user
    world: 1
    en: { term: "root user", meaning: "The master key made when you open the account. It opens everything, so lock it away." }
    ms: { term: "pengguna root", meaning: "Kunci induk yang dibuat semasa akaun dibuka. Ia buka semua, jadi simpan di tempat selamat." }
  - id: mfa
    world: 1
    en: { term: "MFA (multi-factor authentication)", meaning: "A second lock: after the password, you also show a code or a security key." }
    ms: { term: "MFA (pengesahan pelbagai faktor)", meaning: "Kunci kedua: selepas kata laluan, anda tunjuk kod atau kunci keselamatan juga." }
  - id: budget
    world: 1
    en: { term: "budget (AWS Budgets)", meaning: "A spending limit you set. AWS emails you when the bill passes or will pass it." }
    ms: { term: "bajet (AWS Budgets)", meaning: "Had perbelanjaan yang anda tetapkan. AWS hantar emel bila bil lepasi, atau akan lepasi, had itu." }
  - id: zero-spend-budget
    world: 1
    en: { term: "zero spend budget", meaning: "A ready-made budget that emails you as soon as you spend anything beyond the free limits." }
    ms: { term: "zero spend budget", meaning: "Bajet siap guna yang hantar emel sebaik anda belanja apa-apa melebihi had percuma." }
  - id: billing-alarm
    world: 1
    en: { term: "billing alarm", meaning: "A CloudWatch alarm on your estimated charges. Its data lives in us-east-1." }
    ms: { term: "billing alarm", meaning: "Penggera CloudWatch pada anggaran caj anda. Datanya disimpan di us-east-1." }
  - id: identity-center
    world: 1
    en: { term: "IAM Identity Center", meaning: "The mall's front desk: one sign-in, then a short-lived badge for each account you may enter." }
    ms: { term: "IAM Identity Center", meaning: "Kaunter depan pusat beli-belah: satu log masuk, kemudian pas jangka pendek untuk setiap akaun yang dibenarkan." }
  - id: iam-user
    world: 1
    en: { term: "IAM user", meaning: "A person or app with its own long-lasting password or keys in one account. Use sparingly." }
    ms: { term: "pengguna IAM", meaning: "Orang atau aplikasi dengan kata laluan atau kunci tahan lama dalam satu akaun. Guna jarang-jarang." }
  - id: aws-cli
    world: 1
    en: { term: "AWS CLI", meaning: "The aws command: talk to AWS from your terminal instead of clicking." }
    ms: { term: "AWS CLI", meaning: "Arahan aws: bercakap dengan AWS dari terminal, bukan dengan klik." }
  - id: cli-profile
    world: 1
    en: { term: "profile", meaning: "A named set of settings for the aws command: which account, which role, which Region." }
    ms: { term: "profil", meaning: "Set tetapan bernama untuk arahan aws: akaun mana, role mana, Region mana." }
  - id: free-tier
    world: 1
    en: { term: "AWS Free Tier", meaning: "AWS's free offers for new and current accounts. The rules change, so read the official page." }
    ms: { term: "AWS Free Tier", meaning: "Tawaran percuma AWS untuk akaun baru dan sedia ada. Peraturannya berubah, jadi baca laman rasmi." }
  - id: clean-up-list
    world: 1
    en: { term: "clean-up list", meaning: "Everything you made in a lesson, written down, so you can delete each one after." }
    ms: { term: "senarai bersihkan", meaning: "Semua yang anda cipta dalam satu pelajaran, ditulis, supaya anda boleh padam setiap satu selepas itu." }
  # --- World A2 terms (add new A2 terms below this line) ---
  - id: iam
    world: 2
    en: { term: "IAM (Identity and Access Management)", meaning: "The mall's key office: it decides who may do what in your account. It is free." }
    ms: { term: "IAM (Identity and Access Management)", meaning: "Pejabat kunci pusat beli-belah: ia tentukan siapa boleh buat apa dalam akaun anda. Percuma." }
  - id: iam-group
    world: 2
    en: { term: "IAM group", meaning: "A list of users who share the same keys. Join it, get the keys; leave it, lose them." }
    ms: { term: "kumpulan IAM", meaning: "Senarai pengguna yang berkongsi kunci yang sama. Masuk, dapat kunci; keluar, hilang kunci." }
  - id: iam-role
    world: 2
    en: { term: "IAM role", meaning: "A badge that trusted people or services borrow for a while. It hands out keys that expire." }
    ms: { term: "IAM role", meaning: "Pas yang dipinjam orang atau servis yang dipercayai untuk sementara. Ia beri kunci yang luput." }
  - id: arn
    world: 2
    en: { term: "ARN (Amazon Resource Name)", meaning: "The full address of anything in AWS, like arn:aws:s3:::kedai-menu." }
    ms: { term: "ARN (Amazon Resource Name)", meaning: "Alamat penuh apa-apa dalam AWS, seperti arn:aws:s3:::kedai-menu." }
  - id: iam-policy
    world: 2
    en: { term: "policy", meaning: "A key card written in JSON: Effect (Allow or Deny), Action (what) and Resource (on which thing)." }
    ms: { term: "polisi (policy)", meaning: "Kad kunci ditulis dalam JSON: Effect (Allow atau Deny), Action (apa) dan Resource (pada benda mana)." }
  - id: explicit-deny
    world: 2
    en: { term: "explicit deny", meaning: "A written Deny that fits the request. It beats every Allow, always." }
    ms: { term: "explicit deny", meaning: "Deny bertulis yang padan dengan permintaan. Ia kalahkan setiap Allow, sentiasa." }
  - id: implicit-deny
    world: 2
    en: { term: "implicit deny", meaning: "The default answer: nothing allowed it, so AWS says no." }
    ms: { term: "implicit deny", meaning: "Jawapan asal: tiada apa yang benarkan, jadi AWS kata tidak." }
  - id: iam-least-privilege
    world: 2
    en: { term: "least privilege", meaning: "Give only the keys a job needs: these actions, on these things. Nothing more." }
    ms: { term: "keistimewaan minimum (least privilege)", meaning: "Beri kunci yang kerja itu perlu sahaja: tindakan ini, pada benda ini. Tiada lebih." }
  - id: trust-policy
    world: 2
    en: { term: "trust policy", meaning: "The note on a role that says who may borrow it: a service, a user, or GitHub Actions." }
    ms: { term: "trust policy", meaning: "Nota pada role yang kata siapa boleh pinjam: satu servis, pengguna, atau GitHub Actions." }
  - id: service-role
    world: 2
    en: { term: "service role", meaning: "A role that an AWS service borrows to do work for you, like a server reading the menu." }
    ms: { term: "service role", meaning: "Role yang dipinjam servis AWS untuk buat kerja bagi pihak anda, seperti server membaca menu." }
  - id: access-key
    world: 2
    en: { term: "access key", meaning: "A long-lasting key pair (an ID and a secret) for an IAM user. Avoid it; prefer roles." }
    ms: { term: "access key", meaning: "Pasangan kunci tahan lama (ID dan rahsia) untuk pengguna IAM. Elakkan; guna role." }
  - id: temporary-credentials
    world: 2
    en: { term: "temporary credentials", meaning: "Keys that expire on their own, from a role or a sign-in. A leak does less harm." }
    ms: { term: "kelayakan sementara", meaning: "Kunci yang luput sendiri, dari role atau log masuk. Kebocoran kurang memudaratkan." }
  - id: oidc-provider
    world: 2
    en: { term: "OIDC identity provider", meaning: "Tells IAM to trust badges from an outside issuer, like token.actions.githubusercontent.com." }
    ms: { term: "OIDC identity provider", meaning: "Beritahu IAM untuk percaya pas dari pengeluar luar, seperti token.actions.githubusercontent.com." }
  - id: permissions-boundary
    world: 2
    en: { term: "permissions boundary", meaning: "A fence around one user or role. They can never do more than it allows, whatever else says yes." }
    ms: { term: "permissions boundary", meaning: "Pagar sekeliling satu pengguna atau role. Mereka tak boleh buat lebih daripada yang dibenarkannya." }
  - id: scp
    world: 2
    en: { term: "SCP (service control policy)", meaning: "A fence around whole accounts in an organization. It never grants keys; it only limits them." }
    ms: { term: "SCP (service control policy)", meaning: "Pagar sekeliling seluruh akaun dalam organisasi. Ia tak pernah beri kunci; ia hadkan sahaja." }
  # --- World A3 terms (add new A3 terms below this line) ---
  - id: vpc
    world: 3
    en: { term: "VPC", meaning: "Virtual Private Cloud: your own fenced plot of the mall's land. Your servers live inside it." }
    ms: { term: "VPC", meaning: "Virtual Private Cloud: lot berpagar anda sendiri dalam tanah pusat beli-belah. Server anda tinggal di dalamnya." }
  - id: cidr
    world: 3
    en: { term: "CIDR block", meaning: "A block of addresses, like 10.0.0.0/16. A smaller number after the slash means a bigger block." }
    ms: { term: "Blok CIDR", meaning: "Satu blok alamat, seperti 10.0.0.0/16. Nombor lebih kecil selepas garis miring bermaksud blok lebih besar." }
  - id: subnet
    world: 3
    en: { term: "Subnet", meaning: "One row of units inside your VPC, in one wing (Availability Zone). It gets part of the VPC's addresses." }
    ms: { term: "Subnet", meaning: "Satu baris unit dalam VPC anda, di satu sayap (Availability Zone). Ia dapat sebahagian alamat VPC." }
  - id: public-subnet
    world: 3
    en: { term: "Public subnet", meaning: "A row that faces the street: its route table sends internet traffic to an internet gateway." }
    ms: { term: "Subnet awam", meaning: "Baris yang menghadap jalan: jadual laluannya hantar trafik internet ke internet gateway." }
  - id: private-subnet
    world: 3
    en: { term: "Private subnet", meaning: "A back-room row with no direct road to the internet gateway. Databases live here." }
    ms: { term: "Subnet peribadi", meaning: "Baris bilik belakang tanpa jalan terus ke internet gateway. Pangkalan data tinggal di sini." }
  - id: route-table
    world: 3
    en: { term: "Route table", meaning: "The road signs for a row: which way each address goes." }
    ms: { term: "Jadual laluan", meaning: "Papan tanda jalan untuk satu baris: ke mana setiap alamat pergi." }
  - id: internet-gateway
    world: 3
    en: { term: "Internet gateway", meaning: "The mall's main entrance from the street. It lets public rows talk to the internet, both ways." }
    ms: { term: "Internet gateway", meaning: "Pintu masuk utama pusat beli-belah dari jalan. Ia benarkan baris awam bercakap dengan internet, dua hala." }
  - id: nat-gateway
    world: 3
    en: { term: "NAT gateway", meaning: "A one-way staff door: back rooms can go out to fetch things, but nobody outside can walk in. Billed by the hour." }
    ms: { term: "NAT gateway", meaning: "Pintu staf sehala: bilik belakang boleh keluar ambil barang, tetapi orang luar tak boleh masuk. Dicaj ikut jam." }
  - id: security-group
    world: 3
    en: { term: "Security group", meaning: "The guard at a unit's door. Allow rules only, and it remembers who came in, so replies go out." }
    ms: { term: "Security group", meaning: "Pengawal di pintu unit. Peraturan benarkan sahaja, dan ia ingat siapa masuk, jadi jawapan boleh keluar." }
  - id: network-acl
    world: 3
    en: { term: "Network ACL", meaning: "The gate of a whole row. Numbered allow and deny rules, lowest first. It remembers nothing." }
    ms: { term: "Network ACL", meaning: "Pagar untuk satu baris. Peraturan benarkan dan tolak bernombor, paling rendah dahulu. Ia tak ingat apa-apa." }
  - id: ec2
    world: 3
    en: { term: "EC2 instance", meaning: "A virtual server you rent by the second or hour. Stop it to pause compute; terminate it to delete it." }
    ms: { term: "Instance EC2", meaning: "Server maya yang anda sewa ikut saat atau jam. Stop untuk berehat; terminate untuk padam." }
  - id: ami
    world: 3
    en: { term: "AMI", meaning: "Amazon Machine Image: the starting disk for a new server, with its operating system." }
    ms: { term: "AMI", meaning: "Amazon Machine Image: cakera permulaan untuk server baru, dengan sistem pengendaliannya." }
  - id: instance-type
    world: 3
    en: { term: "Instance type", meaning: "The size of a server: how much CPU and memory. Bigger costs more per hour." }
    ms: { term: "Jenis instance", meaning: "Saiz server: berapa banyak CPU dan memori. Lebih besar, lebih mahal sejam." }
  - id: load-balancer
    world: 3
    en: { term: "Load balancer", meaning: "The mall's reception desk: it sends each shopper to a healthy counter. Billed while it runs." }
    ms: { term: "Load balancer", meaning: "Kaunter penyambut tetamu: ia hantar setiap pembeli ke kaunter yang sihat. Dicaj selagi ia berjalan." }
  - id: target-group
    world: 3
    en: { term: "Target group", meaning: "The list of counters a load balancer may send shoppers to, with a health check for each." }
    ms: { term: "Target group", meaning: "Senarai kaunter yang load balancer boleh hantar pembeli, dengan pemeriksaan kesihatan untuk setiap satu." }
  - id: s3-bucket
    world: 3
    en: { term: "S3 bucket", meaning: "A storeroom for files (objects) in one Region. Its name must be unique." }
    ms: { term: "Bucket S3", meaning: "Stor untuk fail (objek) dalam satu Region. Namanya mesti unik." }
  - id: block-public-access
    world: 3
    en: { term: "Block Public Access", meaning: "The master lock on S3 storerooms. On by default for new buckets: nothing goes public by mistake." }
    ms: { term: "Block Public Access", meaning: "Kunci utama stor S3. Dihidupkan secara lalai untuk bucket baru: tiada yang jadi awam secara tak sengaja." }
  - id: route53
    world: 3
    en: { term: "Route 53", meaning: "AWS's DNS service: the mall directory that turns a name like kedai.example into an address." }
    ms: { term: "Route 53", meaning: "Servis DNS AWS: direktori pusat beli-belah yang tukar nama seperti kedai.example kepada alamat." }
  - id: cloudfront
    world: 3
    en: { term: "CloudFront", meaning: "AWS's CDN: kiosks near your shoppers that keep copies of your pages, so they load fast." }
    ms: { term: "CloudFront", meaning: "CDN AWS: kiosk dekat pembeli anda yang simpan salinan halaman anda, supaya cepat dibuka." }
  # --- World A4 terms (add new A4 terms below this line) ---
  - id: ecr
    world: 4
    en: { term: "ECR", meaning: "Elastic Container Registry: your private image shelf in the mall's storeroom. You pay for what you store." }
    ms: { term: "ECR", meaning: "Elastic Container Registry: rak image peribadi anda dalam stor pusat beli-belah. Anda bayar apa yang disimpan." }
  - id: ecs
    world: 4
    en: { term: "ECS", meaning: "Elastic Container Service: the mall's manager that runs your containers to a plan." }
    ms: { term: "ECS", meaning: "Elastic Container Service: pengurus pusat beli-belah yang jalankan container anda ikut pelan." }
  - id: task-definition
    world: 4
    en: { term: "Task definition", meaning: "ECS's recipe card: which image, how much CPU and memory, which ports and settings." }
    ms: { term: "Task definition", meaning: "Kad resepi ECS: image mana, berapa CPU dan memori, port dan tetapan mana." }
  - id: ecs-service
    world: 4
    en: { term: "ECS service", meaning: "A promise to keep N copies of a task running. One stops? ECS starts a new one." }
    ms: { term: "Service ECS", meaning: "Janji untuk kekalkan N salinan task berjalan. Satu berhenti? ECS mulakan yang baru." }
  - id: fargate
    world: 4
    en: { term: "Fargate", meaning: "Containers with no servers to look after. The mall gives you a counter; you pay for its CPU and memory while it runs." }
    ms: { term: "Fargate", meaning: "Container tanpa server untuk dijaga. Pusat beli-belah beri kaunter; anda bayar CPU dan memorinya selagi ia berjalan." }
  - id: eks
    world: 4
    en: { term: "EKS", meaning: "Elastic Kubernetes Service: AWS runs the Kubernetes control plane for you. Each cluster has an hourly fee." }
    ms: { term: "EKS", meaning: "Elastic Kubernetes Service: AWS jalankan control plane Kubernetes untuk anda. Setiap kluster ada caj sejam." }
  - id: rds
    world: 4
    en: { term: "RDS", meaning: "Relational Database Service: a managed database with backups and updates done for you." }
    ms: { term: "RDS", meaning: "Relational Database Service: pangkalan data terurus, dengan backup dan kemas kini dibuat untuk anda." }
  - id: multi-az
    world: 4
    en: { term: "Multi-AZ", meaning: "A standby copy of your database in another wing. If one wing fails, the standby takes over." }
    ms: { term: "Multi-AZ", meaning: "Salinan siap sedia pangkalan data anda di sayap lain. Jika satu sayap gagal, salinan itu ambil alih." }
  - id: secrets-manager
    world: 4
    en: { term: "Secrets Manager", meaning: "A safe for passwords and keys. It can change them on a schedule. Each secret has a monthly charge." }
    ms: { term: "Secrets Manager", meaning: "Peti besi untuk kata laluan dan kunci. Ia boleh tukar ikut jadual. Setiap rahsia ada caj bulanan." }
  - id: parameter-store
    world: 4
    en: { term: "Parameter Store", meaning: "A noticeboard for settings, with locked notes (SecureString) for secrets. Part of Systems Manager." }
    ms: { term: "Parameter Store", meaning: "Papan notis untuk tetapan, dengan nota berkunci (SecureString) untuk rahsia. Sebahagian Systems Manager." }
  - id: data-transfer
    world: 4
    en: { term: "Data transfer out", meaning: "Data that leaves AWS for the internet. It is billed per GB, so big downloads cost money." }
    ms: { term: "Data transfer out", meaning: "Data yang keluar dari AWS ke internet. Ia dicaj ikut GB, jadi muat turun besar ada kos." }
