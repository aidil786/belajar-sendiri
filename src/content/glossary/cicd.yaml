# CI/CD glossary (Ship It, Part 2 "Kilang"). Same shape as git.yaml. Drives <Term> tooltips in
# /<lang>/cicd/... lessons and the page /<lang>/cicd/glossary/.
# Every word hangs on the food story (docs/SHIP-IT-PLAN.md §3). `world` = the world id (C1 = 1 … C4 = 4).
# Ids are unique within this file. Git course words (workflow, job, step …) stay in git.yaml:
# link them with <Term id="workflow" course="git">.
terms:
  # --- World C1 terms (add new C1 terms below this line) ---
  - id: pipeline
    world: 1
    en: { term: "pipeline", meaning: "A conveyor belt with stations: build, test, ship. It runs by itself." }
    ms: { term: "pipeline", meaning: "Tali sawat automatik: bina, uji, hantar." }
  - id: ci
    world: 1
    en: { term: "CI", meaning: "Continuous integration: every change is taste-tested by itself." }
    ms: { term: "CI", meaning: "Setiap perubahan diuji secara automatik." }
  - id: cd
    world: 1
    en: { term: "CD", meaning: "The delivery van: a version that passed its tests is shipped by itself." }
    ms: { term: "CD", meaning: "Versi yang lulus ujian dihantar secara automatik." }
  - id: runner
    world: 1
    en: { term: "runner", meaning: "The worker at a station: a machine that runs the jobs in a pipeline." }
    ms: { term: "runner", meaning: "Mesin yang jalankan kerja dalam pipeline." }
  - id: continuous-delivery
    world: 1
    en: { term: "continuous delivery", meaning: "The van is packed and waiting. Every change that passes can ship, and a person says go." }
    ms: { term: "continuous delivery", meaning: "Setiap perubahan yang lulus sedia dihantar. Seseorang tekan butang untuk hantar." }
  - id: continuous-deployment
    world: 1
    en: { term: "continuous deployment", meaning: "The van drives off by itself: every change that passes goes live, with no button." }
    ms: { term: "continuous deployment", meaning: "Setiap perubahan yang lulus terus sampai kepada pengguna, tanpa butang." }
  - id: stage
    world: 1
    en: { term: "stage", meaning: "One station on the belt, like lint, test, build, scan, publish or deploy." }
    ms: { term: "stage", meaning: "Satu stesen pada tali sawat, contohnya lint, test, build, scan, publish atau deploy." }
  - id: fast-feedback
    world: 1
    en: { term: "fast feedback", meaning: "Hearing about a problem in seconds or minutes, while the change is still fresh in your head." }
    ms: { term: "maklum balas pantas", meaning: "Tahu tentang masalah dalam beberapa saat atau minit, semasa anda masih ingat perubahan itu." }
  - id: flaky-test
    world: 1
    en: { term: "flaky test", meaning: "A test that passes and fails on the same code, like a taster who keeps changing their mind." }
    ms: { term: "flaky test", meaning: "Ujian yang kadang lulus, kadang gagal, pada kod yang sama." }
  - id: testing-pyramid
    world: 1
    en: { term: "testing pyramid", meaning: "Many fast unit tests at the bottom, some integration tests, a few slow end-to-end tests on top." }
    ms: { term: "piramid ujian", meaning: "Banyak unit test pantas di bawah, sedikit integration test, dan beberapa end-to-end test perlahan di atas." }
  - id: unit-test
    world: 1
    en: { term: "unit test", meaning: "Tests one small piece on its own, like tasting one ingredient. Very fast." }
    ms: { term: "unit test", meaning: "Uji satu bahagian kecil sahaja, macam rasa satu bahan. Sangat pantas." }
  - id: integration-test
    world: 1
    en: { term: "integration test", meaning: "Tests parts working together, like tasting a sauce made of a few ingredients." }
    ms: { term: "integration test", meaning: "Uji beberapa bahagian yang bekerja bersama, macam rasa kuah." }
  - id: end-to-end-test
    world: 1
    en: { term: "end-to-end test", meaning: "Tests the whole app like a real user, from start to finish. Slow, but close to real life." }
    ms: { term: "end-to-end test", meaning: "Uji seluruh aplikasi macam pengguna sebenar, dari mula hingga habis. Perlahan, tapi paling dekat dengan dunia sebenar." }
  - id: promote
    world: 1
    en: { term: "promote", meaning: "Move the same tested build on to the next environment, like from staging to production." }
    ms: { term: "promote", meaning: "Pindahkan build yang sama, yang dah diuji, ke persekitaran seterusnya. Contohnya dari staging ke production." }
  - id: staging-environment
    world: 1
    en: { term: "staging", meaning: "The tasting room: a copy of production where you check a build before real users see it." }
    ms: { term: "staging", meaning: "Bilik rasa: salinan production untuk semak build sebelum pengguna sebenar nampak." }
  - id: production
    world: 1
    en: { term: "production", meaning: "The real shop: the place where real users use your app." }
    ms: { term: "production", meaning: "Kedai sebenar: tempat pengguna sebenar guna aplikasi anda." }
  - id: dora-metrics
    world: 1
    en: { term: "DORA metrics", meaning: "Five numbers from the DORA research group that show how well a team delivers software." }
    ms: { term: "metrik DORA", meaning: "Lima nombor daripada kajian DORA yang tunjuk sebaik mana pasukan menghantar perisian." }
  - id: deployment-frequency
    world: 1
    en: { term: "deployment frequency", meaning: "How often you deploy to production: how often the van leaves." }
    ms: { term: "deployment frequency", meaning: "Berapa kerap anda deploy ke production: berapa kerap van keluar." }
  - id: change-lead-time
    world: 1
    en: { term: "change lead time", meaning: "The time from a commit to that change running in production." }
    ms: { term: "change lead time", meaning: "Masa dari commit sehingga perubahan itu berjalan dalam production." }
  - id: change-fail-rate
    world: 1
    en: { term: "change fail rate", meaning: "The share of deployments that need an urgent fix right after they go out." }
    ms: { term: "change fail rate", meaning: "Peratus deployment yang perlu dibaiki segera sebaik sahaja keluar." }
  - id: failed-deployment-recovery-time
    world: 1
    en: { term: "failed deployment recovery time", meaning: "How long it takes to recover when a deployment fails and needs urgent work." }
    ms: { term: "failed deployment recovery time", meaning: "Berapa lama untuk pulih bila satu deployment gagal dan perlu dibaiki segera." }
  - id: deployment-rework-rate
    world: 1
    en: { term: "deployment rework rate", meaning: "The share of deployments that were not planned: extra trips made to fix a problem in production." }
    ms: { term: "deployment rework rate", meaning: "Peratus deployment yang tak dirancang: trip tambahan untuk baiki masalah dalam production." }
  - id: agent
    world: 1
    en: { term: "agent", meaning: "Jenkins and Azure Pipelines call the worker machine an agent. GitHub and GitLab call it a runner." }
    ms: { term: "agent", meaning: "Jenkins dan Azure Pipelines panggil mesin pekerja sebagai agent. GitHub dan GitLab panggil runner." }
  # --- World C2 terms (add new C2 terms below this line) ---
  - id: buildx
    world: 2
    en: { term: "Buildx", meaning: "The packing machine: Docker's builder. It can save the layer cache and build for many CPU types." }
    ms: { term: "Buildx", meaning: "Mesin pembungkus: pembina Docker. Ia boleh simpan cache layer dan bina untuk banyak jenis CPU." }
  - id: image-tag
    world: 2
    en: { term: "image tag", meaning: "A label on the pack, like 1.2.0, main or sha-3f9c2a7. One image can carry many." }
    ms: { term: "tag image", meaning: "Label pada pek, contohnya 1.2.0, main atau sha-3f9c2a7. Satu image boleh ada banyak tag." }
  - id: ghcr
    world: 2
    en: { term: "GHCR", meaning: "GitHub Container Registry (ghcr.io): GitHub's own shop freezer for images." }
    ms: { term: "GHCR", meaning: "GitHub Container Registry (ghcr.io): peti sejuk kedai milik GitHub untuk image." }
  - id: layer-cache
    world: 2
    en: { term: "layer cache", meaning: "Kek lapis layers kept from an earlier build. Unchanged layers are reused, not baked again." }
    ms: { term: "cache layer", meaning: "Lapisan kek lapis yang disimpan dari binaan lepas. Lapisan yang tak berubah diguna semula." }
  - id: multi-arch
    world: 2
    en: { term: "multi-arch image", meaning: "One image name with a pack for each CPU type, like amd64 and arm64." }
    ms: { term: "image multi-arch", meaning: "Satu nama image dengan satu pek untuk setiap jenis CPU, contohnya amd64 dan arm64." }
  - id: qemu
    world: 2
    en: { term: "QEMU", meaning: "An adapter that lets one CPU type pretend to be another. Slower, but it works." }
    ms: { term: "QEMU", meaning: "Penyesuai yang buat satu jenis CPU berlakon jadi jenis lain. Lebih perlahan, tapi berfungsi." }
  - id: service-container
    world: 2
    en: { term: "service container", meaning: "A helper container, like a test database, that lives only for one job." }
    ms: { term: "service container", meaning: "Container pembantu, contohnya pangkalan data ujian, yang hidup untuk satu job sahaja." }
  - id: linter
    world: 2
    en: { term: "linter", meaning: "A proofreader robot. It finds mistakes and risky habits in a file before it runs." }
    ms: { term: "linter", meaning: "Robot penyemak. Ia cari kesilapan dan tabiat berisiko dalam fail sebelum fail itu dijalankan." }
  - id: cve
    world: 2
    en: { term: "CVE", meaning: "A public ID for a known security hole, like CVE-2099-0001. Each gets a severity." }
    ms: { term: "CVE", meaning: "ID awam untuk lubang keselamatan yang diketahui, contohnya CVE-2099-0001. Setiap satu ada tahap bahaya." }
  - id: sbom
    world: 2
    en: { term: "SBOM", meaning: "Software bill of materials: the ingredients label. It lists every package and version inside." }
    ms: { term: "SBOM", meaning: "Senarai bahan perisian: label ramuan. Ia senaraikan setiap pakej dan versi di dalamnya." }
  - id: provenance
    world: 2
    en: { term: "provenance", meaning: "A signed \"made here\" label: which repo, commit and workflow built this image." }
    ms: { term: "provenance", meaning: "Label \"dibuat di sini\" yang ditandatangani: repo, commit dan workflow mana yang bina image ini." }
  - id: composite-action
    world: 2
    en: { term: "composite action", meaning: "A pre-mixed spice blend: a few steps saved as one action. It runs as one step in your job." }
    ms: { term: "composite action", meaning: "Rempah siap campur: beberapa langkah disimpan sebagai satu action. Ia jalan sebagai satu langkah dalam job." }
  - id: concurrency
    world: 2
    en: { term: "concurrency", meaning: "Runs in the same group wait their turn, or the older one is cancelled." }
    ms: { term: "concurrency", meaning: "Run dalam kumpulan yang sama tunggu giliran, atau run yang lama dibatalkan." }
  - id: path-filter
    world: 2
    en: { term: "path filter", meaning: "paths or paths-ignore: start the workflow only when certain files change." }
    ms: { term: "penapis laluan", meaning: "paths atau paths-ignore: mulakan workflow hanya bila fail tertentu berubah." }
  # --- World C3 terms (add new C3 terms below this line) ---
  - id: secret
    world: 3
    en: { term: "secret", meaning: "The locked spice box: private info like a token. Never put it in code." }
    ms: { term: "secret", meaning: "Maklumat rahsia seperti token; jangan letak dalam kod." }
  - id: recreate
    world: 3
    en: { term: "recreate", meaning: "Stop the old version, then start the new one. Like closing the stall to swap the menu: users wait." }
    ms: { term: "recreate", meaning: "Hentikan versi lama, kemudian mulakan yang baharu. Macam tutup gerai untuk tukar menu: pelanggan kena tunggu." }
  - id: rolling-update
    world: 3
    en: { term: "rolling update", meaning: "Swap the copies one at a time, like changing cooks one by one. The stall never closes." }
    ms: { term: "rolling update", meaning: "Tukar salinan satu demi satu, macam tukar tukang masak seorang demi seorang. Gerai tak pernah tutup." }
  - id: blue-green
    world: 3
    en: { term: "blue/green deployment", meaning: "Two full kitchens. Test the new one, then flip the sign so everyone goes there. Flip back to undo." }
    ms: { term: "blue/green", meaning: "Dua dapur penuh. Uji yang baharu, kemudian tukar papan tanda supaya semua ke sana. Tukar balik untuk undur." }
  - id: canary
    world: 3
    en: { term: "canary release", meaning: "A few users get the new version first, like a few customers tasting a new dish. All good? Serve more." }
    ms: { term: "canary", meaning: "Sedikit pengguna dapat versi baharu dulu, macam beberapa pelanggan rasa hidangan baharu. Okey? Hidang kepada lebih ramai." }
  - id: deploy
    world: 3
    en: { term: "deploy", meaning: "Put new code on the servers. The dish is on the counter, maybe still under a cover. Releasing is lifting the cover." }
    ms: { term: "deploy", meaning: "Letak kod baharu pada server. Hidangan dah ada di kaunter, mungkin masih bertutup. Release ialah buka tudung itu." }
  - id: required-reviewer
    world: 3
    en: { term: "required reviewer", meaning: "A person who must approve before a job deploys to an environment, like the head chef signing before the van leaves." }
    ms: { term: "penyemak wajib", meaning: "Orang yang mesti lulus dulu sebelum job deploy ke environment, macam ketua chef tandatangan sebelum van bertolak." }
  - id: release-pr
    world: 3
    en: { term: "release PR", meaning: "A pull request a robot keeps up to date with the next version number and the changelog. Merge it to release." }
    ms: { term: "release PR", meaning: "Pull request yang robot kemas kini dengan nombor versi seterusnya dan changelog. Merge untuk lancarkan." }
  - id: preview-environment
    world: 3
    en: { term: "preview environment", meaning: "A short-lived copy of the site for one pull request, with its own link. A tasting plate, cleared when the PR closes." }
    ms: { term: "persekitaran pratonton", meaning: "Salinan laman sementara untuk satu pull request, dengan pautan sendiri. Pinggan rasa, dibuang bila PR ditutup." }
  - id: workers-static-assets
    world: 3
    en: { term: "Workers static assets", meaning: "Cloudflare keeps your built files (HTML, CSS, pictures) on its servers around the world. Packed food on a shelf: nothing to cook." }
    ms: { term: "Workers static assets", meaning: "Cloudflare simpan fail siap anda (HTML, CSS, gambar) pada server di seluruh dunia. Makanan siap bungkus di rak: tiada apa nak dimasak." }
  - id: cloudflare-containers
    world: 3
    en: { term: "Cloudflare Containers", meaning: "Runs your container image on Cloudflare, behind a Worker. It needs the Workers Paid plan." }
    ms: { term: "Cloudflare Containers", meaning: "Jalankan image container anda di Cloudflare, di belakang sebuah Worker. Perlukan pelan Workers Paid." }
  - id: environment-secret
    world: 3
    en: { term: "environment secret", meaning: "A secret only jobs that name that environment can read. Each kitchen's own locked spice box." }
    ms: { term: "environment secret", meaning: "Secret yang hanya boleh dibaca oleh job yang menyebut environment itu. Kotak rempah berkunci milik setiap dapur." }
  - id: oidc
    world: 3
    en: { term: "OIDC (OpenID Connect)", meaning: "The runner shows a visitor badge for one job. The cloud checks it and lends a key that expires when the job ends." }
    ms: { term: "OIDC (OpenID Connect)", meaning: "Runner tunjuk pas pelawat untuk satu job. Cloud semak pas itu dan pinjamkan kunci yang luput bila job tamat." }
  - id: expand-contract
    world: 3
    en: { term: "expand and contract", meaning: "Change a database in safe steps: add the new shelf, move the stock, then remove the old shelf. Old and new code keep working." }
    ms: { term: "expand dan contract", meaning: "Ubah pangkalan data langkah demi langkah: tambah rak baharu, pindah stok, kemudian buang rak lama. Kod lama dan baharu terus berfungsi." }
  - id: smoke-test
    world: 3
    en: { term: "smoke test", meaning: "A quick taste right after a deploy: does the page load, does /health say ok?" }
    ms: { term: "smoke test", meaning: "Rasa sekejap sejurus selepas deploy: halaman boleh dibuka, /health kata ok?" }
  - id: rollback
    world: 3
    en: { term: "rollback", meaning: "Go back to the last good version, like serving yesterday's good batch again." }
    ms: { term: "rollback", meaning: "Kembali ke versi elok yang terakhir, macam hidang semula masakan semalam yang sedap." }
  - id: alert-fatigue
    world: 3
    en: { term: "alert fatigue", meaning: "So many pings that people stop reading them. Then the one real alarm gets missed." }
    ms: { term: "alert fatigue (letih makluman)", meaning: "Terlalu banyak makluman sampai orang berhenti membacanya. Akhirnya amaran yang betul terlepas." }
  # --- World C4 terms (add new C4 terms below this line) ---
  - id: supply-chain-attack
    world: 4
    en: { term: "supply chain attack", meaning: "A poisoned ingredient from a supplier: attackers break into a tool that many pipelines borrow." }
    ms: { term: "supply chain attack", meaning: "Bahan beracun dari pembekal: penyerang ceroboh alat yang dipinjam oleh banyak pipeline." }
  - id: least-privilege
    world: 4
    en: { term: "least privilege", meaning: "Give each worker only the keys their station needs. Nothing extra." }
    ms: { term: "least privilege", meaning: "Beri setiap pekerja kunci untuk stesennya sahaja. Tiada lebih." }
  - id: pull-request-target
    world: 4
    en: { term: "pull_request_target", meaning: "A PR trigger that runs with your secrets and a write key, even for a stranger's fork. Never run their code in it." }
    ms: { term: "pull_request_target", meaning: "Pencetus PR yang jalan dengan secret dan kunci tulis anda, walaupun untuk fork orang asing. Jangan jalankan kod mereka di situ." }
  - id: script-injection
    world: 4
    en: { term: "script injection", meaning: "An order slip with a hidden instruction: text from a stranger becomes a command in your run: script." }
    ms: { term: "script injection", meaning: "Slip pesanan dengan arahan tersembunyi: teks orang asing jadi arahan dalam skrip run: anda." }
  - id: masking
    world: 4
    en: { term: "masking", meaning: "Blacking out a secret in the logbook: GitHub shows *** instead of the exact secret text." }
    ms: { term: "masking", meaning: "Hitamkan secret dalam buku log: GitHub tunjuk *** dan bukan teks secret yang tepat." }
  - id: self-hosted-runner
    world: 4
    en: { term: "self-hosted runner", meaning: "Your own worker in your own back room: a machine you run that picks up jobs. It is not wiped after each job." }
    ms: { term: "self-hosted runner", meaning: "Pekerja sendiri dalam bilik belakang anda: mesin anda yang ambil kerja. Ia tidak dipadam selepas setiap kerja." }
  - id: slsa
    world: 4
    en: { term: "SLSA", meaning: "A food-safety grade for builds (say \"salsa\"): levels that show how much you can trust where a package was made." }
    ms: { term: "SLSA", meaning: "Gred keselamatan makanan untuk binaan (sebut \"salsa\"): tahap yang tunjuk sejauh mana anda boleh percaya asal pakej." }
  - id: allow-list
    world: 4
    en: { term: "allow-list", meaning: "The approved supplier list: only the actions on it may run in your organisation." }
    ms: { term: "allow-list", meaning: "Senarai pembekal yang diluluskan: hanya action dalam senarai boleh jalan dalam organisasi anda." }
