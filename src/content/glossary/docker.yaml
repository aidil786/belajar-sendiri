# Docker glossary (Ship It, Part 1 "Dapur"). Same shape as git.yaml. Drives <Term> tooltips in
# /<lang>/docker/... lessons and the page /<lang>/docker/glossary/.
# Every word hangs on the food story (docs/SHIP-IT-PLAN.md §3). `world` = the world id (D0 = 0 … D6 = 6).
# Ids are unique within this file. In BM lessons, first use: English term + plain meaning.
terms:
  # --- World D0 terms (add new D0 terms below this line) ---
  - id: container
    world: 0
    en: { term: "container", meaning: "A sealed lunchbox that holds your app and everything it needs." }
    ms: { term: "container", meaning: "Bekas bertutup yang bawa aplikasi dan semua keperluannya." }
  - id: virtual-machine
    world: 0
    en: { term: "virtual machine (VM)", meaning: "A whole house: a full computer with its own operating system, running inside your computer." }
    ms: { term: "virtual machine (mesin maya)", meaning: "Sebuah rumah penuh: komputer lengkap dengan sistem pengendalian sendiri, berjalan dalam komputer anda." }
  - id: kernel
    world: 0
    en: { term: "kernel", meaning: "The heart of the operating system. It runs every program. Containers share the laptop's kernel." }
    ms: { term: "kernel", meaning: "Jantung sistem pengendalian. Ia jalankan setiap program. Container berkongsi kernel laptop." }
  - id: docker-engine
    world: 0
    en: { term: "Docker Engine", meaning: "The cook in the back: the free, open-source program that runs your containers." }
    ms: { term: "Docker Engine", meaning: "Tukang masak di belakang: program percuma dan sumber terbuka yang jalankan container anda." }
  - id: docker-desktop
    world: 0
    en: { term: "Docker Desktop", meaning: "A kitchen kit in one app: Docker Engine, tools and a dashboard. Free for personal use and small businesses." }
    ms: { term: "Docker Desktop", meaning: "Set dapur dalam satu aplikasi: Docker Engine, alatan dan papan pemuka. Percuma untuk kegunaan peribadi dan bisnes kecil." }
  - id: podman
    world: 0
    en: { term: "Podman", meaning: "Another container engine. It takes the same orders as Docker, without a daemon." }
    ms: { term: "Podman", meaning: "Satu lagi enjin container. Ia terima arahan yang sama macam Docker, tanpa daemon." }
  - id: wsl
    world: 0
    en: { term: "WSL 2", meaning: "A real Linux inside Windows. Docker Desktop uses it to run containers." }
    ms: { term: "WSL 2", meaning: "Linux sebenar di dalam Windows. Docker Desktop guna ia untuk jalankan container." }
  - id: docker-client
    world: 0
    en: { term: "client", meaning: "The part you talk to: the docker command. It takes your order to the engine." }
    ms: { term: "client", meaning: "Bahagian yang anda guna: arahan docker. Ia hantar pesanan anda kepada enjin." }
  - id: daemon
    world: 0
    en: { term: "daemon", meaning: "A program that waits in the background for work. Docker's daemon is called dockerd." }
    ms: { term: "daemon", meaning: "Program yang menunggu kerja di belakang tabir. Daemon Docker bernama dockerd." }
  - id: path
    world: 0
    en: { term: "path", meaning: "A file's full address, from the top folder down: /home/you/kitchen/menu.txt." }
    ms: { term: "path (laluan)", meaning: "Alamat penuh sesuatu fail, dari folder paling atas: /home/you/kitchen/menu.txt." }
  - id: permissions
    world: 0
    en: { term: "permissions", meaning: "Who may read (r), change (w) or run (x) a file. ls -l shows them." }
    ms: { term: "permissions (kebenaran)", meaning: "Siapa boleh baca (r), ubah (w) atau jalankan (x) sesuatu fail. ls -l menunjukkannya." }
  - id: process
    world: 0
    en: { term: "process", meaning: "A program that is running right now. Each one has a number, its PID." }
    ms: { term: "process (proses)", meaning: "Program yang sedang berjalan. Setiap satu ada nombor, iaitu PID." }
  - id: environment-variable
    world: 0
    en: { term: "environment variable", meaning: "A sticky note on the kitchen wall: a setting every program can read, like CHEF=Kancil." }
    ms: { term: "environment variable (pemboleh ubah persekitaran)", meaning: "Nota lekat di dinding dapur: tetapan yang setiap program boleh baca, contohnya CHEF=Kancil." }
  - id: exit-code
    world: 0
    en: { term: "exit code", meaning: "The number a program leaves when it ends. 0 means all good. Anything else means trouble." }
    ms: { term: "exit code (kod keluar)", meaning: "Nombor yang program tinggalkan bila ia tamat. 0 bermaksud semua okey. Nombor lain bermaksud ada masalah." }
  - id: ip-address
    world: 0
    en: { term: "IP address", meaning: "A computer's street address on a network, like 192.168.1.20." }
    ms: { term: "IP address (alamat IP)", meaning: "Alamat jalan sesebuah komputer dalam rangkaian, contohnya 192.168.1.20." }
  - id: port
    world: 0
    en: { term: "port", meaning: "A numbered hatch on a computer. Each app waits for orders at its own number, like 8080." }
    ms: { term: "port", meaning: "Tingkap bernombor pada komputer. Setiap aplikasi tunggu pesanan di nombornya sendiri, contohnya 8080." }
  - id: localhost
    world: 0
    en: { term: "localhost", meaning: "This computer itself. Its address is 127.0.0.1." }
    ms: { term: "localhost", meaning: "Komputer ini sendiri. Alamatnya 127.0.0.1." }
  - id: dns
    world: 0
    en: { term: "DNS", meaning: "The phone book of the network. It turns a name into an IP address." }
    ms: { term: "DNS", meaning: "Buku telefon rangkaian. Ia tukar nama kepada alamat IP." }
  - id: http-status-code
    world: 0
    en: { term: "HTTP status code", meaning: "The counter's reply in three digits: 200 means here you go, 404 means not on the menu." }
    ms: { term: "HTTP status code (kod status HTTP)", meaning: "Jawapan kaunter dalam tiga digit: 200 bermaksud nah, ambil; 404 bermaksud tiada dalam menu." }
  - id: yaml
    world: 0
    en: { term: "YAML", meaning: "A neat recipe card for computers, made of keys, colons, dashes and spaces." }
    ms: { term: "YAML", meaning: "Kad resepi yang kemas untuk komputer, dibuat daripada kunci, titik bertindih, sengkang dan ruang." }
  - id: nesting
    world: 0
    en: { term: "nesting", meaning: "A box inside a box. In YAML, two more spaces put a line inside the line above." }
    ms: { term: "nesting (bersarang)", meaning: "Kotak di dalam kotak. Dalam YAML, dua ruang lagi letak baris itu di dalam baris atasnya." }
  # --- World D1 terms (add new D1 terms below this line) ---
  - id: image
    world: 1
    en: { term: "image", meaning: "A frozen meal pack you can copy again and again. Containers start from it." }
    ms: { term: "image", meaning: "Pek beku yang boleh disalin berkali-kali; templat untuk container." }
  - id: port-mapping
    world: 1
    en: { term: "port mapping", meaning: "The order hatch: a door from a port on your computer to a port in the container." }
    ms: { term: "port mapping", meaning: "Tingkap pesanan dari komputer anda ke container." }
  - id: pull
    world: 1
    en: { term: "pull", meaning: "Fetch an image from a registry, like taking a meal pack out of the shop freezer." }
    ms: { term: "pull (tarik)", meaning: "Ambil image dari registry, macam ambil pek beku dari peti sejuk kedai." }
  - id: detached
    world: 1
    en: { term: "detached (-d)", meaning: "The container runs in the background, like a rice cooker: press start, walk away." }
    ms: { term: "detached (-d)", meaning: "Container berjalan di belakang, macam periuk nasi: tekan, kemudian tinggalkan." }
  - id: container-lifecycle
    world: 1
    en: { term: "life cycle", meaning: "The states a container moves through: created, running, paused, exited, removed." }
    ms: { term: "kitaran hidup", meaning: "Keadaan yang container lalui: created, running, paused, exited, removed." }
  - id: container-logs
    world: 1
    en: { term: "logs", meaning: "Everything a container printed while it worked. Read them with docker logs." }
    ms: { term: "log", meaning: "Semua yang container paparkan semasa bekerja. Baca dengan docker logs." }
  - id: tag
    world: 1
    en: { term: "tag", meaning: "The label after the colon, like nginx:1.30-alpine. No tag means :latest." }
    ms: { term: "tag", meaning: "Label selepas titik bertindih, contohnya nginx:1.30-alpine. Tiada tag bermaksud :latest." }
  - id: latest-tag
    world: 1
    en: { term: "latest", meaning: "Just the default tag name. Its makers can move it to a new version any day." }
    ms: { term: "latest", meaning: "Hanya nama tag lalai. Pembuatnya boleh alihkan ke versi baru bila-bila masa." }
  - id: docker-hub
    world: 1
    en: { term: "Docker Hub", meaning: "The biggest public shop freezer for images (docker.io). Docker uses it by default." }
    ms: { term: "Docker Hub", meaning: "Peti sejuk kedai awam terbesar untuk image (docker.io). Docker guna ini secara lalai." }
  - id: official-image
    world: 1
    en: { term: "Docker Official Image", meaning: "A trusted image Docker curates and keeps updated, like nginx or postgres. No user name in front." }
    ms: { term: "Docker Official Image", meaning: "Image dipercayai yang Docker pilih dan kemas kini, contohnya nginx atau postgres. Tiada nama pengguna di depan." }
  - id: verified-publisher
    world: 1
    en: { term: "Verified Publisher", meaning: "A Docker Hub badge for images from companies that Docker has checked." }
    ms: { term: "Verified Publisher", meaning: "Lencana Docker Hub untuk image daripada syarikat yang Docker sudah semak." }
  - id: prune
    world: 1
    en: { term: "prune", meaning: "Sweep away everything unused in one go. It asks first, and there is no undo." }
    ms: { term: "prune", meaning: "Sapu semua yang tak digunakan sekali gus. Ia tanya dulu, dan tak boleh dibatalkan." }
  # --- World D2 terms (add new D2 terms below this line) ---
  - id: dockerfile
    world: 2
    en: { term: "Dockerfile", meaning: "The recipe: step-by-step lines that make an image." }
    ms: { term: "Dockerfile", meaning: "Resepi untuk buat image." }
  - id: layer
    world: 2
    en: { term: "layer", meaning: "One layer of kek lapis. Change one, and every layer above it is baked again." }
    ms: { term: "layer (lapisan)", meaning: "Satu lapisan image; tukar satu, lapisan di atasnya dibuat semula." }
  - id: base-image
    world: 2
    en: { term: "base image", meaning: "The ready-made pack your recipe starts from. It is the FROM line." }
    ms: { term: "image asas", meaning: "Pek siap yang resepi anda mula guna. Itulah baris FROM." }
  - id: build-context
    world: 2
    en: { term: "build context", meaning: "The folder you send to the kitchen when you build. COPY can only take from it." }
    ms: { term: "konteks binaan", meaning: "Folder yang dihantar ke dapur semasa build. COPY hanya boleh ambil dari situ." }
  - id: dockerignore
    world: 2
    en: { term: ".dockerignore", meaning: "A list of files to leave at home. They are never sent to the build." }
    ms: { term: ".dockerignore", meaning: "Senarai fail yang ditinggalkan di rumah. Ia tidak dihantar ke build." }
  - id: build-cache
    world: 2
    en: { term: "build cache", meaning: "Layers kept from the last bake. A step that did not change is reused, not baked again." }
    ms: { term: "cache binaan", meaning: "Layer yang disimpan dari bakar lepas. Langkah yang tak berubah diguna semula." }
  - id: entrypoint
    world: 2
    en: { term: "ENTRYPOINT", meaning: "The fixed command an image always runs. Words you add go after it." }
    ms: { term: "ENTRYPOINT", meaning: "Arahan tetap yang image sentiasa jalankan. Perkataan tambahan anda masuk selepasnya." }
  - id: build-arg
    world: 2
    en: { term: "build argument (ARG)", meaning: "A setting used only while baking. It is not kept in the running container." }
    ms: { term: "argumen binaan (ARG)", meaning: "Tetapan yang dipakai semasa membakar sahaja. Ia tiada dalam container yang berjalan." }
  - id: image-label
    world: 2
    en: { term: "label", meaning: "A sticker on the pack with a fact, like its version or source code link." }
    ms: { term: "label", meaning: "Pelekat pada pek dengan satu fakta, contohnya versi atau pautan kod sumber." }
  - id: multi-stage-build
    world: 2
    en: { term: "multi-stage build", meaning: "Cook in one stage, pack in another. Only the finished dish goes in the final image." }
    ms: { term: "binaan berbilang peringkat", meaning: "Masak di satu peringkat, bungkus di peringkat lain. Hanya hidangan siap masuk image akhir." }
  - id: distroless
    world: 2
    en: { term: "distroless", meaning: "A base with only what the app needs to run. No shell, no package manager." }
    ms: { term: "distroless", meaning: "Image asas yang ada apa aplikasi perlu sahaja. Tiada shell, tiada pengurus pakej." }
  - id: non-root
    world: 2
    en: { term: "non-root user", meaning: "A normal user with few rights. If someone breaks in, they can do less." }
    ms: { term: "pengguna bukan root", meaning: "Pengguna biasa dengan hak yang sedikit. Jika orang menceroboh, mereka boleh buat lebih sedikit." }
  - id: healthcheck
    world: 2
    en: { term: "HEALTHCHECK", meaning: "A small test Docker runs again and again: is the app still answering?" }
    ms: { term: "HEALTHCHECK", meaning: "Ujian kecil yang Docker jalankan berulang kali: aplikasi masih menjawab?" }
  - id: build-secret
    world: 2
    en: { term: "build secret", meaning: "A key lent to one RUN step only. It never lands in a layer." }
    ms: { term: "rahsia binaan", meaning: "Kunci yang dipinjamkan kepada satu langkah RUN sahaja. Ia tidak masuk ke dalam layer." }
  - id: cache-mount
    world: 2
    en: { term: "cache mount", meaning: "A pantry shelf BuildKit keeps between bakes, for downloads. It is not in the image." }
    ms: { term: "cache mount", meaning: "Rak dapur yang BuildKit simpan antara bakar, untuk muat turun. Ia tiada dalam image." }
  - id: platform
    world: 2
    en: { term: "platform", meaning: "The OS and CPU type an image is built for, like linux/amd64 or linux/arm64." }
    ms: { term: "platform", meaning: "Jenis OS dan CPU yang image dibina untuknya, contohnya linux/amd64 atau linux/arm64." }
  # --- World D3 terms (add new D3 terms below this line) ---
  - id: volume
    world: 3
    en: { term: "volume", meaning: "A locker outside the lunchbox, so data stays when the container is gone." }
    ms: { term: "volume", meaning: "Loker data supaya tak hilang bila container dibuang." }
  - id: writable-layer
    world: 3
    en: { term: "writable layer", meaning: "The container's own thin top layer. Your changes land there. docker rm throws it away." }
    ms: { term: "writable layer (lapisan tulis)", meaning: "Lapisan nipis milik container sendiri. Perubahan anda masuk ke situ. docker rm membuangnya." }
  - id: bind-mount
    world: 3
    en: { term: "bind mount", meaning: "Your own shelf: a folder on your laptop, opened inside the container. Edits show up at once." }
    ms: { term: "bind mount", meaning: "Rak anda sendiri: folder di laptop yang dibuka dalam container. Suntingan terus nampak." }
  - id: tmpfs
    world: 3
    en: { term: "tmpfs", meaning: "A note on a whiteboard: data kept in memory only. Every stop wipes it." }
    ms: { term: "tmpfs", meaning: "Nota di papan putih: data dalam memori sahaja. Setiap kali berhenti, ia dipadam." }
  - id: user-network
    world: 3
    en: { term: "network (your own)", meaning: "A phone line you make with docker network create. Containers on it call each other by name." }
    ms: { term: "network (rangkaian sendiri)", meaning: "Talian telefon yang anda buat dengan docker network create. Container di atasnya boleh panggil satu sama lain ikut nama." }
  - id: container-dns
    world: 3
    en: { term: "container DNS", meaning: "Docker's phone book on your own network. Say a container's name, get its address." }
    ms: { term: "container DNS", meaning: "Buku telefon Docker dalam rangkaian sendiri. Sebut nama container, dapat alamatnya." }
  - id: env-file
    world: 3
    en: { term: "env file", meaning: "A settings card: one NAME=value per line, handed over with --env-file." }
    ms: { term: "fail env", meaning: "Kad tetapan: satu NAMA=nilai setiap baris, diberi dengan --env-file." }
  # --- World D4 terms (add new D4 terms below this line) ---
  - id: compose
    world: 4
    en: { term: "Compose", meaning: "A set meal: start many containers together with one command." }
    ms: { term: "Compose", meaning: "Hidupkan banyak container serentak dengan satu arahan." }
  - id: compose-service
    world: 4
    en: { term: "service", meaning: "One dish in the set meal, like web or db. Compose makes its containers and names them after it." }
    ms: { term: "service", meaning: "Satu hidangan dalam set, contohnya web atau db. Compose buat container untuknya dan namakan ikut nama service." }
  - id: compose-project
    world: 4
    en: { term: "project", meaning: "One set meal on the table. Its name comes from the folder, so containers are called kedai-kancil-web-1." }
    ms: { term: "projek", meaning: "Satu set hidangan atas meja. Namanya dari nama folder, jadi container bernama kedai-kancil-web-1." }
  - id: depends-on
    world: 4
    en: { term: "depends_on", meaning: "Who waits for whom. With condition: service_healthy, a dish waits until the other passes its health check." }
    ms: { term: "depends_on", meaning: "Siapa tunggu siapa. Dengan condition: service_healthy, satu hidangan tunggu sampai yang lain lulus health check." }
  - id: compose-interpolation
    world: 4
    en: { term: "interpolation", meaning: "Blanks like ${DB_PASSWORD} in compose.yaml that Compose fills in from your shell or a .env file." }
    ms: { term: "interpolation", meaning: "Tempat kosong seperti ${DB_PASSWORD} dalam compose.yaml yang Compose isi dari shell atau fail .env." }
  - id: compose-dotenv
    world: 4
    en: { term: ".env file", meaning: "A file next to compose.yaml with lines like DB_PASSWORD=devpass. Keep it out of Git." }
    ms: { term: "fail .env", meaning: "Fail di sebelah compose.yaml dengan baris seperti DB_PASSWORD=devpass. Jangan masukkan ke Git." }
  - id: compose-profile
    world: 4
    en: { term: "profile", meaning: "A side dish: a service that starts only when you ask, with --profile or by its name." }
    ms: { term: "profile", meaning: "Lauk tambahan: service yang hidup hanya bila diminta, dengan --profile atau ikut namanya." }
  - id: compose-override
    world: 4
    en: { term: "override file", meaning: "A second compose file laid on top of the first. compose.override.yaml loads by itself; others need -f." }
    ms: { term: "fail override", meaning: "Fail compose kedua yang diletak atas fail pertama. compose.override.yaml dibaca sendiri; yang lain perlukan -f." }
  - id: compose-watch
    world: 4
    en: { term: "compose watch", meaning: "Watches your files and copies, restarts or rebuilds a service when you save." }
    ms: { term: "compose watch", meaning: "Perhati fail anda dan salin, mula semula atau bina semula service bila anda simpan." }
  - id: compose-scale
    world: 4
    en: { term: "scale", meaning: "Run more copies of one service: docker compose up -d --scale api=3." }
    ms: { term: "scale (skala)", meaning: "Jalankan lebih banyak salinan satu service: docker compose up -d --scale api=3." }
  # --- World D5 terms (add new D5 terms below this line) ---
  - id: registry
    world: 5
    en: { term: "registry", meaning: "The shop freezer where image packs are stored and shared, like Docker Hub." }
    ms: { term: "registry", meaning: "Tempat simpan dan kongsi image, contohnya Docker Hub." }
  - id: access-token
    world: 5
    en: { term: "access token", meaning: "A spare key for one job. Use it instead of your password, and cancel it if it leaks." }
    ms: { term: "token akses", meaning: "Kunci ganti untuk satu kerja. Guna ia, bukan kata laluan, dan batalkan jika bocor." }
  - id: digest
    world: 5
    en: { term: "digest", meaning: "An image's fingerprint (sha256:…), made from every byte inside. It never moves, unlike a tag." }
    ms: { term: "digest", meaning: "Cap jari image (sha256:…), dibuat daripada setiap bait di dalamnya. Ia tak pernah berubah, tak macam tag." }
  - id: pull-limit
    world: 5
    en: { term: "pull limit", meaning: "How many images Docker Hub lets you pull every 6 hours. Logging in raises it." }
    ms: { term: "had tarikan", meaning: "Berapa banyak image Docker Hub benarkan anda tarik setiap 6 jam. Log masuk menaikkannya." }
  - id: vulnerability-scanner
    world: 5
    en: { term: "vulnerability scanner", meaning: "The food inspector: checks every package in an image against lists of known holes (CVEs)." }
    ms: { term: "pengimbas kelemahan", meaning: "Pemeriksa makanan: semak setiap pakej dalam image dengan senarai lubang keselamatan yang diketahui (CVE)." }
  - id: signing
    world: 5
    en: { term: "signing", meaning: "A tamper-proof seal on an image's digest. Anyone can check it before they run the image." }
    ms: { term: "tandatangan", meaning: "Meterai kalis usik pada digest image. Sesiapa boleh semak sebelum menjalankan image itu." }
  - id: capability
    world: 5
    en: { term: "capability", meaning: "One special root power, like changing who owns a file. Drop the ones your app never uses." }
    ms: { term: "capability", meaning: "Satu kuasa khas root, contohnya tukar pemilik fail. Buang yang aplikasi anda tak guna." }
  # --- World D6 terms (add new D6 terms below this line) ---
  - id: linux-kernel
    world: 6
    en: { term: "kernel", meaning: "The kitchen's one stove: the core of Linux. Every container on a machine cooks on the same kernel." }
    ms: { term: "kernel", meaning: "Dapur gas utama Linux; semua container dalam satu mesin guna kernel yang sama." }
  - id: linux-namespace
    world: 6
    en: { term: "namespace (Linux)", meaning: "Blinkers for a process: it sees only its own processes, network, files or hostname. Not a Kubernetes namespace." }
    ms: { term: "namespace (Linux)", meaning: "Penutup mata untuk proses: ia nampak proses, rangkaian, fail atau hostname sendiri sahaja. Bukan namespace Kubernetes." }
  - id: cgroup
    world: 6
    en: { term: "cgroup", meaning: "A portion limit: how much memory and CPU, and how many processes, a container may use." }
    ms: { term: "cgroup", meaning: "Had catuan: berapa banyak memori, CPU dan proses yang container boleh guna." }
  - id: overlay-filesystem
    world: 6
    en: { term: "overlay filesystem", meaning: "Read-only image layers with one thin writable sheet on top for each container. Many containers share one image." }
    ms: { term: "overlay filesystem", meaning: "Lapisan image baca sahaja, dengan satu plastik nipis boleh tulis di atas untuk setiap container." }
  - id: oci
    world: 6
    en: { term: "OCI", meaning: "Open Container Initiative: shared rules for images and for running them, so any runtime can cook any pack." }
    ms: { term: "OCI", meaning: "Open Container Initiative: peraturan bersama untuk image dan cara menjalankannya, supaya mana-mana runtime boleh guna." }
  - id: containerd
    world: 6
    en: { term: "containerd", meaning: "The kitchen manager: it keeps images and starts and watches containers. Docker and Kubernetes both use it." }
    ms: { term: "containerd", meaning: "Pengurus dapur: simpan image, mulakan dan jaga container. Docker dan Kubernetes sama-sama gunanya." }
  - id: runc
    world: 6
    en: { term: "runc", meaning: "The runtime that sets up the booth: it switches on namespaces and cgroups, starts your app, then leaves." }
    ms: { term: "runc", meaning: "Runtime yang sediakan bilik: hidupkan namespace dan cgroups, mulakan aplikasi, kemudian pergi." }
  - id: user-namespace
    world: 6
    en: { term: "user namespace", meaning: "Root inside the container, an ordinary user on the laptop. Off in Docker unless you ask." }
    ms: { term: "user namespace", meaning: "Root di dalam container, pengguna biasa pada laptop. Mati dalam Docker kecuali anda minta." }
  - id: rootless-mode
    world: 6
    en: { term: "rootless mode", meaning: "The Docker daemon and its containers run as you, not as root. A break-out gets only your rights." }
