# One shared glossary for tooltips and the glossary page, in both languages.
# In BM lessons, the first time a term appears, write: English term + plain meaning.
terms:
  - id: version-control
    world: 0
    en: { term: "version control", meaning: "A tool that remembers every saved version of your work." }
    ms: { term: "kawalan versi", meaning: "Alat yang ingat setiap versi kerja yang anda simpan." }
  - id: git
    world: 0
    en: { term: "Git", meaning: "A free tool on your computer that saves versions of your project." }
    ms: { term: "Git", meaning: "Alat percuma dalam komputer anda yang simpan versi projek." }
  - id: github
    world: 0
    en: { term: "GitHub", meaning: "A website that stores Git projects online and helps teams work together." }
    ms: { term: "GitHub", meaning: "Laman web yang simpan projek Git secara dalam talian dan bantu pasukan bekerja bersama." }
  - id: terminal
    world: 0
    en: { term: "terminal", meaning: "A window where you type commands to your computer." }
    ms: { term: "terminal", meaning: "Tetingkap tempat anda taip arahan kepada komputer." }
  - id: command
    world: 0
    en: { term: "command", meaning: "An instruction you type, like git status." }
    ms: { term: "arahan", meaning: "Perintah yang anda taip, contohnya git status." }
  - id: folder
    world: 0
    en: { term: "folder (directory)", meaning: "A place that holds files and other folders." }
    ms: { term: "folder (direktori)", meaning: "Tempat yang simpan fail dan folder lain." }
  - id: config
    world: 0
    en: { term: "config", meaning: "Git's settings, like your name and email." }
    ms: { term: "config", meaning: "Tetapan Git, contohnya nama dan e-mel anda." }
  - id: repository
    world: 1
    en: { term: "repository (repo)", meaning: "A project folder that Git looks after." }
    ms: { term: "repo", meaning: "Folder projek yang Git jaga." }
  - id: working-folder
    world: 1
    en: { term: "working folder", meaning: "Your normal files, where you edit things." }
    ms: { term: "folder kerja", meaning: "Fail biasa anda, tempat anda buat perubahan." }
  - id: staging-area
    world: 1
    en: { term: "staging area", meaning: "A box for changes that are ready to save." }
    ms: { term: "kawasan staging", meaning: "Kotak untuk perubahan yang dah siap." }
  - id: commit
    world: 1
    en: { term: "commit", meaning: "A save point, like in a game. A photo of the box." }
    ms: { term: "commit", meaning: "Titik simpan, macam save point dalam game." }
  - id: untracked
    world: 1
    en: { term: "untracked", meaning: "A new file Git is not watching yet." }
    ms: { term: "tidak dijejak (untracked)", meaning: "Fail baru yang Git belum perhatikan." }
  - id: hash
    world: 1
    en: { term: "hash (commit id)", meaning: "A unique code that names one commit, like a1b2c3d." }
    ms: { term: "hash (id commit)", meaning: "Kod unik yang menamakan satu commit, contohnya a1b2c3d." }
  - id: commit-message
    world: 1
    en: { term: "commit message", meaning: "A short note that says what a commit changed." }
    ms: { term: "mesej commit", meaning: "Nota pendek yang terangkan apa yang commit itu ubah." }
  - id: log
    world: 1
    en: { term: "log", meaning: "The list of your commits, newest first." }
    ms: { term: "log", meaning: "Senarai commit anda, yang terbaru dulu." }
  - id: diff
    world: 1
    en: { term: "diff", meaning: "The difference between two versions, line by line." }
    ms: { term: "diff", meaning: "Beza antara dua versi, baris demi baris." }
  - id: gitignore
    world: 1
    en: { term: ".gitignore", meaning: "A file that lists things Git should never save." }
    ms: { term: ".gitignore", meaning: "Fail yang senaraikan benda yang Git tak patut simpan." }
  - id: branch
    world: 1
    en: { term: "branch", meaning: "A storyline of commits. Each branch has a name, like main." }
    ms: { term: "branch", meaning: "Jalan cerita lain untuk cuba benda baru." }
  - id: head
    world: 1
    en: { term: "HEAD", meaning: "Git's \"you are here\" marker." }
    ms: { term: "HEAD", meaning: "Penanda \"anda di sini\"." }
  - id: conventional-commits
    world: 1
    en: { term: "Conventional Commits", meaning: "A simple style for messages: feat:, fix:, docs: and more." }
    ms: { term: "Conventional Commits", meaning: "Gaya mudah untuk mesej: feat:, fix:, docs: dan lain-lain." }
  - id: hunk
    world: 1
    en: { term: "hunk", meaning: "One piece of change inside a file." }
    ms: { term: "hunk", meaning: "Satu bahagian perubahan dalam fail." }
  - id: restore
    world: 2
    en: { term: "restore", meaning: "Put a file back to a saved version." }
    ms: { term: "restore", meaning: "Kembalikan fail ke versi yang disimpan." }
  - id: amend
    world: 2
    en: { term: "amend", meaning: "Replace your last commit with a fixed one." }
    ms: { term: "amend", meaning: "Ganti commit terakhir anda dengan versi yang dibaiki." }
  - id: reset
    world: 2
    en: { term: "reset", meaning: "Move your branch back to an older commit." }
    ms: { term: "reset", meaning: "Undurkan branch anda ke commit yang lebih lama." }
  - id: revert
    world: 2
    en: { term: "revert", meaning: "Make a new commit that undoes an old one." }
    ms: { term: "revert", meaning: "Buat commit baru yang membatalkan commit lama." }
  - id: detached-head
    world: 2
    en: { term: "detached HEAD", meaning: "HEAD points at a commit, not a branch. Good for looking around." }
    ms: { term: "HEAD terlerai (detached HEAD)", meaning: "HEAD tunjuk ke commit, bukan branch. Sesuai untuk tengok-tengok." }
  - id: clean
    world: 2
    en: { term: "clean", meaning: "Delete untracked junk files." }
    ms: { term: "clean", meaning: "Padam fail sampah yang tak dijejak." }
  - id: reflog
    world: 2
    en: { term: "reflog", meaning: "Git's diary of everywhere HEAD has been." }
    ms: { term: "reflog", meaning: "Diari Git tentang semua tempat HEAD pernah pergi." }
  - id: merge
    world: 3
    en: { term: "merge", meaning: "Join two storylines into one." }
    ms: { term: "merge (cantum)", meaning: "Gabungkan dua jalan cerita jadi satu." }
  - id: conflict
    world: 3
    en: { term: "conflict", meaning: "Two changes hit the same spot. You pick what stays." }
    ms: { term: "konflik", meaning: "Dua perubahan bertembung di tempat sama." }
  - id: remote
    world: 4
    en: { term: "remote / origin", meaning: "A copy of your project on the internet, for example on GitHub." }
    ms: { term: "remote / origin", meaning: "Salinan projek di internet, contohnya di GitHub." }
  - id: clone
    world: 4
    en: { term: "clone", meaning: "Copy a whole project to your computer." }
    ms: { term: "clone", meaning: "Salin seluruh projek ke komputer anda." }
  - id: push-pull
    world: 4
    en: { term: "push / pull", meaning: "Send to GitHub / bring in the latest changes." }
    ms: { term: "push / pull", meaning: "Hantar ke GitHub / tarik perubahan terbaru." }
  - id: fork
    world: 4
    en: { term: "fork", meaning: "Your own copy of someone else's project, in your account." }
    ms: { term: "fork", meaning: "Salinan projek orang lain dalam akaun anda." }
  - id: pull-request
    world: 5
    en: { term: "pull request (PR)", meaning: "Ask others to review and accept your changes." }
    ms: { term: "pull request (PR)", meaning: "Minta orang semak dan terima perubahan anda." }

  # --- World 3 terms (add new World 3 terms below this line) ---
  - id: fast-forward
    world: 3
    en: { term: "fast-forward", meaning: "A merge where Git just slides your branch forward. No new commit." }
    ms: { term: "fast-forward", meaning: "Merge di mana Git cuma gerakkan branch anda ke depan. Tiada commit baru." }
  - id: merge-base
    world: 3
    en: { term: "merge base", meaning: "The last commit two branches share: the spot where they split." }
    ms: { term: "merge base", meaning: "Commit terakhir yang dikongsi dua branch: tempat ia berpecah." }
  - id: three-way-merge
    world: 3
    en: { term: "three-way merge", meaning: "Git compares both branch tips with their merge base, then joins them." }
    ms: { term: "merge tiga hala", meaning: "Git banding kedua-dua hujung branch dengan merge base, kemudian cantumkannya." }
  - id: merge-commit
    world: 3
    en: { term: "merge commit", meaning: "A commit with two parents. It joins two branches." }
    ms: { term: "merge commit", meaning: "Commit dengan dua induk. Ia sambungkan dua branch." }
  - id: stash
    world: 3
    en: { term: "stash", meaning: "A drawer for unfinished changes. Your folder gets clean; take them back later." }
    ms: { term: "stash", meaning: "Laci untuk perubahan yang belum siap. Folder jadi bersih; ambil semula kemudian." }
  - id: rebase
    world: 3
    en: { term: "rebase", meaning: "Replay your commits on top of another branch. They become new commits." }
    ms: { term: "rebase", meaning: "Main semula commit anda di atas branch lain. Ia jadi commit baru." }
  - id: interactive-rebase
    world: 3
    en: { term: "interactive rebase", meaning: "git rebase -i: tidy your own commits before you share them." }
    ms: { term: "rebase interaktif", meaning: "git rebase -i: kemaskan commit sendiri sebelum anda kongsi." }
  - id: squash
    world: 3
    en: { term: "squash", meaning: "Join a commit into the one before it, and keep both messages." }
    ms: { term: "squash", meaning: "Gabungkan commit ke dalam commit sebelumnya, dan simpan kedua-dua mesej." }
    confusable: [fixup]
  - id: fixup
    world: 3
    en: { term: "fixup", meaning: "Like squash, but this commit's message is thrown away." }
    ms: { term: "fixup", meaning: "Macam squash, tetapi mesej commit ini dibuang." }
  - id: cherry-pick
    world: 3
    en: { term: "cherry-pick", meaning: "Copy one commit from another branch onto yours." }
    ms: { term: "cherry-pick", meaning: "Salin satu commit dari branch lain ke branch anda." }
  - id: golden-rule
    world: 3
    en: { term: "golden rule of rebase", meaning: "Never rebase commits that other people already have." }
    ms: { term: "peraturan emas rebase", meaning: "Jangan rebase commit yang orang lain dah ada." }

  # --- World 4 terms (add new World 4 terms below this line) ---
  - id: personal-access-token
    world: 4
    en: { term: "personal access token (PAT)", meaning: "A long secret code Git uses instead of your password. A fine-grained one opens only the repos you pick." }
    ms: { term: "token akses peribadi (PAT)", meaning: "Kod rahsia panjang yang Git guna, bukan kata laluan anda. Token fine-grained hanya buka repo yang anda pilih." }
  - id: credential-manager
    world: 4
    en: { term: "Git Credential Manager (GCM)", meaning: "A helper that signs Git in to GitHub through your browser and remembers it safely." }
    ms: { term: "Git Credential Manager (GCM)", meaning: "Pembantu yang log masuk Git ke GitHub melalui pelayar dan ingat dengan selamat." }
  - id: ssh-key
    world: 4
    en: { term: "SSH key", meaning: "A key pair. The private key stays on your computer. The public key goes to GitHub." }
    ms: { term: "kunci SSH (SSH key)", meaning: "Sepasang kunci. Kunci peribadi kekal dalam komputer. Kunci awam diberi kepada GitHub." }
  - id: push
    world: 4
    confusable: [push-pull]
    en: { term: "push", meaning: "Send your new commits to a remote, like GitHub." }
    ms: { term: "push (hantar)", meaning: "Hantar commit baru anda ke remote, contohnya GitHub." }
  - id: upstream
    world: 4
    en: { term: "upstream", meaning: "The remote branch your branch follows, like origin/main. For a fork, also the usual name for the original repo." }
    ms: { term: "upstream", meaning: "Branch remote yang branch anda ikut, contohnya origin/main. Untuk fork, juga nama biasa bagi repo asal." }
  - id: fetch
    world: 4
    en: { term: "fetch", meaning: "Download news from a remote. Your own branches and files stay the same." }
    ms: { term: "fetch (ambil berita)", meaning: "Muat turun berita dari remote. Branch dan fail anda kekal sama." }
  - id: pull
    world: 4
    confusable: [push-pull]
    en: { term: "pull", meaning: "Fetch, then join the new commits into your branch." }
    ms: { term: "pull (tarik)", meaning: "Fetch, kemudian cantum commit baru ke dalam branch anda." }
  - id: remote-tracking-branch
    world: 4
    en: { term: "remote-tracking branch", meaning: "Your laptop's memory of a remote branch, like origin/main. It moves when you fetch." }
    ms: { term: "branch penjejak remote", meaning: "Ingatan laptop anda tentang branch remote, contohnya origin/main. Ia bergerak bila anda fetch." }
  - id: force-push
    world: 4
    en: { term: "force push", meaning: "Make the remote branch match yours, even if that throws away commits there." }
    ms: { term: "force push (push paksa)", meaning: "Paksa branch remote jadi sama dengan branch anda, walaupun commit di sana terbuang." }
  - id: tag
    world: 4
    en: { term: "tag", meaning: "A name stuck on one commit, like v1.0.0. It never moves." }
    ms: { term: "tag (label)", meaning: "Nama yang dilekat pada satu commit, contohnya v1.0.0. Ia tak pernah bergerak." }
  - id: release
    world: 4
    en: { term: "release", meaning: "A GitHub page for one tagged version, with notes and files to download." }
    ms: { term: "release (keluaran)", meaning: "Halaman GitHub untuk satu versi bertag, dengan nota dan fail untuk dimuat turun." }

  # --- World 5 terms (add new World 5 terms below this line) ---
  - id: readme
    world: 5
    en: { term: "README", meaning: "The front-door file of a repo. It says what the project is and how to start." }
    ms: { term: "README", meaning: "Fail pintu depan sesebuah repo. Ia terangkan projek itu dan cara mula." }
  - id: markdown
    world: 5
    en: { term: "Markdown", meaning: "Plain text with simple signs, like # for a heading. GitHub turns it into a neat page." }
    ms: { term: "Markdown", meaning: "Teks biasa dengan tanda mudah, contohnya # untuk tajuk. GitHub tukar jadi halaman yang kemas." }
  - id: task-list
    world: 5
    en: { term: "task list", meaning: "A Markdown list with tick boxes: - [ ] to do, - [x] done." }
    ms: { term: "senarai tugas", meaning: "Senarai Markdown dengan kotak tanda: - [ ] belum, - [x] siap." }
  - id: markdown-alert
    world: 5
    en: { term: "alert", meaning: "A coloured Markdown box for a note, tip or warning, like > [!WARNING]." }
    ms: { term: "amaran (alert)", meaning: "Kotak Markdown berwarna untuk nota, tip atau amaran, contohnya > [!WARNING]." }
  - id: mermaid
    world: 5
    en: { term: "Mermaid", meaning: "Text in a mermaid code block that GitHub draws as a diagram." }
    ms: { term: "Mermaid", meaning: "Teks dalam blok kod mermaid yang GitHub lukis jadi rajah." }
  - id: issue
    world: 5
    en: { term: "issue", meaning: "A to-do note on a repo: a bug, an idea or a question. The team can talk about it and close it." }
    ms: { term: "issue", meaning: "Nota tugasan dalam repo: pepijat, idea atau soalan. Pasukan boleh berbincang dan menutupnya." }
  - id: label
    world: 5
    en: { term: "label", meaning: "A coloured tag on an issue or pull request, like bug or documentation." }
    ms: { term: "label", meaning: "Tag berwarna pada issue atau pull request, contohnya bug atau documentation." }
  - id: milestone
    world: 5
    en: { term: "milestone", meaning: "A group of issues and pull requests for one goal, with a progress bar." }
    ms: { term: "milestone", meaning: "Satu kumpulan issue dan pull request untuk satu matlamat, dengan bar kemajuan." }
  - id: issue-template
    world: 5
    en: { term: "issue template", meaning: "A ready-made form with blanks, so every new issue gives the details you need." }
    ms: { term: "templat issue", meaning: "Borang siap dengan ruang kosong, supaya setiap issue baru beri butiran yang perlu." }
  - id: sub-issue
    world: 5
    en: { term: "sub-issue", meaning: "A small issue inside a bigger one. The big issue shows how many are done." }
    ms: { term: "sub-issue", meaning: "Issue kecil di dalam issue yang lebih besar. Issue besar tunjuk berapa yang dah siap." }
  - id: issue-type
    world: 5
    en: { term: "issue type", meaning: "The kind of work an issue is, like Bug, Feature or Task. Organizations set these up." }
    ms: { term: "jenis issue", meaning: "Jenis kerja sesuatu issue, contohnya Bug, Feature atau Task. Organisasi yang sediakannya." }
  - id: draft-pull-request
    world: 5
    en: { term: "draft pull request", meaning: "A pull request marked as not finished. Nobody can merge it until it is ready for review." }
    ms: { term: "draf pull request", meaning: "Pull request yang ditanda belum siap. Tiada siapa boleh merge sampai ia sedia untuk review." }
  - id: code-review
    world: 5
    en: { term: "code review", meaning: "Reading a teammate's changes before they join main, then commenting, approving or asking for changes." }
    ms: { term: "code review (semakan kod)", meaning: "Baca perubahan rakan sebelum ia masuk ke main, kemudian komen, luluskan atau minta perubahan." }
  - id: suggested-change
    world: 5
    en: { term: "suggested change", meaning: "A review comment that shows the exact new line. The author can apply it with one click." }
    ms: { term: "cadangan perubahan", meaning: "Komen review yang tunjuk baris baru yang tepat. Penulis boleh terima dengan satu klik." }
  - id: closing-keyword
    world: 5
    en: { term: "closing keyword", meaning: "Words like Closes #9 in a pull request. When it merges into the default branch, issue 9 closes." }
    ms: { term: "kata kunci penutup", meaning: "Perkataan seperti Closes #9 dalam pull request. Bila ia merge ke branch utama, issue 9 ditutup." }
  - id: squash-merge
    world: 5
    en: { term: "squash and merge", meaning: "Merge a pull request as one single, tidy commit." }
    ms: { term: "squash dan merge", meaning: "Merge pull request sebagai satu commit yang kemas." }
  - id: rebase-merge
    world: 5
    en: { term: "rebase and merge", meaning: "Copy each commit of a pull request onto main, one by one, with no merge commit." }
    ms: { term: "rebase dan merge", meaning: "Salin setiap commit pull request ke atas main, satu demi satu, tanpa merge commit." }
  - id: conflict-markers
    world: 5
    en: { term: "conflict markers", meaning: "The lines <<<<<<<, ======= and >>>>>>> that Git puts around a clash." }
    ms: { term: "penanda konflik", meaning: "Baris <<<<<<<, ======= dan >>>>>>> yang Git letak di sekeliling pertembungan." }
  - id: branch-protection
    world: 5
    en: { term: "branch protection", meaning: "Rules on a branch, like: no merging without a review and passing checks." }
    ms: { term: "perlindungan branch", meaning: "Peraturan pada branch, contohnya: tak boleh merge tanpa review dan semakan yang lulus." }
  - id: ruleset
    world: 5
    en: { term: "ruleset", meaning: "A named list of rules for branches or tags. Several rulesets can apply at once." }
    ms: { term: "ruleset", meaning: "Senarai peraturan bernama untuk branch atau tag. Beberapa ruleset boleh berlaku serentak." }
  - id: codeowners
    world: 5
    en: { term: "CODEOWNERS", meaning: "A file that says who owns which files. Owners are asked to review changes to them." }
    ms: { term: "CODEOWNERS", meaning: "Fail yang beritahu siapa pemilik fail mana. Pemilik diminta review perubahan pada fail itu." }
  - id: project-board
    world: 5
    en: { term: "project (Projects)", meaning: "A planning board or table for issues and pull requests, with columns like To do and Done." }
    ms: { term: "project (Projects)", meaning: "Papan atau jadual perancangan untuk issue dan pull request, dengan lajur seperti To do dan Done." }
  - id: discussions
    world: 5
    en: { term: "Discussions", meaning: "A forum inside a repo for questions, ideas and polls that are not to-dos." }
    ms: { term: "Discussions", meaning: "Forum dalam repo untuk soalan, idea dan undian yang bukan tugasan." }
  - id: wiki
    world: 5
    en: { term: "wiki", meaning: "Pages of long guides that live next to a repo, separate from the code." }
    ms: { term: "wiki", meaning: "Halaman panduan panjang yang duduk di sebelah repo, berasingan dari kod." }
  - id: gist
    world: 5
    en: { term: "gist", meaning: "A tiny repo for sharing a snippet or a few files. Secret gists are not private." }
    ms: { term: "gist", meaning: "Repo kecil untuk kongsi sedikit kod atau beberapa fail. Gist rahsia bukan peribadi." }
  - id: organization
    world: 5
    en: { term: "organization", meaning: "A shared GitHub account for a group, with teams and roles for its members." }
    ms: { term: "organisasi", meaning: "Akaun GitHub yang dikongsi oleh satu kumpulan, dengan pasukan dan peranan untuk ahlinya." }
  - id: open-source
    world: 5
    en: { term: "open source", meaning: "Code anyone can read, use and help with, under its licence." }
    ms: { term: "sumber terbuka", meaning: "Kod yang sesiapa boleh baca, guna dan bantu, ikut lesennya." }
  - id: license
    world: 5
    en: { term: "licence", meaning: "A file that says what others may do with your code." }
    ms: { term: "lesen", meaning: "Fail yang beritahu apa orang lain boleh buat dengan kod anda." }
  - id: contributing-guide
    world: 5
    en: { term: "CONTRIBUTING.md", meaning: "The house rules for helpers: how to report, change and send work." }
    ms: { term: "CONTRIBUTING.md", meaning: "Peraturan rumah untuk pembantu: cara melapor, mengubah dan menghantar kerja." }
  - id: good-first-issue
    world: 5
    en: { term: "good first issue", meaning: "A label for an easy issue that a newcomer can pick up." }
    ms: { term: "good first issue", meaning: "Label untuk issue mudah yang sesuai bagi orang baru." }

  # --- World 6 terms (add new World 6 terms below this line) ---
  - id: github-flow
    world: 6
    en: { term: "GitHub Flow", meaning: "A simple team loop: short branch off main, pull request, review, merge." }
    ms: { term: "GitHub Flow", meaning: "Kitaran ringkas pasukan: branch pendek dari main, pull request, semakan, merge." }
  - id: git-flow
    world: 6
    en: { term: "Git Flow", meaning: "A workflow with main, develop, feature, release and hotfix branches." }
    ms: { term: "Git Flow", meaning: "Aliran kerja dengan branch main, develop, feature, release dan hotfix." }
  - id: release-branch
    world: 6
    en: { term: "release branch", meaning: "A branch where the next version gets its last checks before it ships." }
    ms: { term: "release branch", meaning: "Branch tempat versi seterusnya disemak kali terakhir sebelum dihantar." }
  - id: trunk-based
    world: 6
    en: { term: "trunk-based development", meaning: "Everyone merges small changes into main (the trunk) at least once a day." }
    ms: { term: "pembangunan berasaskan trunk", meaning: "Semua orang merge perubahan kecil ke main (trunk) sekurang-kurangnya sekali sehari." }
  - id: feature-flag
    world: 6
    en: { term: "feature flag", meaning: "An on/off switch in your code that hides unfinished work." }
    ms: { term: "feature flag", meaning: "Suis hidup/mati dalam kod yang sorok kerja yang belum siap." }
  - id: semantic-versioning
    world: 6
    en: { term: "Semantic Versioning (SemVer)", meaning: "Version numbers in three parts: MAJOR.MINOR.PATCH." }
    ms: { term: "Semantic Versioning (SemVer)", meaning: "Nombor versi dalam tiga bahagian: MAJOR.MINOR.PATCH." }
  - id: changelog
    world: 6
    en: { term: "changelog", meaning: "A list of the changes in each version, written for people." }
    ms: { term: "changelog (log perubahan)", meaning: "Senarai perubahan dalam setiap versi, ditulis untuk manusia." }
  - id: monorepo
    world: 6
    en: { term: "monorepo", meaning: "One repo that holds many projects, each in its own folder." }
    ms: { term: "monorepo", meaning: "Satu repo yang simpan banyak projek, setiap satu dalam folder sendiri." }
  - id: hotfix
    world: 6
    en: { term: "hotfix", meaning: "A small, urgent fix for code that is already live." }
    ms: { term: "hotfix", meaning: "Pembaikan kecil dan segera untuk kod yang dah live." }

  # --- World 7 terms (add new World 7 terms below this line) ---
  - id: ci
    world: 7
    en: { term: "continuous integration (CI)", meaning: "A robot tests every change as soon as you push it." }
    ms: { term: "continuous integration (CI)", meaning: "Robot uji setiap perubahan sebaik sahaja anda push." }
  - id: cd
    world: 7
    en: { term: "continuous delivery / deployment (CD)", meaning: "A robot ships your tested changes, so users get them fast." }
    ms: { term: "continuous delivery / deployment (CD)", meaning: "Robot hantar perubahan yang dah diuji, supaya pengguna cepat dapat." }
  - id: github-actions
    world: 7
    en: { term: "GitHub Actions", meaning: "GitHub's robot service. It runs your workflows on its computers." }
    ms: { term: "GitHub Actions", meaning: "Servis robot GitHub. Ia jalankan workflow anda di komputernya." }
  - id: yaml
    world: 7
    en: { term: "YAML", meaning: "A simple text format made of keys, colons and spaces. Workflows use it." }
    ms: { term: "YAML", meaning: "Format teks ringkas dengan kunci, titik bertindih dan ruang. Workflow guna format ini." }
  - id: workflow
    world: 7
    en: { term: "workflow", meaning: "A YAML file in .github/workflows/ that tells the robot when and what to run." }
    ms: { term: "workflow", meaning: "Fail YAML dalam .github/workflows/ yang beritahu robot bila dan apa nak dijalankan." }
  - id: trigger
    world: 7
    en: { term: "trigger (event)", meaning: "What wakes a workflow up, like a push, a pull request or a clock." }
    ms: { term: "trigger (pencetus)", meaning: "Apa yang kejutkan workflow, contohnya push, pull request atau jam." }
  - id: job
    world: 7
    en: { term: "job", meaning: "A group of steps that runs on one fresh computer." }
    ms: { term: "job", meaning: "Satu kumpulan langkah yang berjalan pada satu komputer baru." }
  - id: runner
    world: 7
    en: { term: "runner", meaning: "The fresh computer that runs one job, then gets wiped." }
    ms: { term: "runner", meaning: "Komputer baru yang jalankan satu job, kemudian dikosongkan." }
  - id: step
    world: 7
    en: { term: "step", meaning: "One task in a job: a command (run) or a ready-made action (uses)." }
    ms: { term: "step (langkah)", meaning: "Satu tugas dalam job: arahan (run) atau action siap pakai (uses)." }
  - id: action
    world: 7
    en: { term: "action", meaning: "A ready-made step someone shared. You borrow it with uses:." }
    ms: { term: "action", meaning: "Langkah siap pakai yang orang kongsi. Anda pinjam dengan uses:." }
  - id: marketplace
    world: 7
    en: { term: "GitHub Marketplace", meaning: "GitHub's shop where people share actions and apps." }
    ms: { term: "GitHub Marketplace", meaning: "Kedai GitHub tempat orang kongsi action dan aplikasi." }
  - id: pinning
    world: 7
    en: { term: "pinning (an action)", meaning: "Using an action's full commit SHA, so its code can never change under you." }
    ms: { term: "pinning (sematkan action)", meaning: "Guna SHA commit penuh sesuatu action, supaya kodnya tak boleh berubah senyap-senyap." }
  - id: cron
    world: 7
    en: { term: "cron", meaning: "A short time code: minute, hour, day, month, weekday. Example: 30 1 * * 1." }
    ms: { term: "cron", meaning: "Kod masa ringkas: minit, jam, hari, bulan, hari minggu. Contoh: 30 1 * * 1." }
  - id: variable
    world: 7
    en: { term: "variable (configuration variable)", meaning: "A plain workflow setting that is not secret, like a site address." }
    ms: { term: "variable (pemboleh ubah)", meaning: "Tetapan workflow biasa yang bukan rahsia, contohnya alamat laman." }
  - id: environment
    world: 7
    en: { term: "environment", meaning: "A named place you deploy to, like production, with its own secrets and rules." }
    ms: { term: "environment (persekitaran)", meaning: "Tempat bernama untuk deploy, contohnya production, dengan rahsia dan peraturan sendiri." }
  - id: matrix
    world: 7
    en: { term: "matrix", meaning: "One job recipe that runs once for each item in a list." }
    ms: { term: "matrix", meaning: "Satu resipi job yang berjalan sekali untuk setiap item dalam senarai." }
  - id: cache
    world: 7
    en: { term: "cache", meaning: "Saved downloads that make the next run faster." }
    ms: { term: "cache", meaning: "Muat turun yang disimpan, supaya larian seterusnya lebih laju." }
  - id: artifact
    world: 7
    en: { term: "artifact", meaning: "Files a workflow run saves, so you can download them later." }
    ms: { term: "artifact (artifak)", meaning: "Fail yang larian workflow simpan, supaya anda boleh muat turun kemudian." }
  - id: status-check
    world: 7
    en: { term: "status check", meaning: "The pass or fail mark a workflow puts on a commit or pull request." }
    ms: { term: "status check (semakan status)", meaning: "Tanda lulus atau gagal yang workflow letak pada commit atau pull request." }
  - id: badge
    world: 7
    en: { term: "status badge", meaning: "A small picture in a README that shows if a workflow passes." }
    ms: { term: "status badge (lencana status)", meaning: "Gambar kecil dalam README yang tunjuk sama ada workflow lulus." }
  - id: reusable-workflow
    world: 7
    en: { term: "reusable workflow", meaning: "A workflow other workflows can call, made with on: workflow_call." }
    ms: { term: "reusable workflow (workflow boleh guna semula)", meaning: "Workflow yang workflow lain boleh panggil, dibuat dengan on: workflow_call." }
  - id: github-token
    world: 7
    en: { term: "GITHUB_TOKEN", meaning: "A short-lived key each job gets. It stops working when the job ends." }
    ms: { term: "GITHUB_TOKEN", meaning: "Kunci jangka pendek yang setiap job dapat. Ia tamat bila job selesai." }
  - id: permissions
    world: 7
    en: { term: "permissions", meaning: "The list of what GITHUB_TOKEN may do, like read code or write to Pages." }
    ms: { term: "permissions (kebenaran)", meaning: "Senarai apa yang GITHUB_TOKEN boleh buat, contohnya baca kod atau tulis ke Pages." }

  # --- World 8 terms (add new World 8 terms below this line) ---
  - id: two-factor
    world: 8
    en: { term: "two-factor authentication (2FA)", meaning: "A second check after your password, like a code from your phone." }
    ms: { term: "pengesahan dua faktor (2FA)", meaning: "Semakan kedua selepas kata laluan, contohnya kod dari telefon anda." }
  - id: passkey
    world: 8
    en: { term: "passkey", meaning: "A sign-in key kept on your device. You unlock it with your face, finger or PIN." }
    ms: { term: "passkey", meaning: "Kunci log masuk dalam peranti anda. Anda buka dengan muka, cap jari atau PIN." }
  - id: secret
    world: 8
    en: { term: "secret", meaning: "A password, API key or token. Whoever has it can get in." }
    ms: { term: "rahsia (secret)", meaning: "Kata laluan, kunci API atau token. Sesiapa yang ada boleh masuk." }
  - id: secret-scanning
    world: 8
    en: { term: "secret scanning", meaning: "GitHub reads your repo and its history, looking for leaked keys." }
    ms: { term: "secret scanning (imbasan rahsia)", meaning: "GitHub baca repo dan sejarahnya untuk cari kunci yang bocor." }
  - id: push-protection
    world: 8
    en: { term: "push protection", meaning: "GitHub blocks a push that holds a secret, before it lands." }
    ms: { term: "push protection (perlindungan push)", meaning: "GitHub sekat push yang ada rahsia, sebelum ia sampai." }
  - id: rotate-key
    world: 8
    en: { term: "rotate (a key)", meaning: "Cancel a leaked key and make a new one, so the old copy is useless." }
    ms: { term: "rotate (tukar kunci)", meaning: "Batalkan kunci yang bocor dan buat yang baru, supaya salinan lama tak berguna." }
  - id: filter-repo
    world: 8
    en: { term: "git filter-repo", meaning: "A separate tool that rewrites history, for example to wipe a file from every commit." }
    ms: { term: "git filter-repo", meaning: "Alat berasingan yang tulis semula sejarah, contohnya padam fail dari setiap commit." }
  - id: dependency
    world: 8
    en: { term: "dependency", meaning: "Code written by others that your project uses, like a package." }
    ms: { term: "dependency", meaning: "Kod tulisan orang lain yang projek anda guna, contohnya pakej." }
  - id: dependabot
    world: 8
    en: { term: "Dependabot", meaning: "GitHub's helper that warns about unsafe packages and can open pull requests to update them." }
    ms: { term: "Dependabot", meaning: "Pembantu GitHub yang beri amaran tentang pakej tak selamat dan boleh buka pull request untuk kemas kini." }
  - id: vulnerability
    world: 8
    en: { term: "vulnerability", meaning: "A security hole that an attacker could use." }
    ms: { term: "kelemahan keselamatan", meaning: "Lubang keselamatan yang penyerang boleh guna." }
  - id: codeql
    world: 8
    en: { term: "CodeQL", meaning: "GitHub's code detective. It turns code into data and asks questions to find risky code." }
    ms: { term: "CodeQL", meaning: "Detektif kod GitHub. Ia jadikan kod sebagai data dan tanya soalan untuk cari kod berisiko." }
  - id: code-scanning
    world: 8
    en: { term: "code scanning", meaning: "Automatic checks, like CodeQL, that look for security problems in your code." }
    ms: { term: "code scanning (imbasan kod)", meaning: "Semakan automatik, contohnya CodeQL, yang cari masalah keselamatan dalam kod anda." }
  - id: security-policy
    world: 8
    en: { term: "security policy (SECURITY.md)", meaning: "A file that tells people how to report security bugs privately." }
    ms: { term: "dasar keselamatan (SECURITY.md)", meaning: "Fail yang beritahu cara melaporkan pepijat keselamatan secara sulit." }
  - id: security-advisory
    world: 8
    en: { term: "security advisory", meaning: "A private space to fix a security bug, then a public warning about it." }
    ms: { term: "security advisory (nasihat keselamatan)", meaning: "Ruang sulit untuk baiki pepijat keselamatan, kemudian amaran awam tentangnya." }
  - id: signed-commit
    world: 8
    en: { term: "signed commit", meaning: "A commit with your digital signature, made with your private key." }
    ms: { term: "commit bertandatangan", meaning: "Commit dengan tandatangan digital anda, dibuat dengan kunci peribadi anda." }
  - id: verified-badge
    world: 8
    en: { term: "Verified badge", meaning: "A label GitHub shows when a commit's signature checks out." }
    ms: { term: "lencana Verified", meaning: "Label yang GitHub tunjuk bila tandatangan commit itu sah." }

  # --- World 9 terms (add new World 9 terms below this line) ---
  - id: github-cli
    world: 9
    en: { term: "GitHub CLI (gh)", meaning: "A free tool that talks to GitHub from your terminal. Its command is gh." }
    ms: { term: "GitHub CLI (gh)", meaning: "Alat percuma yang bercakap dengan GitHub dari terminal anda. Arahannya gh." }
  - id: github-dev
    world: 9
    en: { term: "github.dev", meaning: "A code editor in your browser. Press . on a repo page to open it. It has no terminal." }
    ms: { term: "github.dev", meaning: "Editor kod dalam pelayar anda. Tekan . pada halaman repo untuk membukanya. Ia tiada terminal." }
  - id: codespace
    world: 9
    en: { term: "Codespace", meaning: "A computer in the cloud, set up for your repo, with an editor and a terminal." }
    ms: { term: "Codespace", meaning: "Komputer di awan yang siap untuk repo anda, dengan editor dan terminal." }
  - id: github-pages
    world: 9
    en: { term: "GitHub Pages", meaning: "Hosting that turns plain files in your repo (HTML, CSS, JavaScript) into a website." }
    ms: { term: "GitHub Pages", meaning: "Hos yang jadikan fail biasa dalam repo anda (HTML, CSS, JavaScript) sebuah laman web." }
  - id: github-desktop
    world: 9
    en: { term: "GitHub Desktop", meaning: "A free app with buttons for Git jobs: commit, branch, push and pull." }
    ms: { term: "GitHub Desktop", meaning: "Aplikasi percuma dengan butang untuk kerja Git: commit, branch, push dan pull." }
  - id: copilot
    world: 9
    en: { term: "GitHub Copilot", meaning: "GitHub's AI helper. It suggests code, answers questions and can work on small tasks." }
    ms: { term: "GitHub Copilot", meaning: "Pembantu AI GitHub. Ia cadangkan kod, jawab soalan dan boleh buat tugas kecil." }
  - id: coding-agent
    world: 9
    en: { term: "coding agent", meaning: "An AI helper that works on a task by itself, then opens a pull request for you to review." }
    ms: { term: "coding agent (ejen pengekodan)", meaning: "Pembantu AI yang buat tugas sendiri, kemudian buka pull request untuk anda semak." }
  - id: package
    world: 9
    en: { term: "package", meaning: "A bundle of code with a name and a version that others can install." }
    ms: { term: "pakej (package)", meaning: "Himpunan kod dengan nama dan versi yang orang lain boleh pasang." }
  - id: registry
    world: 9
    en: { term: "registry", meaning: "An online shelf where packages are stored and shared." }
    ms: { term: "registry (rak pakej)", meaning: "Rak dalam talian tempat pakej disimpan dan dikongsi." }
  - id: api
    world: 9
    en: { term: "API", meaning: "A service window for programs. A program asks, and the website answers with data." }
    ms: { term: "API", meaning: "Kaunter khas untuk program. Program bertanya, laman web jawab dengan data." }
  - id: webhook
    world: 9
    en: { term: "webhook", meaning: "A doorbell: GitHub calls your web address when something happens." }
