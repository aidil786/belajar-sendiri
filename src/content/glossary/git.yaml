    en: { term: "code search", meaning: "Search through code on GitHub, across many repos at once. You must be signed in." }
    ms: { term: "carian kod (code search)", meaning: "Cari dalam kod di GitHub, merentas banyak repo sekali gus. Anda mesti log masuk." }
  - id: search-qualifier
    world: 9
    en: { term: "qualifier", meaning: "A filter in a search, like repo: or language:." }
    ms: { term: "qualifier (penapis)", meaning: "Penapis dalam carian, contohnya repo: atau language:." }
  - id: github-education
    world: 9
    en: { term: "GitHub Education", meaning: "GitHub's free program that helps students and teachers." }
    ms: { term: "GitHub Education", meaning: "Program percuma GitHub yang bantu pelajar dan guru." }
  - id: student-pack
    world: 9
    en: { term: "Student Developer Pack", meaning: "Free offers on developer tools for verified students." }
    ms: { term: "Student Developer Pack", meaning: "Tawaran percuma untuk alatan pembangun, bagi pelajar yang disahkan." }

  # --- World 10 terms (add new World 10 terms below this line) ---
  - id: object
    world: 10
    en: { term: "object", meaning: "One thing Git stores: a blob, a tree, a commit or a tag. Its name is a hash of its content." }
    ms: { term: "objek (object)", meaning: "Satu benda yang Git simpan: blob, tree, commit atau tag. Namanya ialah hash isinya." }
  - id: blob
    world: 10
    en: { term: "blob", meaning: "An object that holds the content of one file. No name, just the content." }
    ms: { term: "blob", meaning: "Objek yang simpan isi satu fail. Tiada nama, isi sahaja." }
  - id: tree
    world: 10
    en: { term: "tree", meaning: "An object that lists one folder: names that point to blobs (files) and trees (folders)." }
    ms: { term: "tree", meaning: "Objek yang senaraikan satu folder: nama yang tunjuk ke blob (fail) dan tree (folder)." }
  - id: sha-1
    world: 10
    en: { term: "SHA-1", meaning: "The recipe Git uses today to make a 40-character id from content." }
    ms: { term: "SHA-1", meaning: "Resipi yang Git guna sekarang untuk buat id 40 aksara daripada isi." }
  - id: sha-256
    world: 10
    en: { term: "SHA-256", meaning: "A stronger recipe for ids, 64 characters long. Git 3.0 plans it for new repos." }
    ms: { term: "SHA-256", meaning: "Resipi id yang lebih kuat, 64 aksara panjang. Git 3.0 merancang guna untuk repo baru." }
  - id: ref
    world: 10
    en: { term: "ref", meaning: "A name that points to a commit, like a branch or a tag." }
    ms: { term: "ref", meaning: "Nama yang tunjuk ke satu commit, contohnya branch atau tag." }
  - id: packed-refs
    world: 10
    en: { term: "packed-refs", meaning: "One file in .git that holds many refs together, instead of one small file each." }
    ms: { term: "packed-refs", meaning: "Satu fail dalam .git yang simpan banyak ref sekali gus, bukan satu fail kecil setiap satu." }
  - id: reftable
    world: 10
    en: { term: "reftable", meaning: "A newer, faster way to store refs in a few compact tables. Git 3.0 plans it for new repos." }
    ms: { term: "reftable", meaning: "Cara baru dan lebih laju untuk simpan ref dalam beberapa jadual padat. Git 3.0 merancang guna untuk repo baru." }
  - id: plumbing
    world: 10
    en: { term: "plumbing", meaning: "Git's low-level commands, like cat-file. Plain, steady output for scripts." }
    ms: { term: "plumbing", meaning: "Arahan Git peringkat rendah, contohnya cat-file. Output ringkas dan stabil untuk skrip." }
  - id: porcelain
    world: 10
    en: { term: "porcelain", meaning: "Git's friendly everyday commands, like status and commit." }
    ms: { term: "porcelain", meaning: "Arahan harian Git yang mesra, contohnya status dan commit." }
  - id: packfile
    world: 10
    en: { term: "packfile", meaning: "One file that holds many objects, squeezed together. Similar versions are saved as small differences." }
    ms: { term: "packfile", meaning: "Satu fail yang simpan banyak objek, dimampatkan bersama. Versi yang hampir sama disimpan sebagai beza kecil." }
  - id: garbage-collection
    world: 10
    en: { term: "garbage collection (gc)", meaning: "Git tidying up: packing objects and throwing away ones nothing can reach." }
    ms: { term: "kutipan sampah (gc)", meaning: "Git mengemas: padatkan objek dan buang objek yang tiada siapa boleh capai." }
  - id: revision
    world: 10
    en: { term: "revision", meaning: "Any way to name a commit: an id, a branch, HEAD~2, v1.0 and more." }
    ms: { term: "revision", meaning: "Apa-apa cara untuk namakan commit: id, branch, HEAD~2, v1.0 dan lain-lain." }
  - id: pickaxe
    world: 10
    en: { term: "pickaxe (log -S)", meaning: "A search for commits that added or removed some text." }
    ms: { term: "pickaxe (log -S)", meaning: "Carian untuk commit yang tambah atau buang sesuatu teks." }
  - id: blame
    world: 10
    en: { term: "blame", meaning: "Shows who last changed each line of a file, and in which commit." }
    ms: { term: "blame", meaning: "Tunjuk siapa ubah setiap baris fail kali terakhir, dan dalam commit mana." }
  - id: bisect
    world: 10
    en: { term: "bisect", meaning: "Finding the commit that broke something by testing the middle, again and again." }
    ms: { term: "bisect", meaning: "Cari commit yang merosakkan sesuatu dengan uji yang tengah, berulang kali." }
  - id: hook
    world: 10
    en: { term: "hook", meaning: "A script Git runs by itself at a set moment, like just before a commit." }
    ms: { term: "hook", meaning: "Skrip yang Git jalankan sendiri pada saat tertentu, contohnya sejurus sebelum commit." }
  - id: alias
    world: 10
    en: { term: "alias", meaning: "Your own short name for a Git command, like git st for git status." }
    ms: { term: "alias", meaning: "Nama pendek anda sendiri untuk arahan Git, contohnya git st untuk git status." }
  - id: include-if
    world: 10
    en: { term: "includeIf", meaning: "A config rule that loads extra settings only in some folders." }
    ms: { term: "includeIf", meaning: "Peraturan config yang muatkan tetapan tambahan dalam folder tertentu sahaja." }
  - id: line-ending
    world: 10
    en: { term: "line ending", meaning: "The invisible mark at the end of each line. Windows uses CRLF; macOS and Linux use LF." }
    ms: { term: "hujung baris (line ending)", meaning: "Tanda halimunan di hujung setiap baris. Windows guna CRLF; macOS dan Linux guna LF." }
  - id: gitattributes
    world: 10
    en: { term: ".gitattributes", meaning: "A file in your repo that tells Git how to treat some files, like line endings or binary files." }
    ms: { term: ".gitattributes", meaning: "Fail dalam repo yang beritahu Git cara layan fail tertentu, contohnya hujung baris atau fail binari." }
  - id: worktree
    world: 10
    en: { term: "worktree", meaning: "An extra working folder for the same repo, on its own branch." }
    ms: { term: "worktree", meaning: "Folder kerja tambahan untuk repo yang sama, di branch sendiri." }
  - id: submodule
    world: 10
    en: { term: "submodule", meaning: "Another repo inside your repo, linked at one exact commit." }
    ms: { term: "submodule", meaning: "Repo lain di dalam repo anda, dipaut pada satu commit yang tepat." }
  - id: subtree
    world: 10
    en: { term: "subtree", meaning: "Another repo's files copied into a folder of your repo, as normal files." }
    ms: { term: "subtree", meaning: "Fail repo lain yang disalin ke dalam satu folder repo anda, sebagai fail biasa." }
  - id: shallow-clone
    world: 10
    en: { term: "shallow clone", meaning: "A clone with only the newest commits, not the whole history." }
    ms: { term: "shallow clone", meaning: "Clone yang ada commit terbaru sahaja, bukan seluruh sejarah." }
  - id: partial-clone
    world: 10
    en: { term: "partial clone", meaning: "A clone with every commit, but file contents only when you need them." }
    ms: { term: "partial clone", meaning: "Clone dengan setiap commit, tapi isi fail hanya bila anda perlukannya." }
  - id: sparse-checkout
    world: 10
    en: { term: "sparse-checkout", meaning: "Shows only some folders of a repo in your working folder." }
    ms: { term: "sparse-checkout", meaning: "Papar sebahagian folder repo sahaja dalam folder kerja anda." }
  - id: git-lfs
    world: 10
    en: { term: "Git LFS", meaning: "An add-on that keeps big files outside normal Git history. Git stores a small pointer instead." }
    ms: { term: "Git LFS", meaning: "Tambahan yang simpan fail besar di luar sejarah Git biasa. Git simpan penunjuk kecil sebagai ganti." }
  - id: rerere
    world: 10
    en: { term: "rerere", meaning: "\"Reuse recorded resolution\": Git remembers how you fixed a conflict and does it again next time." }
    ms: { term: "rerere", meaning: "\"Reuse recorded resolution\": Git ingat cara anda baiki konflik dan buat semula lain kali." }
  - id: range-diff
    world: 10
    en: { term: "range-diff", meaning: "Compares two versions of a branch, commit by commit." }
    ms: { term: "range-diff", meaning: "Banding dua versi sesuatu branch, satu commit demi satu commit." }
  - id: bare-repository
    world: 10
    en: { term: "bare repository", meaning: "A repo with only the .git part and no working folder, like the copy on a server." }
    ms: { term: "repo bare (bare repository)", meaning: "Repo yang ada bahagian .git sahaja, tanpa folder kerja, macam salinan di pelayan." }

  # --- World 11 terms (add new World 11 terms below this line) ---

  # --- World 12 terms (add new World 12 terms below this line) ---
  - id: profile-readme
    world: 12
    en: { term: "profile README", meaning: "A README in a repo named exactly like your username. It shows on top of your GitHub profile." }
    ms: { term: "README profil (profile README)", meaning: "README dalam repo yang namanya sama tepat dengan nama pengguna anda. Ia keluar di atas profil GitHub anda." }
  - id: pinned-repo
