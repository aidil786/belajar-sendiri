# Terraform & OpenTofu glossary (Level Up, Part 2 "Pelan Arkitek"). Same shape as git.yaml. Drives <Term>
# tooltips in /<lang>/iac/... lessons and the page /<lang>/iac/glossary/.
# Every word hangs on the blueprint story (docs/LEVEL-UP-PLAN.md §1). `world` = the world id (T1 = 1 … T4 = 4).
# Ids are unique within this file. Words from other courses stay there: <Term id="pull-request" course="git">.
# Add words under your world's marker line, indented like this:
#   - id: provider
#     world: 1
#     en: { term: "provider", meaning: "…" }
#     ms: { term: "provider", meaning: "…" }
terms:
  # --- World T1 terms (add new T1 terms below this line) ---
  - id: infrastructure-as-code
    world: 1
    en: { term: "infrastructure as code (IaC)", meaning: "Writing your servers and settings down as text files, like a blueprint. A tool then builds exactly what the files say." }
    ms: { term: "infrastructure as code (IaC)", meaning: "Tulis server dan tetapan anda dalam fail teks, macam pelan arkitek. Satu alat kemudian bina tepat seperti yang fail itu kata." }
  - id: hcl
    world: 1
    en: { term: "HCL", meaning: "The language of .tf files. It is made of blocks: a type, labels, then settings inside { }." }
    ms: { term: "HCL", meaning: "Bahasa fail .tf. Ia dibina daripada blok: satu jenis, label, kemudian tetapan di dalam { }." }
  - id: block
    world: 1
    en: { term: "block", meaning: "One part of a blueprint. It starts with a type and labels, like resource \"local_file\" \"sign\", then its settings in { }." }
    ms: { term: "block (blok)", meaning: "Satu bahagian pelan. Ia bermula dengan jenis dan label, seperti resource \"local_file\" \"sign\", kemudian tetapannya dalam { }." }
  - id: resource
    world: 1
    en: { term: "resource", meaning: "One thing OpenTofu builds and looks after: a file, a name, a server. You draw it with a resource block." }
    ms: { term: "resource (sumber)", meaning: "Satu benda yang OpenTofu bina dan jaga: fail, nama, server. Anda lukis ia dengan blok resource." }
  - id: argument
    world: 1
    en: { term: "argument", meaning: "One setting inside a block: a name, an equals sign and a value, like length = 2." }
    ms: { term: "argument", meaning: "Satu tetapan dalam blok: nama, tanda sama dengan, dan nilai, seperti length = 2." }
  - id: reference
    world: 1
    en: { term: "reference", meaning: "Using a value from another block by its address: type, name, then the value, like random_pet.stall.id." }
    ms: { term: "reference (rujukan)", meaning: "Guna nilai dari blok lain melalui alamatnya: jenis, nama, kemudian nilai, seperti random_pet.stall.id." }
  - id: provider
    world: 1
    en: { term: "provider", meaning: "A plugin that knows how to build one family of things, like a supplier. random makes names; local makes files." }
    ms: { term: "provider (pembekal)", meaning: "Plugin yang tahu cara bina satu keluarga benda, macam pembekal. random buat nama; local buat fail." }
  - id: lock-file
    world: 1
    en: { term: "lock file", meaning: ".terraform.lock.hcl: the receipt tofu init writes. It records which provider versions it picked. Commit it to Git." }
    ms: { term: "lock file (fail kunci)", meaning: ".terraform.lock.hcl: resit yang tofu init tulis. Ia catat versi provider yang dipilih. Commit fail ini ke Git." }
  - id: plan
    world: 1
    en: { term: "plan", meaning: "The site inspector's report: what apply would create (+), change (~), destroy (-) or replace (-/+). A plan changes nothing." }
    ms: { term: "plan (rancangan)", meaning: "Laporan pemeriksa tapak: apa yang apply akan cipta (+), ubah (~), musnah (-) atau ganti (-/+). Plan tak ubah apa-apa." }
  - id: replace
    world: 1
    en: { term: "replace (-/+)", meaning: "Destroy the old thing, then build a new one. It happens when a setting can't change in place." }
    ms: { term: "replace (-/+)", meaning: "Musnahkan benda lama, kemudian bina yang baru. Ia berlaku bila sesuatu tetapan tak boleh diubah di tempatnya." }
  - id: apply
    world: 1
    en: { term: "apply", meaning: "Build from the blueprint. OpenTofu shows the plan, waits for yes, then makes the changes." }
    ms: { term: "apply", meaning: "Bina dari pelan. OpenTofu tunjuk plan, tunggu yes, kemudian buat perubahan itu." }
  - id: destroy
    world: 1
    en: { term: "destroy", meaning: "Tear down everything the blueprint built. OpenTofu lists what goes and waits for yes." }
    ms: { term: "destroy", meaning: "Robohkan semua yang pelan sudah bina. OpenTofu senaraikan apa yang hilang dan tunggu yes." }
  - id: state
    world: 1
    en: { term: "state", meaning: "The building's register: terraform.tfstate. It records what OpenTofu built, so the next plan can compare." }
    ms: { term: "state (daftar bangunan)", meaning: "Daftar bangunan: terraform.tfstate. Ia catat apa yang OpenTofu sudah bina, supaya plan seterusnya boleh banding." }
  - id: opentofu
    world: 1
    en: { term: "OpenTofu", meaning: "The open-source IaC tool these lessons use. Command: tofu. Licence: MPL 2.0. A Linux Foundation project." }
    ms: { term: "OpenTofu", meaning: "Alat IaC sumber terbuka yang pelajaran ini guna. Arahan: tofu. Lesen: MPL 2.0. Projek Linux Foundation." }
  - id: terraform
    world: 1
    en: { term: "Terraform", meaning: "The original IaC tool, from HashiCorp (now part of IBM). Command: terraform. Same language. Licence: BUSL." }
    ms: { term: "Terraform", meaning: "Alat IaC asal, dari HashiCorp (kini sebahagian IBM). Arahan: terraform. Bahasa yang sama. Lesen: BUSL." }
  # --- World T2 terms (add new T2 terms below this line) ---
  - id: input-variable
    world: 2
    en: { term: "variable", meaning: "A blank on the blueprint, filled in when you build: var.shop. One blueprint, many shops." }
    ms: { term: "variable (pemboleh ubah)", meaning: "Ruang kosong pada pelan, diisi semasa anda bina: var.shop. Satu pelan, banyak kedai." }
  - id: type-constraint
    world: 2
    en: { term: "type", meaning: "What kind of value a variable takes: string (text), number, bool (true or false), list, set, map or object." }
    ms: { term: "type (jenis)", meaning: "Jenis nilai yang variable terima: string (teks), number, bool (true atau false), list, set, map atau object." }
  - id: tfvars
    world: 2
    en: { term: ".tfvars file", meaning: "A file of variable values. terraform.tfvars and *.auto.tfvars load by themselves; others need -var-file." }
    ms: { term: "fail .tfvars", meaning: "Fail berisi nilai variable. terraform.tfvars dan *.auto.tfvars dibaca sendiri; yang lain perlu -var-file." }
  - id: output-value
    world: 2
    en: { term: "output", meaning: "A value the blueprint shares after apply, like a stall's name. tofu output prints it." }
    ms: { term: "output", meaning: "Nilai yang pelan kongsi selepas apply, seperti nama gerai. tofu output memaparkannya." }
  - id: local-value
    world: 2
    en: { term: "local value", meaning: "A name for a value you reuse inside one blueprint: local.hours. Change it once; every use follows." }
    ms: { term: "local value (nilai tempatan)", meaning: "Nama untuk nilai yang anda guna berulang dalam satu pelan: local.hours. Ubah sekali; semua yang guna ikut." }
  - id: count
    world: 2
    en: { term: "count", meaning: "Make N copies of one resource. They are numbered from 0: helper[0], helper[1], helper[2]." }
    ms: { term: "count", meaning: "Buat N salinan satu resource. Ia bernombor dari 0: helper[0], helper[1], helper[2]." }
  - id: for-each
    world: 2
    en: { term: "for_each", meaning: "Make one copy per item of a map or set, named by its key: stall[\"nasi\"]." }
    ms: { term: "for_each", meaning: "Buat satu salinan untuk setiap item dalam map atau set, dinamakan ikut kuncinya: stall[\"nasi\"]." }
  - id: data-source
    world: 2
    en: { term: "data source", meaning: "A data block that reads something that already exists. OpenTofu never changes or destroys it." }
    ms: { term: "data source (sumber data)", meaning: "Blok data yang membaca sesuatu yang sudah wujud. OpenTofu tak pernah ubah atau musnahkannya." }
  - id: expression
    world: 2
    en: { term: "expression", meaning: "Anything that works out a value: \"text\", var.shop, 2 + 3, or a function call." }
    ms: { term: "expression (ungkapan)", meaning: "Apa-apa yang menghasilkan nilai: \"teks\", var.shop, 2 + 3, atau panggilan fungsi." }
  - id: function
    world: 2
    en: { term: "function", meaning: "A built-in helper that turns values into new ones: upper(\"kancil\") gives \"KANCIL\"." }
    ms: { term: "function (fungsi)", meaning: "Pembantu terbina dalam yang tukar nilai jadi nilai baru: upper(\"kancil\") beri \"KANCIL\"." }
  - id: conditional
    world: 2
    en: { term: "conditional", meaning: "condition ? this : that. It picks one of two values, like var.open ? \"OPEN\" : \"CLOSED\"." }
    ms: { term: "conditional (bersyarat)", meaning: "syarat ? ini : itu. Ia pilih satu daripada dua nilai, seperti var.open ? \"OPEN\" : \"CLOSED\"." }
  # --- World T3 terms (add new T3 terms below this line) ---
  - id: backend
    world: 3
    en: { term: "backend", meaning: "Where the register (the state) lives. A shared one online lets a whole team read the same register." }
    ms: { term: "backend", meaning: "Tempat daftar (state) disimpan. Backend bersama dalam talian biar seluruh pasukan baca daftar yang sama." }
  - id: state-lock
    world: 3
    en: { term: "state lock", meaning: "A busy sign on the register. While one run writes, another run stops with a lock error." }
    ms: { term: "state lock", meaning: "Tanda sibuk pada daftar. Semasa satu larian menulis, larian lain berhenti dengan ralat kunci." }
  - id: drift
    world: 3
    en: { term: "drift", meaning: "The real building no longer matches the register, because someone changed it by hand." }
    ms: { term: "drift", meaning: "Bangunan sebenar tak lagi sepadan dengan daftar, sebab seseorang ubah dengan tangan." }
  - id: import-block
    world: 3
    en: { term: "import block", meaning: "Code that adopts something already built by hand, so OpenTofu manages it without building it again." }
    ms: { term: "blok import", meaning: "Kod yang ambil alih benda yang sudah dibina dengan tangan, supaya OpenTofu urus tanpa bina semula." }
  - id: moved-block
    world: 3
    en: { term: "moved block", meaning: "Code that says: same thing, new address. A rename then changes nothing real." }
    ms: { term: "blok moved", meaning: "Kod yang berkata: benda sama, alamat baharu. Tukar nama pun tak ubah benda sebenar." }
  - id: sensitive-value
    world: 3
    en: { term: "sensitive value", meaning: "A value hidden in plans and outputs. The state file still keeps it as plain text." }
    ms: { term: "nilai sensitif", meaning: "Nilai yang disorok dalam plan dan output. Fail state masih simpannya sebagai teks biasa." }
  - id: workspace
    world: 3
    en: { term: "workspace", meaning: "A second register for the same blueprint and backend. Good for short test copies." }
    ms: { term: "workspace", meaning: "Daftar kedua untuk pelan dan backend yang sama. Sesuai untuk salinan ujian sekejap." }
  # --- World T4 terms (add new T4 terms below this line) ---
  - id: module
    world: 4
    en: { term: "module", meaning: "A stall design you can reuse: a folder of .tf files. Variables go in, outputs come out." }
    ms: { term: "modul", meaning: "Reka bentuk gerai yang boleh diguna semula: satu folder fail .tf. Variable masuk, output keluar." }
  - id: version-pin
    world: 4
    en: { term: "version pin", meaning: "The versions of a module or provider you trust, like ~> 1.2. Nothing outside the range sneaks in." }
    ms: { term: "pin versi", meaning: "Versi modul atau provider yang anda percaya, seperti ~> 1.2. Versi di luar julat tak boleh menyelinap masuk." }
  - id: policy-check
    world: 4
    en: { term: "policy check", meaning: "A written rule a robot checks on every plan, like: nothing may destroy the database." }
    ms: { term: "semakan polisi", meaning: "Peraturan bertulis yang robot semak pada setiap plan, seperti: tiada apa boleh musnahkan pangkalan data." }
  - id: cost-check
    world: 4
    en: { term: "cost check", meaning: "A check that prices the changes in a plan and shows the monthly difference on the pull request." }
    ms: { term: "semakan kos", meaning: "Semakan yang letak harga pada perubahan dalam plan dan tunjuk beza bulanan dalam pull request." }
