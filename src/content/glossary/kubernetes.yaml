# Kubernetes glossary (Ship It, Part 3 "Medan Selera"). Same shape as git.yaml. Drives <Term> tooltips
# in /<lang>/kubernetes/... lessons and the page /<lang>/kubernetes/glossary/.
# Every word hangs on the food story (docs/SHIP-IT-PLAN.md §3). `world` = the world id (K1 = 1 … K8 = 8).
# Ids are unique within this file.
terms:
  # --- World K1 terms (add new K1 terms below this line) ---
  - id: cluster
    world: 1
    en: { term: "cluster", meaning: "The whole food court: a group of machines that Kubernetes runs as one." }
    ms: { term: "cluster (kluster)", meaning: "Sekumpulan mesin yang Kubernetes urus sebagai satu." }
  - id: node
    world: 1
    en: { term: "node", meaning: "One stall: one machine in the cluster." }
    ms: { term: "node", meaning: "Satu mesin dalam kluster." }
  - id: pod
    world: 1
    en: { term: "pod", meaning: "A tray of dishes that always go together: one or more containers." }
    ms: { term: "pod", meaning: "Unit paling kecil; satu atau lebih container yang sentiasa bersama." }
  - id: desired-state
    world: 1
    en: { term: "desired state", meaning: "What is written on the order board. Kubernetes keeps chasing it." }
    ms: { term: "desired state", meaning: "Keadaan yang anda mahu; Kubernetes sentiasa kejar keadaan ini." }
  - id: namespace
    world: 1
    en: { term: "namespace", meaning: "One zone of the food court: a separate space inside the cluster." }
    ms: { term: "namespace", meaning: "Ruang berasingan dalam kluster." }
  - id: context
    world: 1
    en: { term: "context", meaning: "The \"you are here\" sign: the cluster and namespace you are using now." }
    ms: { term: "context", meaning: "Kluster dan namespace yang anda sedang guna." }
  - id: orchestrator
    world: 1
    en: { term: "orchestrator", meaning: "A food court manager for containers: it places, watches and replaces them for you." }
    ms: { term: "orchestrator (pengurus container)", meaning: "Perisian yang letak, pantau dan ganti container untuk anda." }
  - id: overhead
    world: 1
    en: { term: "overhead", meaning: "The work and machines a tool needs just to keep running, before your app does anything." }
    ms: { term: "overhead (kos tambahan)", meaning: "Kerja dan mesin yang alat itu perlukan untuk terus hidup, sebelum aplikasi anda buat apa-apa." }
  - id: controller
    world: 1
    en: { term: "controller", meaning: "A manager who checks again and again: want 3, see 2, make 1 more." }
    ms: { term: "controller (pengawal)", meaning: "Pengurus yang periksa berulang kali: mahu 3, nampak 2, buat 1 lagi." }
  - id: reconciliation
    world: 1
    en: { term: "reconciliation", meaning: "The loop that keeps fixing what is real until it matches the order board." }
    ms: { term: "reconciliation (penyelarasan)", meaning: "Gelung yang terus membetulkan keadaan sebenar sehingga sama dengan papan pesanan." }
  - id: control-plane
    world: 1
    en: { term: "control plane", meaning: "The manager's office: the parts that decide what runs where." }
    ms: { term: "control plane (pejabat pengurus)", meaning: "Bahagian kluster yang putuskan apa jalan di mana." }
  - id: api-server
    world: 1
    en: { term: "API server", meaning: "The office's front counter. Every request, even from kubectl, goes through it." }
    ms: { term: "API server", meaning: "Kaunter depan pejabat. Setiap permintaan, termasuk dari kubectl, melaluinya." }
  - id: etcd
    world: 1
    en: { term: "etcd", meaning: "The order book: where the cluster keeps every object. Back it up." }
    ms: { term: "etcd", meaning: "Buku pesanan: tempat kluster simpan semua objek. Buat salinan sandarannya." }
  - id: scheduler
    world: 1
    en: { term: "scheduler", meaning: "Picks a stall (node) with room for each new tray (pod)." }
    ms: { term: "scheduler (penjadual)", meaning: "Pilih gerai (node) yang ada ruang untuk setiap dulang (pod) baharu." }
  - id: controller-manager
    world: 1
    en: { term: "controller manager", meaning: "One program that runs many controllers: the managers who walk the floor." }
    ms: { term: "controller manager", meaning: "Satu program yang jalankan banyak controller: pengurus yang meronda." }
  - id: kubelet
    world: 1
    en: { term: "kubelet", meaning: "The supervisor on every stall. It starts the trays the office sends there." }
    ms: { term: "kubelet", meaning: "Penyelia di setiap gerai. Ia hidupkan dulang yang pejabat hantar ke situ." }
  - id: kube-proxy
    world: 1
    en: { term: "kube-proxy", meaning: "Runs on every stall and sends order-number (Service) traffic to the right trays." }
    ms: { term: "kube-proxy", meaning: "Jalan di setiap gerai dan hantar trafik nombor pesanan (Service) ke dulang yang betul." }
  - id: containerd
    world: 1
    en: { term: "containerd", meaning: "The stove on each stall: the program that really runs the containers." }
    ms: { term: "containerd", meaning: "Dapur masak di setiap gerai: program yang betul-betul jalankan container." }
  - id: cri
    world: 1
    en: { term: "CRI (Container Runtime Interface)", meaning: "The standard plug between the kubelet and the stove (containerd)." }
    ms: { term: "CRI (Container Runtime Interface)", meaning: "Palam standard antara kubelet dan dapur masak (containerd)." }
  - id: kind
    world: 1
    en: { term: "kind", meaning: "Kubernetes IN Docker: a practice food court built from containers on your laptop." }
    ms: { term: "kind", meaning: "Kubernetes IN Docker: medan selera latihan yang dibina daripada container dalam laptop anda." }
  - id: kubectl
    world: 1
    en: { term: "kubectl", meaning: "Your walkie-talkie to the office: the command-line tool that talks to the API server." }
    ms: { term: "kubectl", meaning: "Walkie-talkie anda ke pejabat: alat baris arahan yang bercakap dengan API server." }
  - id: kubeconfig
    world: 1
    en: { term: "kubeconfig", meaning: "The file that lists your clusters and how to reach them (~/.kube/config)." }
    ms: { term: "kubeconfig", meaning: "Fail yang senaraikan kluster anda dan cara sampai ke sana (~/.kube/config)." }
  - id: manifest
    world: 1
    en: { term: "manifest", meaning: "An order slip written in YAML: what you want Kubernetes to make." }
    ms: { term: "manifest (slip pesanan)", meaning: "Pesanan yang ditulis dalam YAML: apa yang anda mahu Kubernetes buat." }
  - id: spec
    world: 1
    en: { term: "spec", meaning: "The part of a manifest you write: what you want." }
    ms: { term: "spec", meaning: "Bahagian manifest yang anda tulis: apa yang anda mahu." }
  - id: status
    world: 1
    en: { term: "status", meaning: "The part Kubernetes writes: what is really there now." }
    ms: { term: "status", meaning: "Bahagian yang Kubernetes tulis: apa yang benar-benar ada sekarang." }
  - id: label
    world: 1
    en: { term: "label", meaning: "A sticker on a tray: a key and a value, like app=shop." }
    ms: { term: "label (pelekat)", meaning: "Pelekat pada dulang: kunci dan nilai, contohnya app=shop." }
  - id: selector
    world: 1
    en: { term: "selector", meaning: "A rule that picks trays by their stickers, like app=shop." }
    ms: { term: "selector (pemilih)", meaning: "Peraturan yang pilih dulang ikut pelekatnya, contohnya app=shop." }
  - id: dry-run
    world: 1
    en: { term: "dry run", meaning: "A rehearsal: kubectl shows what it would do, and changes nothing." }
    ms: { term: "dry run (raptai)", meaning: "Raptai: kubectl tunjuk apa yang ia akan buat, tanpa ubah apa-apa." }
  # --- World K2 terms (add new K2 terms below this line) ---
  - id: deployment
    world: 2
    en: { term: "Deployment", meaning: "The manager's standing order, like \"always 3 trays\"." }
    ms: { term: "Deployment", meaning: "Arahan tetap, contohnya \"sentiasa ada 3 salinan\"." }
  - id: init-container
    world: 2
    en: { term: "init container", meaning: "The prep cook: runs before the app containers, finishes, then leaves." }
    ms: { term: "init container", meaning: "Tukang persediaan: jalan sebelum container aplikasi, siap, kemudian pergi." }
  - id: sidecar
    world: 2
    en: { term: "sidecar container", meaning: "A helper on the same tray all day, like a log shipper. An init container with restartPolicy: Always." }
    ms: { term: "sidecar container", meaning: "Pembantu atas dulang yang sama sepanjang hari, contohnya penghantar log. Init container dengan restartPolicy: Always." }
  - id: replicaset
    world: 2
    en: { term: "ReplicaSet", meaning: "The tray counter: keeps the right number of pods with matching labels." }
    ms: { term: "ReplicaSet", meaning: "Pengira dulang: kekalkan bilangan pod yang betul dengan label yang sepadan." }
  - id: revision
    world: 2
    en: { term: "revision", meaning: "A numbered version of a Deployment's pod template. rollout undo goes back to one." }
    ms: { term: "revision", meaning: "Versi bernombor templat pod sebuah Deployment. rollout undo kembali kepadanya." }
  - id: restart-count
    world: 2
    en: { term: "RESTARTS", meaning: "How many times the kubelet started a container again inside the same pod." }
    ms: { term: "RESTARTS", meaning: "Berapa kali kubelet mulakan semula container dalam pod yang sama." }
  - id: pod-pending
    world: 2
    en: { term: "Pending", meaning: "The tray has no stall yet (no room), or its images are still on the way." }
    ms: { term: "Pending", meaning: "Dulang belum dapat gerai (tiada ruang), atau image masih dalam perjalanan." }
  - id: crashloopbackoff
    world: 2
    en: { term: "CrashLoopBackOff", meaning: "The app keeps crashing; Kubernetes waits longer before each restart. Read the logs." }
    ms: { term: "CrashLoopBackOff", meaning: "Aplikasi asyik crash; Kubernetes tunggu lebih lama sebelum setiap restart. Baca log." }
  - id: imagepullbackoff
    world: 2
    en: { term: "ImagePullBackOff", meaning: "The stall cannot fetch the image, often a typo in the name or tag." }
    ms: { term: "ImagePullBackOff", meaning: "Gerai tak dapat ambil image, selalunya salah taip nama atau tag." }
  - id: oomkilled
    world: 2
    en: { term: "OOMKilled", meaning: "The container used more memory than its limit and was killed (exit code 137)." }
    ms: { term: "OOMKilled", meaning: "Container guna memori lebih daripada hadnya lalu dibunuh (kod keluar 137)." }
  - id: liveness-probe
    world: 2
    en: { term: "liveness probe", meaning: "\"Is the cook still awake?\" If it keeps failing, the kubelet restarts the container." }
    ms: { term: "liveness probe", meaning: "\"Tukang masak masih berjaga?\" Kalau asyik gagal, kubelet hidupkan semula container." }
  - id: readiness-probe
    world: 2
    en: { term: "readiness probe", meaning: "\"Ready to serve?\" If it fails, the pod gets no customers from its Service. No restart." }
    ms: { term: "readiness probe", meaning: "\"Sedia melayan?\" Kalau gagal, pod tak dapat pelanggan daripada Service. Tiada restart." }
  - id: startup-probe
    world: 2
    en: { term: "startup probe", meaning: "\"Still warming up?\" Gives a slow app time to start before the other probes begin." }
    ms: { term: "startup probe", meaning: "\"Masih memanaskan dapur?\" Beri aplikasi yang lambat masa untuk mula sebelum probe lain bermula." }
  - id: resource-request
    world: 2
    en: { term: "request (resources)", meaning: "The shelf space a container books. The scheduler only places a pod where it fits." }
    ms: { term: "request (sumber)", meaning: "Ruang rak yang container tempah. Scheduler hanya letak pod di tempat yang muat." }
  - id: resource-limit
    world: 2
    en: { term: "limit (resources)", meaning: "The most a container may use. Over the CPU limit: slowed. Over the memory limit: killed." }
    ms: { term: "limit (sumber)", meaning: "Paling banyak yang container boleh guna. Lebih had CPU: diperlahankan. Lebih had memori: dibunuh." }
  - id: qos-class
    world: 2
    en: { term: "QoS class", meaning: "Guaranteed, Burstable or BestEffort. When a stall runs short, BestEffort pods leave first." }
    ms: { term: "kelas QoS", meaning: "Guaranteed, Burstable atau BestEffort. Bila gerai kehabisan ruang, pod BestEffort keluar dulu." }
  - id: daemonset
    world: 2
    en: { term: "DaemonSet", meaning: "One tray on every stall, like a cleaner per stall. New stall, new tray." }
    ms: { term: "DaemonSet", meaning: "Satu dulang di setiap gerai, macam seorang pencuci setiap gerai. Gerai baharu, dulang baharu." }
  - id: statefulset
    world: 2
    en: { term: "StatefulSet", meaning: "Trays with names that stay (web-0, web-1), started in order. For databases and other stateful apps." }
    ms: { term: "StatefulSet", meaning: "Dulang dengan nama yang kekal (web-0, web-1), dimulakan ikut giliran. Untuk pangkalan data dan aplikasi berkeadaan." }
  - id: job
    world: 2
    en: { term: "Job", meaning: "A task that runs until it finishes, like counting the plates once." }
    ms: { term: "Job", meaning: "Tugas yang berjalan sehingga siap, macam kira pinggan sekali." }
  - id: cronjob
    world: 2
    en: { term: "CronJob", meaning: "Makes a Job on a schedule, like counting the plates every night." }
    ms: { term: "CronJob", meaning: "Buat Job ikut jadual, macam kira pinggan setiap malam." }
  # --- World K3 terms (add new K3 terms below this line) ---
  - id: service
    world: 3
    en: { term: "Service", meaning: "One order number, whichever stall cooks it: a fixed address for a group of pods." }
    ms: { term: "Service", meaning: "Alamat tetap untuk sekumpulan pod." }
  - id: gateway
    world: 3
    en: { term: "Gateway", meaning: "The main entrance and its signboards: the way in from the internet." }
    ms: { term: "Gateway", meaning: "Pintu masuk dari internet ke dalam kluster." }
  - id: pod-ip
    world: 3
    en: { term: "pod IP", meaning: "A tray's own table number: every pod gets an IP. A replaced pod gets a new one." }
    ms: { term: "IP pod", meaning: "Nombor meja setiap dulang: setiap pod dapat IP sendiri. Pod pengganti dapat IP baharu." }
  - id: clusterip
    world: 3
    en: { term: "ClusterIP", meaning: "The default Service type: one order number that works inside the cluster only." }
    ms: { term: "ClusterIP", meaning: "Jenis Service biasa: satu nombor pesanan yang berfungsi di dalam kluster sahaja." }
  - id: nodeport
    world: 3
    en: { term: "NodePort", meaning: "A side window on every stall: the same port (30000–32767) open on every node." }
    ms: { term: "NodePort", meaning: "Tingkap tepi di setiap gerai: port yang sama (30000–32767) dibuka pada setiap node." }
  - id: loadbalancer
    world: 3
    en: { term: "LoadBalancer", meaning: "A street sign from the cloud: one outside address for a Service." }
    ms: { term: "LoadBalancer", meaning: "Papan tanda jalan daripada cloud: satu alamat luar untuk sebuah Service." }
  - id: headless-service
    world: 3
    en: { term: "headless Service", meaning: "No single order number (clusterIP: None). Its name lists each pod's own IP." }
    ms: { term: "Service headless", meaning: "Tiada satu nombor pesanan (clusterIP: None). Namanya senaraikan IP setiap pod." }
  - id: endpointslice
    world: 3
    en: { term: "EndpointSlice", meaning: "The list behind an order number: which ready pods a Service sends to." }
    ms: { term: "EndpointSlice", meaning: "Senarai di belakang nombor pesanan: pod sedia mana yang Service hantar pesanan." }
  - id: cluster-dns
    world: 3
    en: { term: "cluster DNS", meaning: "The food court's directory: turns a Service name like menu.kitchen into its address." }
    ms: { term: "DNS kluster", meaning: "Direktori medan selera: tukar nama Service seperti menu.kitchen kepada alamatnya." }
  - id: port-forward
    world: 3
    en: { term: "port-forward", meaning: "A private staff hatch from your laptop to one pod, while the command runs." }
    ms: { term: "port-forward", meaning: "Tingkap staf peribadi dari laptop anda ke satu pod, selagi arahan itu berjalan." }
  - id: gatewayclass
    world: 3
    en: { term: "GatewayClass", meaning: "The door maker: which controller builds the Gateways." }
    ms: { term: "GatewayClass", meaning: "Pembuat pintu: controller mana yang bina Gateway." }
  - id: httproute
    world: 3
    en: { term: "HTTPRoute", meaning: "Signboards at the entrance: which path goes to which Service." }
    ms: { term: "HTTPRoute", meaning: "Papan tanda di pintu masuk: laluan mana pergi ke Service mana." }
  - id: ingress
    world: 3
    en: { term: "Ingress", meaning: "The older way in: one object for the door and its paths. Gateway API replaces it." }
    ms: { term: "Ingress", meaning: "Cara lama untuk masuk: satu objek untuk pintu dan laluannya. Gateway API menggantikannya." }
  - id: tls
    world: 3
    en: { term: "TLS", meaning: "A sealed tray cover: nobody can read or swap the order on the way. The S in HTTPS." }
    ms: { term: "TLS", meaning: "Penutup dulang bermeterai: tiada siapa boleh baca atau tukar pesanan di tengah jalan. S dalam HTTPS." }
  - id: cert-manager
    world: 3
    en: { term: "cert-manager", meaning: "A helper in the cluster that gets TLS certificates and renews them before they expire." }
    ms: { term: "cert-manager", meaning: "Pembantu dalam kluster yang dapatkan sijil TLS dan perbaharuinya sebelum tamat tempoh." }
  - id: networkpolicy
    world: 3
    en: { term: "NetworkPolicy", meaning: "A guest list on a pod's door: which pods may come in, chosen by label." }
    ms: { term: "NetworkPolicy", meaning: "Senarai tetamu di pintu pod: pod mana boleh masuk, dipilih ikut label." }
  - id: cni
    world: 3
    en: { term: "CNI plugin", meaning: "The food court's walkways: the network plugin that gives pods IPs and enforces NetworkPolicies." }
    ms: { term: "plugin CNI", meaning: "Laluan pejalan kaki medan selera: plugin rangkaian yang beri IP kepada pod dan kuatkuasakan NetworkPolicy." }
  # --- World K4 terms (add new K4 terms below this line) ---
  - id: configmap
    world: 4
    en: { term: "ConfigMap", meaning: "A note on the stall wall: settings the app reads, kept outside the image." }
    ms: { term: "ConfigMap", meaning: "Nota tetapan yang aplikasi baca, disimpan di luar image." }
  - id: secret
    world: 4
    en: { term: "Secret", meaning: "The locked spice box for passwords and tokens. Its base64 hides nothing, so limit who can read it." }
    ms: { term: "Secret", meaning: "Kotak rempah berkunci untuk kata laluan dan token. Base64 tak sorok apa-apa, jadi hadkan siapa boleh baca." }
  - id: base64
    world: 4
    en: { term: "base64", meaning: "A way to write any bytes as plain letters. Anyone can turn it back, so it is not a lock." }
    ms: { term: "base64", meaning: "Cara tulis apa-apa data sebagai huruf biasa. Sesiapa boleh tukar balik, jadi ia bukan kunci." }
  - id: encryption-at-rest
    world: 4
    en: { term: "encryption at rest", meaning: "The API server locks Secrets before it saves them in etcd." }
    ms: { term: "encryption at rest", meaning: "API server kunci Secret sebelum simpan dalam etcd." }
  - id: sealed-secret
    world: 4
    en: { term: "Sealed Secret", meaning: "A Secret locked with the cluster's public key, safe to keep in Git. Only the controller in the cluster can open it." }
    ms: { term: "Sealed Secret", meaning: "Secret yang dikunci dengan kunci awam kluster, selamat disimpan dalam Git. Hanya controller dalam kluster boleh buka." }
  - id: external-secrets
    world: 4
    en: { term: "External Secrets Operator", meaning: "Copies secrets from an outside vault into Kubernetes Secrets, and keeps them fresh." }
    ms: { term: "External Secrets Operator", meaning: "Salin rahsia dari peti besi luar ke dalam Secret Kubernetes, dan sentiasa kemas kini." }
  - id: emptydir
    world: 4
    en: { term: "emptyDir", meaning: "A scratch table on the tray: its containers share it, and it is wiped when the pod goes." }
    ms: { term: "emptyDir", meaning: "Meja sementara atas dulang: container di dalamnya berkongsi, dan ia dikosongkan bila pod hilang." }
  - id: persistent-volume
    world: 4
    en: { term: "PersistentVolume (PV)", meaning: "The real locker in the store room: storage that outlives pods." }
    ms: { term: "PersistentVolume (PV)", meaning: "Loker sebenar di stor: storan yang kekal walaupun pod hilang." }
  - id: pvc
    world: 4
    en: { term: "PersistentVolumeClaim (PVC)", meaning: "A locker request slip, like \"I need 1Gi\". Kubernetes finds or makes a PV for it." }
    ms: { term: "PersistentVolumeClaim (PVC)", meaning: "Slip minta loker, contohnya \"saya perlu 1Gi\". Kubernetes cari atau buat PV untuknya." }
  - id: storageclass
    world: 4
    en: { term: "StorageClass", meaning: "The locker maker: it builds a new PV when a claim asks for one." }
    ms: { term: "StorageClass", meaning: "Pembuat loker: ia bina PV baharu bila ada claim yang minta." }
  - id: dynamic-provisioning
    world: 4
    en: { term: "dynamic provisioning", meaning: "Lockers built on demand: a claim arrives, and the StorageClass makes its PV." }
    ms: { term: "dynamic provisioning", meaning: "Loker dibina bila perlu: claim sampai, StorageClass buat PV untuknya." }
  - id: access-mode
    world: 4
    en: { term: "access mode", meaning: "Who may use a locker at once: one node (RWO), many nodes (RWX), many readers (ROX) or one pod (RWOP)." }
    ms: { term: "access mode (mod akses)", meaning: "Siapa boleh guna loker serentak: satu node (RWO), banyak node (RWX), banyak pembaca (ROX) atau satu pod (RWOP)." }
  - id: volumeclaimtemplate
    world: 4
    en: { term: "volumeClaimTemplates", meaning: "A StatefulSet's locker form: each pod gets its own claim, like data-ledger-0." }
    ms: { term: "volumeClaimTemplates", meaning: "Borang loker StatefulSet: setiap pod dapat claim sendiri, contohnya data-ledger-0." }
  - id: kustomize
    world: 4
    en: { term: "Kustomize", meaning: "One base recipe plus a sticky note per kitchen. Built into kubectl (kubectl apply -k)." }
    ms: { term: "Kustomize", meaning: "Satu resepi asas dan satu nota lekat untuk setiap dapur. Terbina dalam kubectl (kubectl apply -k)." }
  - id: overlay
    world: 4
    en: { term: "overlay", meaning: "The sticky note for one kitchen: it changes the base for dev, staging or prod." }
    ms: { term: "overlay", meaning: "Nota lekat untuk satu dapur: ia ubah base untuk dev, staging atau prod." }
  - id: helm
    world: 4
    en: { term: "Helm", meaning: "Kubernetes' package manager: it fills chart templates with values and keeps a history of releases." }
    ms: { term: "Helm", meaning: "Pengurus pakej Kubernetes: ia isi templat chart dengan nilai dan simpan sejarah release." }
  - id: chart
    world: 4
    en: { term: "chart", meaning: "A meal kit: templates plus default values, ready to install." }
    ms: { term: "chart", meaning: "Set hidangan siap: templat dan nilai lalai, sedia dipasang." }
  - id: helm-release
    world: 4
    en: { term: "release", meaning: "One installed copy of a chart, with numbered revisions you can roll back to." }
    ms: { term: "release", meaning: "Satu salinan chart yang dipasang, dengan revision bernombor untuk rollback." }
  - id: helm-values
    world: 4
    en: { term: "values", meaning: "The order form for a chart, like replicaCount or the image tag. values.yaml holds the defaults." }
    ms: { term: "values (nilai)", meaning: "Borang pesanan untuk chart, contohnya replicaCount atau tag image. values.yaml simpan nilai lalai." }
  - id: api-deprecation
    world: 4
    en: { term: "API deprecation", meaning: "An old form the office will stop taking. Move to the new apiVersion before it goes." }
    ms: { term: "API deprecation (API lapuk)", meaning: "Borang lama yang pejabat akan berhenti terima. Tukar ke apiVersion baharu sebelum ia dibuang." }
  - id: kyaml
    world: 4
    en: { term: "KYAML", meaning: "Strict YAML from kubectl: every string in quotes, braces around maps. Any YAML reader still reads it." }
    ms: { term: "KYAML", meaning: "YAML yang ketat daripada kubectl: setiap teks dalam petikan, kurungan kerinting untuk map. Ia masih YAML biasa." }
  # --- World K5 terms (add new K5 terms below this line) ---
  - id: metrics-server
    world: 5
    en: { term: "metrics-server", meaning: "The meter reader: it checks how much CPU and memory each tray uses right now. kubectl top and the HPA read it." }
    ms: { term: "metrics-server", meaning: "Pembaca meter: semak berapa CPU dan memori setiap pod guna sekarang. kubectl top dan HPA baca daripadanya." }
  - id: hpa
    world: 5
    en: { term: "HorizontalPodAutoscaler (HPA)", meaning: "A helper manager who adds trays when they get busy and removes them when it is quiet." }
    ms: { term: "HorizontalPodAutoscaler (HPA)", meaning: "Pembantu pengurus yang tambah pod bila sibuk dan kurangkan bila lengang." }
  - id: vpa
    world: 5
    en: { term: "VerticalPodAutoscaler (VPA)", meaning: "Gives a tray a bigger or smaller plate: it changes requests from real use. An add-on." }
    ms: { term: "VerticalPodAutoscaler (VPA)", meaning: "Beri pod pinggan lebih besar atau kecil: ubah requests ikut guna sebenar. Satu add-on." }
  - id: node-autoscaler
    world: 5
    en: { term: "node autoscaler", meaning: "Opens a new stall when trays have nowhere to sit, and closes empty ones. Cluster Autoscaler and Karpenter are two." }
    ms: { term: "node autoscaler", meaning: "Buka gerai baharu bila pod tiada tempat, dan tutup gerai kosong. Contohnya Cluster Autoscaler dan Karpenter." }
  - id: node-selector
    world: 5
    en: { term: "nodeSelector", meaning: "A sign on the tray: \"only stalls with this label\"." }
    ms: { term: "nodeSelector", meaning: "Papan tanda pada pod: \"hanya node dengan label ini\"." }
  - id: node-affinity
    world: 5
    en: { term: "node affinity", meaning: "A wish list for stalls: must-have rules and nice-to-have rules." }
    ms: { term: "node affinity", meaning: "Senarai hajat untuk node: syarat wajib dan syarat pilihan." }
  - id: taint
    world: 5
    en: { term: "taint", meaning: "A lock on a stall. Trays without the key stay away." }
    ms: { term: "taint", meaning: "Kunci pada node. Pod tanpa anak kunci tak boleh masuk." }
  - id: toleration
    world: 5
    en: { term: "toleration", meaning: "A key on a tray. It opens a stall's lock, but does not pull the tray there." }
    ms: { term: "toleration", meaning: "Anak kunci pada pod. Ia buka kunci node, tapi tak tarik pod ke sana." }
  - id: topology-spread
    world: 5
    en: { term: "topology spread", meaning: "Spread trays across stalls, so one closing stall hurts less." }
    ms: { term: "topology spread", meaning: "Sebar pod ke banyak node, supaya satu node tutup tak beri kesan besar." }
  - id: pdb
    world: 5
    en: { term: "PodDisruptionBudget (PDB)", meaning: "A rule like \"at least 2 trays stay up\" during planned work, such as a drain." }
    ms: { term: "PodDisruptionBudget (PDB)", meaning: "Peraturan seperti \"sekurang-kurangnya 2 pod kekal hidup\" semasa kerja terancang, contohnya drain." }
  - id: resource-quota
    world: 5
    en: { term: "ResourceQuota", meaning: "A zone's budget: the most CPU, memory or trays one namespace may ask for." }
    ms: { term: "ResourceQuota", meaning: "Bajet satu zon: had CPU, memori atau pod yang satu namespace boleh minta." }
  - id: limit-range
    world: 5
    en: { term: "LimitRange", meaning: "The zone's default plate size: requests and limits for containers that set none." }
    ms: { term: "LimitRange", meaning: "Saiz pinggan lalai zon: requests dan limits untuk container yang tak tetapkan sendiri." }
  - id: logs
    world: 5
    en: { term: "logs", meaning: "The cook's notebook: everything a container prints." }
    ms: { term: "log", meaning: "Buku nota tukang masak: semua yang container cetak." }
  - id: event
    world: 5
    en: { term: "event", meaning: "A note on the manager's notice board: scheduled, pulled, started, or a warning. Kept for a short time." }
    ms: { term: "event", meaning: "Nota pada papan notis pengurus: dijadualkan, ditarik, dimulakan, atau amaran. Disimpan sekejap sahaja." }
  - id: prometheus
    world: 5
    en: { term: "Prometheus", meaning: "A clerk who visits every stall on a timer and writes the numbers down, with the time." }
    ms: { term: "Prometheus", meaning: "Kerani yang lawat setiap gerai ikut jadual dan catat nombor, bersama masanya." }
  - id: grafana
    world: 5
    en: { term: "Grafana", meaning: "The big screen on the wall: charts and dashboards from your numbers." }
    ms: { term: "Grafana", meaning: "Skrin besar di dinding: carta dan papan pemuka daripada nombor anda." }
  - id: opentelemetry
    world: 5
    en: { term: "OpenTelemetry (OTel)", meaning: "One shared way to collect metrics, logs and traces, so you can switch tools later." }
    ms: { term: "OpenTelemetry (OTel)", meaning: "Satu cara bersama untuk kumpul metrik, log dan trace, supaya anda boleh tukar alat kemudian." }
  - id: trace
    world: 5
    en: { term: "trace", meaning: "One order's whole journey, step by step, with how long each step took." }
    ms: { term: "trace", meaning: "Perjalanan penuh satu pesanan, langkah demi langkah, dengan masa setiap langkah." }
  - id: debug-ladder
    world: 5
    en: { term: "debug ladder", meaning: "Climb one rung at a time: get, describe, logs, events, exec, debug." }
    ms: { term: "tangga nyahpepijat", meaning: "Naik satu anak tangga setiap kali: get, describe, logs, events, exec, debug." }
  - id: version-skew
    world: 5
    en: { term: "version skew", meaning: "How far apart the versions of a cluster's parts may be, and still work together." }
    ms: { term: "version skew", meaning: "Sejauh mana versi bahagian kluster boleh berbeza, dan masih berfungsi bersama." }
  - id: managed-kubernetes
    world: 5
    en: { term: "managed Kubernetes", meaning: "A rented food court: the landlord runs the office (control plane). EKS, GKE, AKS and DOKS are examples." }
    ms: { term: "Kubernetes terurus", meaning: "Medan selera sewa: tuan punya urus pejabat (control plane). Contohnya EKS, GKE, AKS dan DOKS." }
  # --- World K6 terms (add new K6 terms below this line) ---
  - id: authentication
    world: 6
    en: { term: "authentication", meaning: "Gate 1, the ID check: \"Who are you?\" A certificate or token proves it." }
    ms: { term: "authentication", meaning: "Pintu 1, semakan ID: \"Siapa anda?\" Sijil atau token membuktikannya." }
  - id: authorization
    world: 6
    en: { term: "authorization", meaning: "Gate 2, the job card check: \"May you do this?\" In Kubernetes, RBAC decides." }
    ms: { term: "authorization", meaning: "Pintu 2, semakan kad tugas: \"Bolehkah anda buat ini?\" Dalam Kubernetes, RBAC yang putuskan." }
  - id: admission-control
    world: 6
    en: { term: "admission control", meaning: "Gate 3, the hygiene check: is this tray safe? It checks the object before it is saved." }
    ms: { term: "admission control", meaning: "Pintu 3, semakan kebersihan: selamatkah dulang ini? Ia semak objek sebelum disimpan." }
  - id: rbac
    world: 6
    en: { term: "RBAC", meaning: "Role-based access control: job cards (Roles) pinned to staff badges (bindings). It only adds rights." }
    ms: { term: "RBAC", meaning: "Kawalan akses ikut peranan: kad tugas (Role) dipin pada lencana staf (binding). Ia hanya menambah hak." }
  - id: serviceaccount
    world: 6
    en: { term: "ServiceAccount", meaning: "A staff badge for a robot: the identity a pod or a CI bot uses with the API." }
    ms: { term: "ServiceAccount", meaning: "Lencana staf untuk robot: identiti yang pod atau bot CI guna dengan API." }
  - id: role
    world: 6
    en: { term: "Role", meaning: "A job card: which verbs on which things, in one zone. A ClusterRole works in every zone." }
    ms: { term: "Role", meaning: "Kad tugas: kata kerja apa pada benda apa, dalam satu zon. ClusterRole berfungsi di semua zon." }
  - id: rolebinding
    world: 6
    en: { term: "RoleBinding", meaning: "Pins a job card to a person or bot, in one zone. A ClusterRoleBinding pins it everywhere." }
    ms: { term: "RoleBinding", meaning: "Pin kad tugas pada orang atau bot, dalam satu zon. ClusterRoleBinding pin di semua tempat." }
  - id: pod-security-standards
    world: 6
    en: { term: "Pod Security Standards", meaning: "Three hygiene levels for trays: privileged, baseline and restricted. A namespace label switches one on." }
    ms: { term: "Pod Security Standards", meaning: "Tiga tahap kebersihan dulang: privileged, baseline dan restricted. Label namespace menghidupkannya." }
  - id: security-context
    world: 6
    en: { term: "securityContext", meaning: "The locks on a lunchbox: no root, no extra powers, a seccomp filter, read-only files." }
    ms: { term: "securityContext", meaning: "Kunci pada bekas: bukan root, tiada kuasa tambahan, penapis seccomp, fail baca sahaja." }
  - id: capabilities
    world: 6
    en: { term: "capabilities", meaning: "Small slices of root's power, like changing the network. Drop them ALL unless you need one." }
    ms: { term: "capabilities", meaning: "Cebisan kecil kuasa root, contohnya ubah rangkaian. Buang SEMUA kecuali yang perlu." }
  - id: seccomp
    world: 6
    en: { term: "seccomp", meaning: "A filter on the requests a container makes to the Linux kernel. RuntimeDefault blocks the risky ones." }
    ms: { term: "seccomp", meaning: "Penapis permintaan container kepada kernel Linux. RuntimeDefault sekat yang berisiko." }
  - id: validating-admission-policy
    world: 6
    en: { term: "ValidatingAdmissionPolicy", meaning: "A house rule checked at gate 3, written in CEL. Built into Kubernetes, nothing to install." }
    ms: { term: "ValidatingAdmissionPolicy", meaning: "Peraturan rumah yang disemak di pintu 3, ditulis dalam CEL. Terbina dalam Kubernetes." }
  - id: policy-engine
    world: 6
    en: { term: "policy engine", meaning: "An add-on rule keeper at gate 3, like Kyverno or Gatekeeper." }
    ms: { term: "enjin polisi", meaning: "Penjaga peraturan tambahan di pintu 3, contohnya Kyverno atau Gatekeeper." }
  - id: audit-log
    world: 6
    en: { term: "audit log", meaning: "The guard's logbook: who asked the API server for what, and when." }
    ms: { term: "log audit", meaning: "Buku log pengawal: siapa minta apa daripada API server, dan bila." }
  - id: image-signature
    world: 6
    en: { term: "image signature", meaning: "A tamper-proof seal on a pack: it proves who built the image and that nobody changed it." }
    ms: { term: "tandatangan image", meaning: "Meterai kalis usik pada pek: bukti siapa bina image dan tiada siapa ubahnya." }
  - id: user-namespace
    world: 6
    en: { term: "user namespace", meaning: "Boss inside the stall, nobody outside: root in the pod is a plain user on the node." }
    ms: { term: "user namespace", meaning: "Bos dalam gerai, orang biasa di luar: root dalam pod ialah pengguna biasa pada node." }
  # --- World K7 terms (add new K7 terms below this line) ---
  - id: gitops
    world: 7
    en: { term: "GitOps", meaning: "The order board is a Git repo. The cluster follows what Git says." }
    ms: { term: "GitOps", meaning: "Git jadi sumber kebenaran; kluster ikut apa yang ada dalam Git." }
  - id: argo-cd
    world: 7
    en: { term: "Argo CD", meaning: "A GitOps helper with a web dashboard. It reads the order board in Git and keeps the cluster the same." }
    ms: { term: "Argo CD", meaning: "Pembantu GitOps dengan papan pemuka web. Ia baca papan pesanan dalam Git dan pastikan kluster sama." }
  - id: flux
    world: 7
    en: { term: "Flux", meaning: "A GitOps helper made of small controllers. It pulls from Git and keeps the cluster the same." }
    ms: { term: "Flux", meaning: "Pembantu GitOps yang terdiri daripada controller kecil. Ia tarik dari Git dan pastikan kluster sama." }
  - id: sync
    world: 7
    en: { term: "sync", meaning: "Copy the order board onto the floor: make the cluster match what Git says." }
    ms: { term: "sync (selaraskan)", meaning: "Jadikan kluster sama seperti yang tertulis dalam Git." }
  - id: drift
    world: 7
    en: { term: "drift", meaning: "The floor no longer matches the order board: the cluster differs from Git, often after a change by hand." }
    ms: { term: "drift (hanyut)", meaning: "Kluster tak lagi sama dengan Git, selalunya selepas perubahan secara manual." }
  - id: self-heal
    world: 7
    en: { term: "self-heal", meaning: "Argo CD puts Git's version back by itself when someone changes the cluster by hand." }
    ms: { term: "self-heal (pulih sendiri)", meaning: "Argo CD kembalikan versi Git dengan sendiri bila seseorang ubah kluster secara manual." }
  - id: image-automation
    world: 7
    en: { term: "image automation", meaning: "A robot that spots a new image tag in the shop freezer and commits it to Git for you." }
    ms: { term: "image automation (automasi image)", meaning: "Robot yang nampak tag image baharu dalam registry dan commit ke Git untuk anda." }
  - id: progressive-delivery
    world: 7
    en: { term: "progressive delivery", meaning: "Serve the new dish to a few tables first, check the numbers, then to everyone. Bad numbers roll it back." }
    ms: { term: "progressive delivery (penghantaran berperingkat)", meaning: "Hantar versi baharu kepada sedikit pengguna dulu, semak angka, kemudian kepada semua. Angka buruk akan rollback." }
  - id: crd
    world: 7
    en: { term: "CRD (CustomResourceDefinition)", meaning: "Teaches the cluster a new kind of object, like adding a dish to the menu." }
    ms: { term: "CRD (CustomResourceDefinition)", meaning: "Ajar kluster satu jenis objek baharu, macam tambah hidangan dalam menu." }
  - id: operator
    world: 7
    en: { term: "operator", meaning: "A new kind plus its own manager: a controller that runs one app, like Postgres, for you." }
    ms: { term: "operator", meaning: "Jenis objek baharu bersama pengurusnya sendiri: controller yang jalankan satu aplikasi, seperti Postgres, untuk anda." }
  - id: golden-path
    world: 7
    en: { term: "golden path", meaning: "The ready, paved road to build and ship an app at your company." }
    ms: { term: "golden path (laluan emas)", meaning: "Jalan siap dan rata untuk bina dan hantar aplikasi dalam syarikat anda." }
  - id: backstage
    world: 7
    en: { term: "Backstage", meaning: "An open-source developer portal: one place for every app, its owner, its docs and its templates." }
    ms: { term: "Backstage", meaning: "Portal developer sumber terbuka: satu tempat untuk setiap aplikasi, pemiliknya, dokumennya dan templatnya." }
  # --- World K8 terms (add new K8 terms below this line) ---
  - id: devops-engineer
    world: 8
    en: { term: "DevOps engineer", meaning: "Builds the conveyor belt, so every change gets tested and shipped by itself." }
    ms: { term: "jurutera DevOps", meaning: "Bina tali sawat automatik supaya setiap perubahan diuji dan dihantar sendiri." }
  - id: sre
    world: 8
    en: { term: "SRE (site reliability engineer)", meaning: "Keeps the live service healthy: watches alerts, takes turns on call, then fixes the cause." }
    ms: { term: "SRE (jurutera kebolehpercayaan laman)", meaning: "Jaga servis yang sedang hidup: pantau amaran, bergilir on-call, kemudian baiki puncanya." }
  - id: platform-engineer
    world: 8
    en: { term: "platform engineer", meaning: "Builds a self-service counter, so other teams get a ready kitchen in minutes." }
    ms: { term: "jurutera platform", meaning: "Bina kaunter layan diri supaya pasukan lain dapat dapur siap dalam beberapa minit." }
  - id: cloud-engineer
    world: 8
    en: { term: "cloud engineer", meaning: "Sets up the building: servers, networks and access on a cloud provider." }
    ms: { term: "jurutera cloud", meaning: "Sediakan bangunan: server, rangkaian dan akses di penyedia cloud." }
  - id: portfolio
    world: 8
    en: { term: "portfolio", meaning: "A few finished projects that prove what you can do." }
    ms: { term: "portfolio", meaning: "Beberapa projek siap yang buktikan apa yang anda boleh buat." }
  - id: architecture-diagram
    world: 8
    en: { term: "architecture diagram", meaning: "A map of your app's parts. Arrows show who talks to whom." }
    ms: { term: "rajah seni bina", meaning: "Peta bahagian aplikasi anda. Anak panah tunjuk siapa bercakap dengan siapa." }
  - id: demo-video
    world: 8
    en: { term: "demo video", meaning: "A short screen recording that shows your project working." }
    ms: { term: "video demo", meaning: "Rakaman skrin pendek yang tunjuk projek anda berfungsi." }
  - id: must-have
    world: 8
    en: { term: "must-have", meaning: "A skill a job post truly needs. Nice-to-haves are only bonus points." }
    ms: { term: "must-have (wajib ada)", meaning: "Kemahiran yang benar-benar diperlukan dalam iklan kerja. Nice-to-have cuma markah bonus." }
  - id: star-method
    world: 8
    en: { term: "STAR method", meaning: "Tell a work story in four parts: Situation, Task, Action, Result." }
    ms: { term: "kaedah STAR", meaning: "Cerita pengalaman kerja dalam empat bahagian: Situation, Task, Action, Result." }
  - id: kcna
    world: 8
    en: { term: "KCNA", meaning: "Kubernetes and Cloud Native Associate: a multiple-choice exam on the big ideas." }
    ms: { term: "KCNA", meaning: "Peperiksaan aneka pilihan tentang idea besar Kubernetes dan cloud native." }
  - id: ckad
    world: 8
    en: { term: "CKAD", meaning: "Certified Kubernetes Application Developer: hands-on tasks to build and run apps in a live cluster." }
    ms: { term: "CKAD", meaning: "Peperiksaan praktikal: bina dan jalankan aplikasi dalam kluster sebenar." }
  - id: cka
    world: 8
    en: { term: "CKA", meaning: "Certified Kubernetes Administrator: hands-on tasks to run the cluster itself." }
    ms: { term: "CKA", meaning: "Peperiksaan praktikal tentang cara mengurus kluster itu sendiri." }
  - id: cks
    world: 8
    en: { term: "CKS", meaning: "Certified Kubernetes Security Specialist: a hands-on security exam. Pass the CKA first." }
    ms: { term: "CKS", meaning: "Peperiksaan praktikal tentang keselamatan kluster. Lulus CKA dahulu." }
  - id: cloud-native
    world: 8
    en: { term: "cloud native", meaning: "Apps built from small, replaceable parts that run on platforms like Kubernetes." }
    ms: { term: "cloud native", meaning: "Aplikasi yang dibina daripada bahagian kecil yang mudah diganti, untuk platform seperti Kubernetes." }
  - id: cla
    world: 8
    en: { term: "CLA (contributor license agreement)", meaning: "A form you sign once, so a project may use your contributions." }
    ms: { term: "CLA (perjanjian lesen penyumbang)", meaning: "Borang yang anda tandatangan sekali supaya projek boleh guna sumbangan anda." }
  - id: kubecon
    world: 8
    en: { term: "KubeCon", meaning: "The big cloud-native conference. Its talk videos go online for free afterwards." }
    ms: { term: "KubeCon", meaning: "Persidangan besar cloud native. Video ceramahnya boleh ditonton percuma selepas itu." }
  - id: homelab
    world: 8
    en: { term: "homelab", meaning: "Your own practice kitchen at home: a spare machine for clusters you can break." }
    ms: { term: "homelab (makmal di rumah)", meaning: "Dapur latihan anda sendiri: mesin lebihan untuk kluster yang boleh dirosakkan." }
  # --- World K9 terms (Level Up CKA pack; add new K9 terms below this line) ---
  # K9 part 1 (lessons l01–l06: the back room of a stall)
  - id: node-shell
    world: 9
    en: { term: "node shell", meaning: "A terminal inside one stall's back room: you type commands on the node itself (ssh, or docker exec on kind)." }
    ms: { term: "node shell", meaning: "Terminal di bilik belakang satu gerai: anda taip arahan pada node itu sendiri (ssh, atau docker exec dalam kind)." }
  - id: kubeadm
    world: 9
    en: { term: "kubeadm", meaning: "The builder of a food court: it sets up the manager's office on the first machine and lets new stalls join." }
    ms: { term: "kubeadm", meaning: "Pembina medan selera: ia sediakan pejabat pengurus pada mesin pertama dan benarkan gerai baharu menyertai." }
  - id: bootstrap-token
    world: 9
    en: { term: "join token (bootstrap token)", meaning: "A short-lived ticket a new stall shows to join the food court. It lasts 24 hours by default." }
    ms: { term: "join token (token bootstrap)", meaning: "Tiket jangka pendek yang gerai baharu tunjuk untuk menyertai medan selera. Tempoh asalnya 24 jam." }
  - id: admin-conf
    world: 9
    en: { term: "admin.conf", meaning: "The master key kubeadm leaves on the control-plane node: a kubeconfig with full admin rights." }
    ms: { term: "admin.conf", meaning: "Kunci induk yang kubeadm tinggalkan pada node control plane: kubeconfig dengan hak pentadbir penuh." }
  - id: static-pod
    world: 9
    en: { term: "static pod", meaning: "A tray the stall's supervisor starts by itself, from a file in /etc/kubernetes/manifests, without asking the office." }
    ms: { term: "static pod", meaning: "Dulang yang penyelia gerai hidupkan sendiri, daripada fail dalam /etc/kubernetes/manifests, tanpa tanya pejabat." }
  - id: mirror-pod
    world: 9
    en: { term: "mirror pod", meaning: "The office's read-only photo of a static pod. Deleting the photo does not stop the real pod." }
    ms: { term: "mirror pod", meaning: "Gambar baca-sahaja sebuah static pod di pejabat. Padam gambar itu tidak hentikan pod sebenar." }
  - id: systemd
    world: 9
    en: { term: "systemd", meaning: "The building's power room: it starts services like the kubelet at boot and restarts them if they crash." }
    ms: { term: "systemd", meaning: "Bilik kuasa bangunan: ia hidupkan servis seperti kubelet semasa but dan mulakan semula jika ia ranap." }
  - id: journal
    world: 9
    en: { term: "journal", meaning: "The supervisor's diary: log lines systemd keeps for each service. Read it with journalctl." }
    ms: { term: "journal (diari)", meaning: "Diari penyelia: baris log yang systemd simpan untuk setiap servis. Baca dengan journalctl." }
  - id: crictl
    world: 9
    en: { term: "crictl", meaning: "A torch to look straight at the stove: it lists the pods and containers containerd runs on one node." }
    ms: { term: "crictl", meaning: "Lampu suluh untuk lihat dapur secara terus: ia senaraikan pod dan container yang containerd jalankan pada satu node." }
  - id: node-conditions
    world: 9
    en: { term: "node conditions", meaning: "A stall's health notes: Ready, MemoryPressure and more. Unknown means its kubelet stopped reporting." }
    ms: { term: "node conditions (keadaan node)", meaning: "Nota kesihatan gerai: Ready, MemoryPressure dan lain-lain. Unknown bermaksud kubelet berhenti melapor." }
  # K9 part 2 (lessons l07–l12 and the boss; add new part 2 terms below this line)
  - id: cordon
    world: 9
    en: { term: "cordon", meaning: "The “no new orders” sign on a stall: new trays go elsewhere, old ones stay." }
    ms: { term: "cordon", meaning: "Papan “tiada pesanan baharu” pada gerai: dulang baharu ke tempat lain, yang lama kekal." }
  - id: drain
    world: 9
    en: { term: "drain", meaning: "Cordon a stall, then move its trays to other stalls, ready for repairs." }
    ms: { term: "drain (kosongkan gerai)", meaning: "Cordon satu gerai, kemudian pindah dulangnya ke gerai lain, sedia untuk dibaiki." }
  - id: kubeadm-upgrade
    world: 9
    en: { term: "kubeadm upgrade", meaning: "Renovating the building: the office first, then one stall at a time, one minor version per step." }
    ms: { term: "kubeadm upgrade", meaning: "Ubah suai bangunan: pejabat dulu, kemudian satu gerai demi satu, satu versi minor setiap langkah." }
  - id: etcd-snapshot
    world: 9
    en: { term: "etcd snapshot", meaning: "A photocopy of the order book (etcd) at one moment. Keep it off the cluster, somewhere safe." }
    ms: { term: "etcd snapshot (salinan buku pesanan)", meaning: "Fotokopi buku pesanan (etcd) pada satu saat. Simpan di luar kluster, di tempat selamat." }
  - id: etcdutl
    world: 9
    en: { term: "etcdutl", meaning: "The tool for etcd's files: it checks and restores a snapshot. etcdctl talks to a running etcd." }
