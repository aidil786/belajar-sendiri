# Linux & Networking glossary (Level Up, Part 1 "Rumah Kedai"). Same shape as git.yaml. Drives <Term>
# tooltips in /<lang>/linux/... lessons and the page /<lang>/linux/glossary/.
# Every word hangs on the shophouse story (docs/LEVEL-UP-PLAN.md §1). `world` = the world id (L1 = 1 … L4 = 4).
# Ids are unique within this file. Words from other courses stay there: <Term id="container" course="docker">.
# Add words under your world's marker line, indented like this:
#   - id: shell
#     world: 1
#     en: { term: "shell", meaning: "…" }
#     ms: { term: "shell", meaning: "…" }
terms:
  # --- World L1 terms (add new L1 terms below this line) ---
  - id: terminal
    world: 1
    en: { term: "terminal", meaning: "A text window into the server. You type commands; the server types back." }
    ms: { term: "terminal", meaning: "Tingkap teks ke dalam server. Anda taip arahan; server balas dengan teks." }
  - id: shell
    world: 1
    en: { term: "shell", meaning: "The counter helper who reads what you type and runs it. On Debian it is bash." }
    ms: { term: "shell", meaning: "Pembantu kaunter yang baca taipan anda dan jalankannya. Di Debian, ia bash." }
  - id: prompt
    world: 1
    en: { term: "prompt", meaning: "The text before your cursor, like you@kedai:~$. It says who you are, where, and that it is ready." }
    ms: { term: "prompt", meaning: "Teks sebelum kursor, seperti you@kedai:~$. Ia tunjuk siapa anda, di mana, dan ia sudah sedia." }
  - id: path
    world: 1
    en: { term: "path", meaning: "A room's address, like /home/you/kedai/menu. A path that starts with / begins at the front door." }
    ms: { term: "path (laluan)", meaning: "Alamat sesuatu bilik, seperti /home/you/kedai/menu. Path yang bermula dengan / mula dari pintu depan." }
  - id: home-folder
    world: 1
    en: { term: "home folder (~)", meaning: "Your own room on the server, /home/you. The ~ sign is its short name." }
    ms: { term: "folder rumah (~)", meaning: "Bilik anda sendiri di server, /home/you. Tanda ~ ialah nama pendeknya." }
  - id: root-folder
    world: 1
    en: { term: "root folder (/)", meaning: "The front door of the whole shophouse. Every path starts from here." }
    ms: { term: "folder root (/)", meaning: "Pintu depan seluruh rumah kedai. Setiap path bermula dari sini." }
  - id: hidden-file
    world: 1
    en: { term: "hidden file", meaning: "A name that starts with a dot, like .keys. ls skips it; ls -a shows it." }
    ms: { term: "fail tersembunyi", meaning: "Nama yang bermula dengan titik, seperti .keys. ls langkau; ls -a tunjuk." }
  - id: pipe
    world: 1
    en: { term: "pipe (|)", meaning: "A conveyor belt between two commands: the first one's output becomes the next one's input." }
    ms: { term: "pipe (|)", meaning: "Tali sawat antara dua arahan: keluaran arahan pertama jadi masukan arahan seterusnya." }
  - id: redirect
    world: 1
    en: { term: "redirect (> >>)", meaning: "Sends a command's output into a file. > replaces the file; >> adds to its end." }
    ms: { term: "redirect (> >>)", meaning: "Hantar keluaran arahan ke dalam fail. > ganti fail itu; >> tambah di hujungnya." }
  - id: wildcard
    world: 1
    en: { term: "wildcard (* ?)", meaning: "A pattern the shell swaps for matching names: * is any letters, ? is one letter." }
    ms: { term: "wildcard (* ?)", meaning: "Corak yang shell tukar kepada nama yang padan: * apa saja huruf, ? satu huruf." }
  - id: tab-completion
    world: 1
    en: { term: "tab completion", meaning: "Press Tab and the shell finishes a command or file name for you." }
    ms: { term: "tab completion", meaning: "Tekan Tab dan shell habiskan nama arahan atau fail untuk anda." }
  - id: exit-code
    world: 1
    en: { term: "exit code", meaning: "The number a command leaves behind: 0 means fine, anything else means a problem or no match. echo $? shows it." }
    ms: { term: "kod keluar", meaning: "Nombor yang arahan tinggalkan: 0 maksudnya okey, nombor lain maksudnya masalah atau tiada padanan. echo $? tunjuk." }
  # --- World L2 terms (add new L2 terms below this line) ---
  - id: user
    world: 2
    en: { term: "user", meaning: "One member of staff on the server, with a name, a number and their own keys." }
    ms: { term: "user (pengguna)", meaning: "Seorang pekerja di server, dengan nama, nombor dan kunci sendiri." }
  - id: group
    world: 2
    en: { term: "group", meaning: "A team of users. Keys can be given to a whole team at once." }
    ms: { term: "group (kumpulan)", meaning: "Satu pasukan pengguna. Kunci boleh diberi kepada seluruh pasukan sekali gus." }
  - id: root-user
    world: 2
    en: { term: "root", meaning: "The shop owner: the user with every key. One slip as root can break the whole server." }
    ms: { term: "root", meaning: "Tuan kedai: pengguna yang pegang semua kunci. Satu silap sebagai root boleh rosakkan seluruh server." }
  - id: sudo
    world: 2
    en: { term: "sudo", meaning: "Borrow the master key for one command, if your team is allowed. The server writes it down." }
    ms: { term: "sudo", meaning: "Pinjam kunci induk untuk satu arahan, jika pasukan anda dibenarkan. Server mencatatnya." }
  - id: permissions
    world: 2
    en: { term: "permissions (rwx)", meaning: "The keys on a file: r read, w write, x run, for the owner, the group and everyone else." }
    ms: { term: "permissions (kebenaran rwx)", meaning: "Kunci pada fail: r baca, w tulis, x jalan, untuk pemilik, kumpulan dan orang lain." }
  - id: owner
    world: 2
    en: { term: "owner", meaning: "The user a file belongs to. ls -l shows it; sudo chown changes it." }
    ms: { term: "owner (pemilik)", meaning: "Pengguna yang memiliki sesuatu fail. ls -l tunjuk; sudo chown mengubahnya." }
  - id: process
    world: 2
    en: { term: "process", meaning: "A program at work right now, like a cook on shift. Each one has a number, its PID." }
    ms: { term: "process (proses)", meaning: "Program yang sedang bekerja, macam tukang masak yang bertugas. Setiap satu ada nombor, iaitu PID." }
  - id: pid
    world: 2
    en: { term: "PID", meaning: "A process's staff number. ps and pgrep show it; kill uses it." }
    ms: { term: "PID", meaning: "Nombor pekerja sesuatu proses. ps dan pgrep tunjuk; kill gunakannya." }
  - id: signal
    world: 2
    en: { term: "signal", meaning: "A message to a process: TERM asks it to stop, KILL (9) stops it at once, Ctrl+C sends INT." }
    ms: { term: "signal (isyarat)", meaning: "Mesej kepada proses: TERM minta ia berhenti, KILL (9) hentikan serta-merta, Ctrl+C hantar INT." }
  - id: job
    world: 2
    en: { term: "job", meaning: "A program this shell started and is still watching: in front, paused, or in the background (&)." }
    ms: { term: "job", meaning: "Program yang shell ini mulakan dan masih perhati: di depan, dijeda, atau di belakang (&)." }
  - id: environment-variable
    world: 2
    en: { term: "environment variable", meaning: "A note on the wall every program you start can read, like HOME or PATH." }
    ms: { term: "environment variable (pemboleh ubah persekitaran)", meaning: "Nota di dinding yang setiap program anda mulakan boleh baca, seperti HOME atau PATH." }
  - id: path-variable
    world: 2
    en: { term: "PATH", meaning: "The list of folders the shell searches, in order, when you type a command name." }
    ms: { term: "PATH", meaning: "Senarai folder yang shell cari, ikut urutan, bila anda taip nama arahan." }
  - id: service
    world: 2
    en: { term: "service", meaning: "A program that runs in the background all day, like the web server. systemd starts and watches it." }
    ms: { term: "service (servis)", meaning: "Program yang berjalan di belakang sepanjang hari, seperti web server. systemd mulakan dan mengawasinya." }
  - id: systemd
    world: 2
    en: { term: "systemd", meaning: "The shift manager: it starts services at boot, restarts them, and keeps their logs." }
    ms: { term: "systemd", meaning: "Pengurus syif: ia mulakan servis semasa but, mulakan semula, dan simpan log mereka." }
  - id: journal
    world: 2
    en: { term: "journal", meaning: "systemd's diary of what every service said and did. journalctl reads it." }
    ms: { term: "journal (jurnal)", meaning: "Diari systemd tentang apa setiap servis kata dan buat. journalctl membacanya." }
  - id: package
    world: 2
    en: { term: "package", meaning: "A ready-to-install program in one box, from the Debian store. apt fetches and installs it." }
    ms: { term: "package (pakej)", meaning: "Program sedia pasang dalam satu kotak, dari stor Debian. apt ambil dan memasangnya." }
  # --- World L3 terms (add new L3 terms below this line) ---
  - id: ip-address
    world: 3
    en: { term: "IP address", meaning: "A computer's phone number: four numbers from 0 to 255 with dots, like 10.0.0.5." }
    ms: { term: "IP address (alamat IP)", meaning: "Nombor telefon sesebuah komputer: empat nombor 0 hingga 255 dengan titik, contohnya 10.0.0.5." }
  - id: loopback
    world: 3
    en: { term: "loopback (localhost)", meaning: "The shop's intercom: 127.0.0.1 always calls the machine you are on." }
    ms: { term: "loopback (localhost)", meaning: "Interkom kedai: 127.0.0.1 sentiasa hubungi mesin yang anda sedang guna." }
  - id: private-address
    world: 3
    en: { term: "private address", meaning: "A number that only works inside one building: 10.x, 172.16-31.x or 192.168.x." }
    ms: { term: "private address (alamat persendirian)", meaning: "Nombor yang hanya berfungsi dalam satu bangunan: 10.x, 172.16-31.x atau 192.168.x." }
  - id: subnet
    world: 3
    en: { term: "subnet", meaning: "One street of addresses. Machines on the same street call each other directly." }
    ms: { term: "subnet", meaning: "Satu jalan alamat. Mesin di jalan yang sama hubungi satu sama lain terus." }
  - id: cidr
    world: 3
    en: { term: "CIDR (/24)", meaning: "The slash number says how much of the address names the street. /24: the first three numbers." }
    ms: { term: "CIDR (/24)", meaning: "Nombor selepas garis condong tunjuk berapa banyak alamat yang namakan jalan. /24: tiga nombor pertama." }
  - id: gateway
    world: 3
    en: { term: "gateway", meaning: "The telephone exchange at the end of the street. Calls to other streets go through it." }
    ms: { term: "gateway (get laluan)", meaning: "Ibu sawat telefon di hujung jalan. Panggilan ke jalan lain melaluinya." }
  - id: port
    world: 3
    en: { term: "port", meaning: "An extension number on the shop's phone line. Web is 80, HTTPS 443, SSH 22." }
    ms: { term: "port", meaning: "Nombor sambungan pada talian telefon kedai. Web 80, HTTPS 443, SSH 22." }
  - id: listening
    world: 3
    en: { term: "listening", meaning: "A program waiting by an extension, ready to answer. ss -tln lists them." }
    ms: { term: "listening (mendengar)", meaning: "Program yang menunggu di satu sambungan, sedia menjawab. ss -tln menyenaraikannya." }
  - id: dns
    world: 3
    en: { term: "DNS", meaning: "The phone book of the internet: it turns a name like kedai.example into a number." }
    ms: { term: "DNS", meaning: "Buku telefon internet: ia tukar nama seperti kedai.example kepada nombor." }
  - id: hosts-file
    world: 3
    en: { term: "/etc/hosts", meaning: "The shop's own short list of names and numbers. It is checked before DNS." }
    ms: { term: "/etc/hosts", meaning: "Senarai pendek nama dan nombor milik kedai sendiri. Ia disemak sebelum DNS." }
  - id: http
    world: 3
    en: { term: "HTTP", meaning: "How orders are spoken at a web counter: a method and a path, then a status code and the food." }
    ms: { term: "HTTP", meaning: "Cara pesanan disebut di kaunter web: kaedah dan laluan, kemudian kod status dan makanannya." }
  - id: status-code
    world: 3
    en: { term: "status code", meaning: "The counter's three-digit reply: 200 OK, 404 not found, 403 forbidden, 503 kitchen trouble." }
    ms: { term: "status code (kod status)", meaning: "Jawapan tiga digit kaunter: 200 OK, 404 tiada, 403 dilarang, 503 dapur bermasalah." }
  - id: https
    world: 3
    en: { term: "HTTPS", meaning: "HTTP in a sealed envelope. The shop also shows an ID card: its certificate." }
    ms: { term: "HTTPS", meaning: "HTTP dalam sampul bermeterai. Kedai juga tunjuk kad pengenalan: sijilnya." }
  - id: certificate
    world: 3
    en: { term: "certificate", meaning: "A server's ID card: its names, who signed it and when it expires." }
    ms: { term: "certificate (sijil)", meaning: "Kad pengenalan server: nama-namanya, siapa yang tandatangan dan bila ia luput." }
  - id: certificate-authority
    world: 3
    en: { term: "certificate authority (CA)", meaning: "A trusted office that signs ID cards. Your computer comes with a list of them." }
    ms: { term: "certificate authority (CA)", meaning: "Pejabat dipercayai yang tandatangan kad pengenalan. Komputer anda datang dengan senarainya." }
  - id: firewall
    world: 3
    en: { term: "firewall", meaning: "The guard at the door. A list says which callers may come in, on which extension." }
    ms: { term: "firewall (tembok api)", meaning: "Pengawal di pintu. Satu senarai tentukan pemanggil mana boleh masuk, di sambungan mana." }
  - id: ping
    world: 3
    en: { term: "ping", meaning: "Hello, can you hear me? It sends a tiny message and times the echo." }
    ms: { term: "ping", meaning: "Helo, dengar tak? Ia hantar mesej kecil dan ukur masa gemanya." }
  - id: traceroute
    world: 3
    en: { term: "traceroute", meaning: "Lists every telephone exchange (hop) a call passes on its way." }
    ms: { term: "traceroute", meaning: "Senaraikan setiap ibu sawat (hop) yang dilalui panggilan dalam perjalanan." }
  # --- World L4 terms (add new L4 terms below this line) ---
  - id: ssh
    world: 4
    en: { term: "SSH", meaning: "A sealed phone line to a far-away kitchen. You type there as if you stood inside." }
    ms: { term: "SSH", meaning: "Talian bermeterai ke dapur yang jauh. Anda menaip di sana seolah-olah berdiri di dalamnya." }
  - id: key-pair
    world: 4
    en: { term: "key pair", meaning: "A padlock and its only key, made together. ssh-keygen makes them." }
    ms: { term: "key pair (pasangan kunci)", meaning: "Mangga dan satu-satunya kuncinya, dibuat bersama. ssh-keygen membuatnya." }
  - id: public-key
    world: 4
    en: { term: "public key", meaning: "The padlock (the .pub file). Safe to give away and hang on any door." }
    ms: { term: "public key (kunci awam)", meaning: "Mangganya (fail .pub). Selamat diberi dan digantung di mana-mana pintu." }
  - id: private-key
    world: 4
    en: { term: "private key", meaning: "The only key that opens your padlocks. Never share it. Mode 600." }
    ms: { term: "private key (kunci persendirian)", meaning: "Satu-satunya kunci yang buka mangga anda. Jangan sesekali kongsi. Mod 600." }
  - id: authorized-keys
    world: 4
    en: { term: "authorized_keys", meaning: "The server's list of padlocks allowed on its door: ~/.ssh/authorized_keys." }
    ms: { term: "authorized_keys", meaning: "Senarai mangga yang dibenarkan di pintu server: ~/.ssh/authorized_keys." }
  - id: host-key
    world: 4
    en: { term: "host key", meaning: "The server's own ID card. Your laptop remembers it in ~/.ssh/known_hosts." }
    ms: { term: "host key (kunci hos)", meaning: "Kad pengenalan server itu sendiri. Laptop anda ingat ia dalam ~/.ssh/known_hosts." }
  - id: ssh-config
    world: 4
    en: { term: "~/.ssh/config", meaning: "Your speed dial: a short name like kedai stands for the address, user and key." }
    ms: { term: "~/.ssh/config", meaning: "Dail laju anda: nama pendek seperti kedai mewakili alamat, pengguna dan kunci." }
  - id: rsync
    world: 4
    en: { term: "rsync", meaning: "A smart courier. It compares both sides and carries only what changed." }
    ms: { term: "rsync", meaning: "Kurier pintar. Ia bandingkan kedua-dua belah dan bawa apa yang berubah sahaja." }
  - id: disk-usage
    world: 4
    en: { term: "disk usage", meaning: "How full the storeroom is. df shows whole disks; du shows which folders are fat." }
    ms: { term: "disk usage (penggunaan cakera)", meaning: "Berapa penuh stor. df tunjuk seluruh cakera; du tunjuk folder mana yang gemuk." }
  - id: cron
    world: 4
    en: { term: "cron", meaning: "The shop's roster on the wall. It checks every minute and runs jobs on time." }
    ms: { term: "cron", meaning: "Jadual tugas di dinding kedai. Ia semak setiap minit dan jalankan kerja tepat pada masanya." }
  - id: systemd-timer
    world: 4
    en: { term: "systemd timer", meaning: "systemd's own alarm clock. It starts a service on a schedule and logs to the journal." }
    ms: { term: "systemd timer (pemasa systemd)", meaning: "Jam loceng systemd sendiri. Ia mulakan servis ikut jadual dan catat dalam journal." }
  - id: script
    world: 4
    en: { term: "script", meaning: "A written checklist for the shell. It runs the lines one by one." }
    ms: { term: "script (skrip)", meaning: "Senarai semak bertulis untuk shell. Ia jalankan baris satu demi satu." }
  - id: variable
    world: 4
    en: { term: "variable", meaning: "A labelled jar: name=Aina fills it, $name reads it. No spaces around =." }
    ms: { term: "variable (pemboleh ubah)", meaning: "Balang berlabel: name=Aina mengisinya, $name membacanya. Tiada ruang di sekeliling =." }
  - id: loop
    world: 4
    en: { term: "loop", meaning: "Do the same steps for each item: for dish in a b c; do ...; done." }
    ms: { term: "loop (gelung)", meaning: "Buat langkah yang sama untuk setiap item: for dish in a b c; do ...; done." }
  - id: strict-mode
    world: 4
    en: { term: "strict mode", meaning: "set -euo pipefail: a strict supervisor that stops the script at the first problem." }
    ms: { term: "strict mode (mod ketat)", meaning: "set -euo pipefail: penyelia tegas yang hentikan skrip pada masalah pertama." }
  - id: web-server
    world: 4
    en: { term: "web server", meaning: "The front counter that hands out pages. nginx is a popular one." }
    ms: { term: "web server (pelayan web)", meaning: "Kaunter depan yang beri halaman. nginx ialah salah satu yang popular." }
