# Monitoring & Observability glossary (Level Up, Part 3 "Bilik Kawalan"). Same shape as git.yaml. Drives
# <Term> tooltips in /<lang>/observability/... lessons and the page /<lang>/observability/glossary/.
# Every word hangs on the control room story (docs/LEVEL-UP-PLAN.md §1). `world` = the world id (O1 = 1 … O4 = 4).
# Ids are unique within this file. Words from other courses stay there: <Term id="pod" course="kubernetes">.
# Add words under your world's marker line, indented like this:
#   - id: metric
#     world: 1
#     en: { term: "metric", meaning: "…" }
#     ms: { term: "metrik", meaning: "…" }
terms:
  # --- World O1 terms (add new O1 terms below this line) ---
  - id: monitoring
    world: 1
    en: { term: "monitoring", meaning: "Watching known numbers on the control room screens, with an alarm when one goes bad." }
    ms: { term: "pemantauan (monitoring)", meaning: "Pantau nombor yang dah dikenal pada skrin bilik kawalan, dengan penggera bila satu jadi teruk." }
  - id: observability
    world: 1
    en: { term: "observability", meaning: "How well you can ask new questions about a system from the outside, using what it tells you." }
    ms: { term: "observability (kebolehcerapan)", meaning: "Sejauh mana anda boleh tanya soalan baru tentang sistem dari luar, guna apa yang ia beritahu." }
  - id: metric
    world: 1
    en: { term: "metric", meaning: "A number measured again and again over time, like orders per minute." }
    ms: { term: "metrik", meaning: "Nombor yang diukur berulang kali dari masa ke masa, contohnya pesanan seminit." }
  - id: log
    world: 1
    en: { term: "log", meaning: "A diary line from the app: what happened, when, with details." }
    ms: { term: "log", meaning: "Satu baris diari daripada aplikasi: apa yang berlaku, bila, dengan butiran." }
  - id: trace
    world: 1
    en: { term: "trace", meaning: "One order followed through every service, with the time each step took." }
    ms: { term: "trace (jejak)", meaning: "Satu pesanan dijejak melalui setiap servis, dengan masa setiap langkah." }
  - id: golden-signals
    world: 1
    en: { term: "four golden signals", meaning: "Latency, traffic, errors and saturation: the four screens to hang first." }
    ms: { term: "empat isyarat emas", meaning: "Latency, traffic, errors dan saturation: empat skrin yang patut dipasang dulu." }
  - id: latency
    world: 1
    en: { term: "latency", meaning: "How long one request takes, from asking to answer." }
    ms: { term: "latency (kependaman)", meaning: "Berapa lama satu permintaan ambil, dari tanya hingga dapat jawapan." }
  - id: saturation
    world: 1
    en: { term: "saturation", meaning: "How full the system is: a growing queue, a busy stove, a nearly full disk." }
    ms: { term: "saturation (ketepuan)", meaning: "Sejauh mana sistem dah penuh: barisan makin panjang, dapur sibuk, cakera hampir penuh." }
  - id: red-method
    world: 1
    en: { term: "RED", meaning: "Rate, Errors, Duration: three questions for every service." }
    ms: { term: "RED", meaning: "Rate, Errors, Duration: tiga soalan untuk setiap servis." }
  - id: use-method
    world: 1
    en: { term: "USE", meaning: "Utilization, Saturation, Errors: three questions for every machine part, like CPU or disk." }
    ms: { term: "USE", meaning: "Utilization, Saturation, Errors: tiga soalan untuk setiap bahagian mesin, seperti CPU atau cakera." }
  - id: sli
    world: 1
    en: { term: "SLI (service level indicator)", meaning: "A number that shows how users feel the service, like the share of good checkouts." }
    ms: { term: "SLI (penunjuk tahap servis)", meaning: "Nombor yang tunjuk apa pengguna rasa tentang servis, contohnya peratus bayaran yang berjaya." }
  - id: slo
    world: 1
    en: { term: "SLO (service level objective)", meaning: "The target for an SLI over a time window, like 99.9% good checkouts in 30 days." }
    ms: { term: "SLO (objektif tahap servis)", meaning: "Sasaran untuk SLI dalam satu tempoh, contohnya 99.9% bayaran berjaya dalam 30 hari." }
  - id: error-budget
    world: 1
    en: { term: "error budget", meaning: "The bad you may spend: 100% minus the SLO. Spend it on change, not on surprises." }
    ms: { term: "bajet ralat (error budget)", meaning: "Ruang silap yang boleh anda guna: 100% tolak SLO. Guna untuk perubahan, bukan kejutan." }
  - id: dashboard
    world: 1
    en: { term: "dashboard", meaning: "A wall of graphs you look at when you choose. It never wakes anyone up." }
    ms: { term: "dashboard (papan pemuka)", meaning: "Dinding graf yang anda tengok bila anda mahu. Ia tak pernah kejutkan sesiapa." }
  - id: alert
    world: 1
    en: { term: "alert", meaning: "A message that calls a person because something needs action now." }
    ms: { term: "amaran (alert)", meaning: "Mesej yang panggil seseorang kerana sesuatu perlu tindakan sekarang." }
  - id: on-call
    world: 1
    en: { term: "on call", meaning: "Your turn to answer alerts, for a set time, with a plan and a backup person." }
    ms: { term: "on-call", meaning: "Giliran anda jawab amaran, untuk satu tempoh, dengan pelan dan orang sandaran." }
  - id: prometheus
    world: 1
    en: { term: "Prometheus", meaning: "The control room's clerk: it collects numbers on a timer, keeps them, and answers PromQL questions." }
    ms: { term: "Prometheus", meaning: "Kerani bilik kawalan: ia kutip nombor ikut jadual, simpan, dan jawab soalan PromQL." }
  - id: grafana
    world: 1
    en: { term: "Grafana", meaning: "The big screens: it draws dashboards from data kept elsewhere, like Prometheus." }
    ms: { term: "Grafana", meaning: "Skrin besar: ia lukis dashboard daripada data yang disimpan di tempat lain, seperti Prometheus." }
  - id: opentelemetry
    world: 1
    en: { term: "OpenTelemetry (OTel)", meaning: "One shared way to make and send metrics, logs and traces. Not a database." }
    ms: { term: "OpenTelemetry (OTel)", meaning: "Satu cara bersama untuk hasilkan dan hantar metrik, log dan trace. Bukan pangkalan data." }
  # --- World O2 terms (add new O2 terms below this line) ---
  - id: scrape
    world: 2
    en: { term: "scrape", meaning: "Prometheus visits a target on a timer and copies its numbers from /metrics." }
    ms: { term: "scrape (kutip)", meaning: "Prometheus lawat target ikut jadual dan salin nombornya dari /metrics." }
  - id: target
    world: 2
    en: { term: "target", meaning: "One address Prometheus scrapes, like node-exporter:9100. Its job and instance become labels." }
    ms: { term: "target", meaning: "Satu alamat yang Prometheus scrape, seperti node-exporter:9100. Job dan instance-nya jadi label." }
  - id: exporter
    world: 2
    en: { term: "exporter", meaning: "A translator: it reads numbers from something (a machine, a database) and shows them at /metrics." }
    ms: { term: "exporter", meaning: "Penterjemah: ia baca nombor daripada sesuatu (mesin, pangkalan data) dan tunjuk di /metrics." }
  - id: counter
    world: 2
    en: { term: "counter", meaning: "A number that only goes up, like orders served. It drops to 0 only when the app restarts." }
    ms: { term: "counter (pembilang)", meaning: "Nombor yang hanya naik, seperti pesanan siap. Ia jatuh ke 0 hanya bila aplikasi mula semula." }
  - id: gauge
    world: 2
    en: { term: "gauge", meaning: "A number that goes up and down, like customers waiting or free memory." }
    ms: { term: "gauge (meter)", meaning: "Nombor yang naik dan turun, seperti pelanggan menunggu atau memori kosong." }
  - id: histogram
    world: 2
    en: { term: "histogram", meaning: "Counts requests into time buckets (le = less or equal), plus a _sum and a _count." }
    ms: { term: "histogram", meaning: "Kira permintaan ke dalam baldi masa (le = kurang atau sama), serta _sum dan _count." }
  - id: summary
    world: 2
    en: { term: "summary", meaning: "Quantiles worked out inside the app. You cannot add them up across servers." }
    ms: { term: "summary", meaning: "Kuantil yang dikira dalam aplikasi. Anda tak boleh jumlahkan merentas server." }
  - id: label
    world: 2
    en: { term: "label", meaning: "A sticky note on a series, like stall=\"cendol\". Every new combination makes a new series." }
    ms: { term: "label", meaning: "Nota lekat pada siri, seperti stall=\"cendol\". Setiap gabungan baru jadi siri baru." }
  - id: time-series
    world: 2
    en: { term: "time series", meaning: "One metric name plus one set of labels: a line of values over time." }
    ms: { term: "time series (siri masa)", meaning: "Satu nama metrik dengan satu set label: satu garisan nilai dari masa ke masa." }
  - id: cardinality
    world: 2
    en: { term: "cardinality", meaning: "How many series a metric makes. Labels like user id or order id make far too many." }
    ms: { term: "kardinaliti", meaning: "Berapa banyak siri yang satu metrik hasilkan. Label seperti id pengguna atau id pesanan buat terlalu banyak." }
  - id: promql
    world: 2
    en: { term: "PromQL", meaning: "The language you use to ask Prometheus questions." }
    ms: { term: "PromQL", meaning: "Bahasa untuk tanya soalan kepada Prometheus." }
  - id: instant-vector
    world: 2
    en: { term: "instant vector", meaning: "One value per series, at one moment. Graphs draw these." }
    ms: { term: "instant vector (vektor instant)", meaning: "Satu nilai untuk setiap siri, pada satu saat. Graf lukis jenis ini." }
  - id: range-vector
    world: 2
    en: { term: "range vector", meaning: "Every sample per series in a window, like [5m]. Functions like rate() need one." }
    ms: { term: "range vector (vektor julat)", meaning: "Semua sampel setiap siri dalam satu tetingkap, seperti [5m]. Fungsi seperti rate() perlukannya." }
  - id: rate
    world: 2
    en: { term: "rate()", meaning: "How fast a counter grows, per second, averaged over a window. It handles restarts." }
    ms: { term: "rate()", meaning: "Berapa laju counter naik, sesaat, dipuratakan dalam satu tetingkap. Ia faham bila aplikasi mula semula." }
  - id: aggregation
    world: 2
    en: { term: "aggregation", meaning: "Adding many series into fewer: sum, avg, max, count, with by (…) to keep some labels." }
    ms: { term: "aggregation (pengagregatan)", meaning: "Gabungkan banyak siri jadi sedikit: sum, avg, max, count, dengan by (…) untuk kekalkan label tertentu." }
  - id: quantile
    world: 2
    en: { term: "quantile (p95)", meaning: "p95 = 95% of requests were this fast or faster. The slowest 5% took longer." }
    ms: { term: "kuantil (p95)", meaning: "p95 = 95% permintaan selaju ini atau lebih laju. 5% yang paling lambat ambil masa lebih." }
  - id: recording-rule
    world: 2
    en: { term: "recording rule", meaning: "A saved question: Prometheus runs it on a timer and keeps the answer as a new series." }
    ms: { term: "recording rule", meaning: "Soalan yang disimpan: Prometheus jalankannya ikut jadual dan simpan jawapan sebagai siri baru." }
  # --- World O3 terms (add new O3 terms below this line) ---
  - id: alerting-rule
    world: 3
    en: { term: "alert rule", meaning: "A PromQL question Prometheus asks again and again. When the answer has rows, the control room's bell gets ready." }
    ms: { term: "alert rule", meaning: "Soalan PromQL yang Prometheus tanya berulang kali. Bila jawapannya ada baris, loceng bilik kawalan bersedia." }
  - id: pending-alert
    world: 3
    en: { term: "pending", meaning: "The bell is ready but still waiting. The problem must last the whole `for` time before it rings (firing)." }
    ms: { term: "pending", meaning: "Loceng dah sedia tapi masih menunggu. Masalah mesti berterusan sepanjang masa `for` sebelum ia berbunyi (firing)." }
  - id: alertmanager
    world: 3
    en: { term: "Alertmanager", meaning: "The control room's dispatcher. It takes bells from Prometheus, groups them, picks who to call and stays quiet when told." }
    ms: { term: "Alertmanager", meaning: "Pengagih di bilik kawalan. Ia terima loceng dari Prometheus, kumpulkannya, pilih siapa dipanggil dan senyap bila disuruh." }
  - id: alert-route
    world: 3
    en: { term: "route", meaning: "A rule in Alertmanager that sends an alert to a receiver, by its labels. The first match wins." }
    ms: { term: "route (hala)", meaning: "Peraturan dalam Alertmanager yang hantar amaran ke penerima, ikut labelnya. Padanan pertama menang." }
  - id: alert-grouping
    world: 3
    en: { term: "grouping", meaning: "Alertmanager puts alerts with the same labels (like alertname and job) into one message, so ten bells make one call." }
    ms: { term: "grouping (kumpulan)", meaning: "Alertmanager satukan amaran yang sama label (contohnya alertname dan job) dalam satu mesej, jadi sepuluh loceng jadi satu panggilan." }
  - id: silence
    world: 3
    en: { term: "silence", meaning: "A note on the dispatcher's desk: don't call anyone for these alerts until a set time. It has an author and a reason." }
    ms: { term: "silence (senyap)", meaning: "Nota atas meja pengagih: jangan panggil sesiapa untuk amaran ini hingga masa tertentu. Ia ada penulis dan sebab." }
  - id: inhibition
    world: 3
    en: { term: "inhibition", meaning: "While a big alert fires (the whole site is down), Alertmanager mutes the smaller alerts it causes." }
    ms: { term: "inhibition", meaning: "Semasa amaran besar berbunyi (seluruh laman mati), Alertmanager senyapkan amaran kecil yang berpunca daripadanya." }
  - id: symptom-alert
    world: 3
    en: { term: "symptom", meaning: "What the customer feels: failed orders, slow pages. Alert on symptoms; look at causes (CPU, disk) on the screens." }
    ms: { term: "simptom", meaning: "Apa yang pelanggan rasa: pesanan gagal, laman lambat. Beri amaran pada simptom; tengok punca (CPU, cakera) di skrin." }
  - id: grafana-panel
    world: 3
    en: { term: "panel", meaning: "One screen on the control room wall. Each panel runs one query and draws it: a line graph, a big number, a gauge or a table." }
    ms: { term: "panel", meaning: "Satu skrin di dinding bilik kawalan. Setiap panel jalankan satu query dan lukisnya: graf garis, nombor besar, gauge atau jadual." }
  - id: dashboard-variable
    world: 3
    en: { term: "dashboard variable", meaning: "A drop-down at the top of a Grafana dashboard. Pick shop-2 and every panel's query swaps $instance for shop-2." }
    ms: { term: "dashboard variable", meaning: "Senarai pilihan di atas dashboard Grafana. Pilih shop-2 dan query setiap panel tukar $instance kepada shop-2." }
  - id: burn-rate
    world: 3
    en: { term: "burn rate", meaning: "How fast you spend the error budget. 1 means it lasts exactly the SLO window; 14.4 means a month's budget is gone in about two days." }
    ms: { term: "burn rate", meaning: "Berapa laju bajet ralat dibelanjakan. 1 bermaksud ia cukup tepat sepanjang tempoh SLO; 14.4 bermaksud bajet sebulan habis dalam lebih kurang dua hari." }
  - id: runbook
    world: 3
    en: { term: "runbook", meaning: "The fix-it card next to the bell: what this alert means, what to check first and how to make it safe." }
    ms: { term: "runbook", meaning: "Kad baiki di sebelah loceng: maksud amaran ini, apa nak semak dulu dan cara jadikannya selamat." }
  # --- World O4 terms (add new O4 terms below this line) ---
  - id: structured-log
    world: 4
    en: { term: "structured log", meaning: "A diary line with named fields, like JSON: level, msg, order_id. Computers can filter it; people can still read it." }
    ms: { term: "log berstruktur", meaning: "Baris diari dengan medan bernama, macam JSON: level, msg, order_id. Komputer boleh tapis; manusia masih boleh baca." }
  - id: loki
    world: 4
    en: { term: "Loki", meaning: "Grafana's log store. It indexes only the labels of each diary, not every word, so it stays small and cheap." }
    ms: { term: "Loki", meaning: "Stor log Grafana. Ia indeks label setiap diari sahaja, bukan setiap perkataan, jadi ia kekal kecil dan murah." }
  - id: logql
    world: 4
    en: { term: "LogQL", meaning: "Loki's query language. Pick diaries by label in braces, then filter lines: {app=\"kedai-api\"} |= \"timeout\"." }
    ms: { term: "LogQL", meaning: "Bahasa query Loki. Pilih diari ikut label dalam kurungan, kemudian tapis baris: {app=\"kedai-api\"} |= \"timeout\"." }
  - id: log-stream
    world: 4
    en: { term: "log stream", meaning: "One diary in Loki: all lines with the same set of labels. Too many label values make too many diaries." }
    ms: { term: "log stream", meaning: "Satu diari dalam Loki: semua baris dengan set label yang sama. Terlalu banyak nilai label buat terlalu banyak diari." }
  - id: otel-sdk
    world: 4
    en: { term: "OpenTelemetry SDK", meaning: "The library inside your app that writes down metrics, logs and spans, then sends them out with OTLP." }
    ms: { term: "OpenTelemetry SDK", meaning: "Pustaka dalam aplikasi anda yang catat metrik, log dan span, kemudian hantarnya keluar dengan OTLP." }
  - id: otel-collector
    world: 4
    en: { term: "Collector", meaning: "OpenTelemetry's sorting office. Receivers take data in, processors tidy it, exporters send it on, joined by pipelines." }
    ms: { term: "Collector", meaning: "Pejabat sortir OpenTelemetry. Receiver terima data, processor kemaskan, exporter hantar keluar, disambung oleh pipeline." }
  - id: otlp
    world: 4
    en: { term: "OTLP", meaning: "The OpenTelemetry Protocol: one shared way to send metrics, logs and traces. Usually port 4317 (gRPC) or 4318 (HTTP)." }
    ms: { term: "OTLP", meaning: "OpenTelemetry Protocol: satu cara sama untuk hantar metrik, log dan trace. Selalunya port 4317 (gRPC) atau 4318 (HTTP)." }
  - id: trace-span
    world: 4
    en: { term: "span", meaning: "One step of an order, with a start and an end time. Spans nest: a parent span holds child spans." }
    ms: { term: "span", meaning: "Satu langkah pesanan, dengan masa mula dan tamat. Span bersarang: span induk ada span anak." }
  - id: trace-id
    world: 4
    en: { term: "trace ID", meaning: "The order number every span and log line of one request shares: 32 hex characters." }
    ms: { term: "trace ID", meaning: "Nombor pesanan yang dikongsi setiap span dan baris log satu permintaan: 32 aksara hex." }
  - id: context-propagation
    world: 4
    en: { term: "context propagation", meaning: "Passing the trace ID to the next service, in a traceparent header, so the order keeps its number." }
    ms: { term: "context propagation", meaning: "Hantar trace ID ke servis seterusnya, dalam header traceparent, supaya pesanan kekal dengan nombornya." }
  - id: exemplar
    world: 4
    en: { term: "exemplar", meaning: "A sample trace ID pinned to a metric point. Click the dot on the graph, open that very order's trace." }
    ms: { term: "exemplar", meaning: "Contoh trace ID yang dilekat pada titik metrik. Klik titik pada graf, buka trace pesanan itu sendiri." }
  - id: incident-commander
    world: 4
    en: { term: "incident commander", meaning: "The one person who runs an incident: sets the plan, gives jobs and decides. They don't fix things themselves." }
    ms: { term: "incident commander", meaning: "Seorang yang mengetuai insiden: tetapkan pelan, beri tugas dan buat keputusan. Dia tidak baiki sendiri." }
  - id: blameless-postmortem
    world: 4
    en: { term: "blameless postmortem", meaning: "A written look back after an incident. It asks what made the mistake easy, never who to blame." }
    ms: { term: "postmortem tanpa menuding jari", meaning: "Catatan selepas insiden. Ia tanya apa yang buat kesilapan itu mudah berlaku, bukan siapa nak dipersalahkan." }
